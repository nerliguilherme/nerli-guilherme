<title>Dragon Sushi Cardápio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Dela+Gothic+One&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: cardápio digital mobile-first — hero tipográfico com sol vermelho, nav de categorias fixa, seções com kanji gigante ao fundo */
:root{
  --ink:#0e0b0c; --ink-2:#181314; --ink-3:#221b1c; --line:#2e2526;
  --fg:#f5f0ef; --muted:#a8999b; --red:#e3262f; --red-hot:#ff3b44; --red-deep:#8f1219; --paper:#fbf8f7;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-jp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 132px)}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--red-hot);outline-offset:3px;border-radius:6px}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;padding-block:28px 40px;isolation:isolate}
.hero .sun{position:absolute;z-index:-1;width:min(132vw,820px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,var(--red) 0 58%,transparent 58.3%);
  right:-34%;top:-30%;opacity:.95;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
.hero .waves{position:absolute;inset:auto 0 0;height:120px;z-index:-1;opacity:.18;
  background:radial-gradient(circle at 50% 100%,transparent 18px,var(--fg) 19px 20px,transparent 21px) 0 0/40px 20px repeat-x,
             radial-gradient(circle at 50% 100%,transparent 18px,var(--fg) 19px 20px,transparent 21px) 20px 20px/40px 20px repeat-x,
             radial-gradient(circle at 50% 100%,transparent 18px,var(--fg) 19px 20px,transparent 21px) 0 40px/40px 20px repeat-x;
  -webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000)}
@keyframes rise{from{transform:translateY(18%) scale(.92);opacity:0}to{transform:none;opacity:.95}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{width:84px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.vert{font-family:var(--f-jp);writing-mode:vertical-rl;font-size:15px;letter-spacing:.35em;color:var(--fg);opacity:.9}
.word{font-family:var(--f-display);font-weight:800;line-height:.82;letter-spacing:-.005em;margin:34px 0 0;
  font-size:clamp(76px,24vw,184px);font-variation-settings:"wdth" 75,"opsz" 96;text-transform:uppercase}
.word span{display:inline-block;animation:flex 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + .2s)}
@keyframes flex{0%{font-weight:200;font-variation-settings:"wdth" 100,"opsz" 96;opacity:0;transform:translateY(30%)}
  60%{opacity:1}100%{font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;transform:none}}
.word.l2{color:transparent;-webkit-text-stroke:2px var(--fg);margin-top:4px;letter-spacing:.02em}
.word.l2 span{animation-delay:calc(var(--i)*70ms + .55s)}
.tag{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-top:22px;max-width:46ch}
.tag p{margin:0;color:var(--muted);font-size:15px}
.tag strong{font-family:var(--f-display);font-variation-settings:"wdth" 85;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--fg);background:var(--red-deep);padding:4px 10px;border-radius:99px}

/* ---------- MARQUEE ---------- */
.marquee{border-block:1px solid var(--line);overflow:hidden;background:var(--ink-2)}
.marquee .track{display:flex;gap:28px;width:max-content;padding-block:10px;animation:slide 38s linear infinite;
  font-family:var(--f-display);font-weight:600;font-variation-settings:"wdth" 80;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.marquee i{color:var(--red);font-style:normal;font-family:var(--f-jp);letter-spacing:0}
@keyframes slide{to{transform:translateX(-50%)}}

/* ---------- NAV ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ink) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.search{display:flex;gap:8px;align-items:center}
.search label{position:relative;flex:1;min-width:0}
.search input{width:100%;font:500 15px var(--f-body);color:var(--fg);background:var(--ink-3);border:1px solid var(--line);border-radius:12px;padding:11px 14px 11px 38px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:16px;height:16px;stroke:var(--muted)}
.veg{flex:none;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 12px;cursor:pointer}
.veg[aria-pressed="true"]{background:#1d6b3a;border-color:#2c8a50}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--muted);font:600 13px var(--f-body);padding:7px 13px;border-radius:99px;border:1px solid var(--line);transition:.25s}
.chips a.on{color:var(--fg);background:var(--red);border-color:var(--red)}

/* ---------- SECTIONS ---------- */
main{padding-block:8px 40px;overflow-x:clip}
.sec{position:relative;padding-block:46px 8px}
.sec[hidden]{display:none}
.kanji{position:absolute;right:-6px;top:22px;font-family:var(--f-jp);font-size:clamp(84px,22vw,150px);line-height:1;color:var(--ink-2);z-index:-1;pointer-events:none;user-select:none;writing-mode:vertical-rl}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--fg)}
.sec-head h2{min-width:0;margin:0;font-family:var(--f-display);text-transform:uppercase;line-height:.86;letter-spacing:-.02em;
  font-size:clamp(44px,12vw,78px);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;text-wrap:balance;transition:font-variation-settings .8s cubic-bezier(.2,.8,.2,1),letter-spacing .8s}
.sec.on .sec-head h2{font-variation-settings:"wdth" 88,"opsz" 96;letter-spacing:-.01em}
.sec-head h2 small{display:block;font:600 11px var(--f-mono);letter-spacing:.14em;color:var(--red-hot);margin-bottom:8px}
.sec-meta{font:500 11px var(--f-mono);color:var(--muted);text-align:right;line-height:1.6;white-space:nowrap}
.note{margin:12px 0 0;font-size:13px;color:var(--muted)}
.note b{color:var(--fg)}

.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding-block:16px;border-bottom:1px solid var(--line);align-items:start}
.item .nm{min-width:0}
.item h3{margin:0;font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 88,"opsz" 24;font-size:19px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.item .cd{font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.06em;margin-right:6px;vertical-align:2px}
.item p{margin:4px 0 0;color:var(--muted);font-size:13.5px;line-height:1.45;max-width:52ch}
.badge{display:inline-block;margin-left:6px;vertical-align:3px;font:700 9.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:#1d6b3a;color:#e6fff0}
.badge.fire{background:var(--red-deep);color:#ffe3e4}
.price{font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 80,"opsz" 48;font-size:22px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:1px;transition:color .2s}
.price sup{font-size:.48em;font-weight:600;vertical-align:.95em;margin-right:2px;color:var(--muted)}
.price sub{font-size:.5em;vertical-align:.9em;font-weight:600}
.item:hover .price{color:var(--red-hot)}

/* combos */
.combos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-top:18px}
.combo{position:relative;overflow:hidden;background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.combo.hot{background:var(--red);border-color:var(--red)}
.combo .n{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;font-size:84px;line-height:.8;letter-spacing:-.01em}
.combo .n span{font-size:15px;letter-spacing:.12em;font-variation-settings:"wdth" 85;margin-left:6px;text-transform:uppercase}
.combo h3{margin:0;font:700 16px var(--f-body)}
.combo .cd{font:500 10.5px var(--f-mono);opacity:.7;letter-spacing:.06em}
.combo ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.combo li{font-size:12px;padding:3px 8px;border-radius:7px;background:var(--ink-3);color:var(--fg)}
.combo.hot li{background:rgba(0,0,0,.22)}
.combo .price{font-size:30px;margin-top:auto}
.combo.hot .price sup{color:inherit;opacity:.75}
.combo .per{font:500 11px var(--f-mono);opacity:.75}

.empty{padding:60px 0;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:28px;color:var(--fg);font-variation-settings:"wdth" 80}

footer{border-top:1px solid var(--line);padding-block:40px 56px;text-align:center}
footer img{width:110px}
footer p{color:var(--muted);font-size:12.5px;margin:14px auto 0;max-width:42ch}

@media (min-width:720px){.logo{width:104px}.item h3{font-size:21px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

const $=s=>document.querySelector(s);
const brl=v=>`<sup>R$</sup>${v}<sub>,00</sub>`;
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const tagHtml=t=>t==="veg"?'<span class="badge">Vegano</span>':t==="fire"?'<span class="badge fire">Maçaricado</span>':"";

function render(){
  const menu=$("#menu");let h="";
  for(const c of M){
    const prices=c.items.map(i=>i[2]);
    h+=`<section class="sec" id="${c.id}" data-id="${c.id}"><span class="kanji" aria-hidden="true">${c.jp}</span>
      <div class="sec-head"><h2><small>${c.jp} · ${c.items.length} opções</small>${c.t}</h2>
      <div class="sec-meta">a partir de<br><b style="color:var(--fg);font-size:13px">R$ ${Math.min(...prices)},00</b></div></div>
      ${c.note?`<p class="note">${c.note}</p>`:""}`;
    if(c.combo){
      h+=`<div class="combos">`+c.items.map(([cd,nm,p,n,parts,hot])=>`<article class="combo${hot?" hot":""}" data-s="${norm(cd+" "+nm+" "+parts.join(" "))}">
        <div class="n">${n}<span>peças</span></div>
        <div><span class="cd">${cd}</span><h3>${nm.replace(/ \d+ peças/,"")}${hot?" · Dragon":""}</h3></div>
        <ul>${parts.map(x=>`<li>${x}</li>`).join("")}</ul>
        <div class="price">${brl(p)}</div><span class="per">≈ R$ ${(p/n).toFixed(2).replace(".",",")} por peça</span></article>`).join("")+`</div>`;
    }else{
      h+=`<ul class="list">`+c.items.map(([cd,nm,p,d,t])=>`<li class="item" data-s="${norm(cd+" "+nm+" "+(d||""))}" data-t="${t||""}">
        <div class="nm"><h3><span class="cd">${cd}</span>${nm}${tagHtml(t)}</h3>${d?`<p>${d}</p>`:""}</div>
        <div class="price">${brl(p)}</div></li>`).join("")+`</ul>`;
    }
    h+=`</section>`;
  }
  h+=`<div class="empty" id="empty" hidden><b>Nada encontrado</b>Tente outro nome, ingrediente ou código.</div>`;
  menu.innerHTML=h;
  $("#chips").innerHTML=M.map(c=>`<a href="#${c.id}" data-id="${c.id}">${c.t}</a>`).join("");
  const mq=M.map(c=>`<span>${c.t}</span><i>${c.jp}</i>`).join("");
  $("#mq").innerHTML=mq+mq;
}
render();

/* filtro */
let veg=false;
function filter(){
  const q=norm($("#q").value.trim());let any=0;
  document.querySelectorAll(".sec").forEach(s=>{
    let n=0;
    s.querySelectorAll("[data-s]").forEach(el=>{
      const ok=(!q||el.dataset.s.includes(q))&&(!veg||el.dataset.t==="veg");
      el.hidden=!ok;if(ok)n++;
    });
    s.hidden=!n;any+=n;
    const chip=document.querySelector(`.chips a[data-id="${s.id}"]`);if(chip)chip.hidden=!n;
  });
  $("#empty").hidden=!!any;
}
$("#q").addEventListener("input",filter);
$("#veg").addEventListener("click",e=>{veg=!veg;e.currentTarget.setAttribute("aria-pressed",veg);filter();});

/* categoria ativa */
const chips=[...document.querySelectorAll(".chips a")];
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{
    e.target.classList.toggle("on",e.isIntersecting);
    if(e.isIntersecting){
      chips.forEach(a=>a.classList.toggle("on",a.dataset.id===e.target.id));
      const a=chips.find(a=>a.dataset.id===e.target.id);
      if(a){const box=a.parentElement;box.scrollTo({left:a.offsetLeft-box.clientWidth/2+a.clientWidth/2,behavior:"smooth"});}
    }
  });
},{rootMargin:"-35% 0px -55% 0px"});
document.querySelectorAll(".sec").forEach(s=>io.observe(s));
</script>
