      <td>${p.status==="conferido"?html`<span class="pill ok">Conferido</span>`:html`<span class="pill warn">${pass}/7 passos</span>`}</td>
      <td class="r"><div class="row" style=${{justifyContent:"flex-end",flexWrap:"nowrap"}}><button class="btn sm" onClick=${()=>setAberto(p.id)}>Abrir</button>${S.admin&&html`<button class="btn sm ghost danger" onClick=${()=>setDel(p)}>Excluir</button>`}</div></td></tr>`})}
  </tbody></table></div>`:html`<${Empty} title="Nenhum projeto lido ainda" text="Comece enviando o PDF de um projeto elétrico. Sem PDF, dá para criar o projeto e contar os pontos à mão, cômodo por cômodo."><button class="btn pri" onClick=${()=>setAberto("novo")}>Ler o primeiro projeto</button><//>`}
  ${aberto&&html`<${EditorProjeto} id=${aberto} onClose=${()=>setAberto(null)} go=${go}/>`}
  ${del&&html`<${Confirm} text=${`Excluir o projeto "${del.nome}"? Orçamentos já gerados continuam salvos.`} onNo=${()=>setDel(null)} onYes=${()=>{S.api.del("projetos",del.id,"Projeto excluído.");setDel(null)}}/>`}`;
};

function EditorProjeto({id,onClose,go}){
  const S=useS();
  const salvo=id!=="novo"&&S.data.projetos.find(p=>p.id===id);
  const [pj,setPj]=useState(()=>salvo?JSON.parse(JSON.stringify(salvo)):{id:uid(),nome:"",cliente:"",tipo:"residencial",carimbo:{},comodos:[],circuitos:[],metragem:{},passos:{},alertas:[],status:"rascunho",criadoEm:new Date().toISOString()});
  const [paginas,setPaginas]=useState([]);
  const [sel,setSel]=useState([]);
  const [ver,setVer]=useState(null);
  const [zoom,setZoom]=useState(1);
  const [prog,setProg]=useState("");
  const [erro,setErro]=useState("");
  const [dica,setDica]=useState("");
  const [tab,setTab]=useState("planta");
  const [dirty,setDirty]=useState(id==="novo");
  const [conferir,setConferir]=useState(false);
  const fileRef=useRef(null);
  const set=p=>{setPj(x=>({...x,...p}));setDirty(true)};
  const passo=(k,v)=>set({passos:{...pj.passos,[k]:v}});

  // abrir prancha salva
  useEffect(()=>{
    if(!salvo||!salvo.assetId||paginas.length)return;
    (async()=>{try{setProg("Abrindo a prancha salva…");const r=await fetch("/_blob/"+salvo.assetId);if(!r.ok)throw 0;const b=await r.blob();const f=new File([b],salvo.arquivo||"projeto.pdf",{type:b.type||"application/pdf"});const ps=await arquivoParaPaginas(f,setProg);setPaginas(ps);setSel(ps.map(p=>p.n));setVer(ps[0]||null)}catch{}finally{setProg("")}})();
  },[]);

  const onFile=async e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;setErro("");
    try{
      const ps=await arquivoParaPaginas(f,setProg);setPaginas(ps);setSel(ps.slice(0,6).map(p=>p.n));setVer(ps[0]);
      set({arquivo:f.name,nome:pj.nome||f.name.replace(/\.[^.]+$/,"")});
      const as=await window.claude?.use?.("assets");
      if(as&&f.size<20e6){setProg("Guardando a prancha para a equipe consultar…");try{const r=await as.upload(f);set({assetId:r.id,arquivo:f.name})}catch(err){console.warn(err)}}
    }catch(err){setErro(err.message||"Não foi possível abrir o arquivo.")}finally{setProg("")}
  };

  const rodarIA=async()=>{
    setErro("");
    const pgs=paginas.filter(p=>sel.includes(p.n));
    if(!pgs.length){setErro("Selecione ao menos uma página.");return}
    try{
      const r=await lerComIA(pgs,S,dica,setProg);
      const ids=new Set(S.pontos.map(p=>p.id));
      const comodos=(r.comodos||[]).map(c=>({id:uid(),nome:String(c.nome||"Cômodo"),itens:Object.fromEntries(Object.entries(c.itens||{}).filter(([k,v])=>ids.has(k)&&num(v)>0).map(([k,v])=>[k,num(v)]))}));
      const novo={...pj,comodos,circuitos:(r.circuitos||[]).map(c=>({id:uid(),...c})),metragem:r.metragem||{},alertas:r.alertas||[],confianca:r.confianca||"",carimbo:{...pj.carimbo,...(r.carimbo||{})},tipo:r.tipo==="industrial"?"industrial":pj.tipo,lidoPorIA:true,iaOriginal:totaisProjeto({comodos})};
      if(!novo.cliente&&r.carimbo&&r.carimbo.cliente)novo.cliente=r.carimbo.cliente;
      setPj(novo);setDirty(true);setTab("planta");S.toast("Leitura feita. Agora confira passo a passo.");
    }catch(e){setErro((e&&e.message)||"A IA não conseguiu ler. Tente menos páginas ou faça a contagem manual.")}finally{setProg("")}
  };

  const salvar=async(extra={},msg="Projeto salvo.")=>{const o={...pj,...extra};setPj(o);const ok=await S.api.set("projetos",o.id,o,msg);if(ok)setDirty(false);return ok};
  const tot=totaisProjeto(pj);
  const nomeP=k=>(S.pontos.find(p=>p.id===k)||{nome:k}).nome;
  const total=Object.values(tot).reduce((a,b)=>a+b,0);
  const nPass=PASSOS.filter(p=>pj.passos[p.id]).length;

  const gerarOrc=async()=>{
    if(dirty&&!(await salvar({},null)))return;
    const linhas=linhasDoProjeto(pj,S);
    const o={id:uid(),numero:proxNumero(S.data.orcamentos,"ORC-"),cliente:pj.cliente||pj.carimbo.cliente||"",endereco:pj.carimbo.endereco||"",telefone:"",projetoId:pj.id,tipo:pj.tipo,linhas,deslocamento:S.config.deslocamentoPadrao,desconto:0,impostoPct:S.config.impostoPct,clienteMaterial:false,etapa:"orcamento",probabilidade:50,criadoEm:new Date().toISOString(),condicoes:"50% de entrada e 50% na entrega.",prazo:""};
    const nid=await S.api.add("orcamentos",o,"Orçamento criado a partir do projeto.");
    if(nid){onClose();go("orcamentos",nid)}
  };

  const actions=html`<span class=${"pill "+(pj.status==="conferido"?"ok":"warn")}>${pj.status==="conferido"?"Conferido":`${nPass}/7 passos`}</span>
    <button class="btn" disabled=${!dirty} onClick=${()=>salvar()}>${dirty?"Salvar":"Salvo"}</button>`;

  return html`<${Modal} title=${pj.nome||"Novo projeto"} onClose=${()=>{onClose()}} actions=${actions}>
    <div class="grid g3">
      <${F} label="Nome do projeto"><${Inp} id="pj-nome" value=${pj.nome} onChange=${v=>set({nome:v})} placeholder="Ex.: Residência Silva"/><//>
      <${F} label="Cliente"><${Inp} id="pj-cli" value=${pj.cliente} onChange=${v=>set({cliente:v})} list="lst-cli"/><//>
      <${F} label="Tipo de obra"><${Sel} id="pj-tipo" value=${pj.tipo} onChange=${v=>set({tipo:v})} opts=${[["residencial","Residencial / predial"],["industrial","Industrial"]]}/><//>
    </div>
    <datalist id="lst-cli">${S.data.clientes.map(c=>html`<option value=${c.nome}/>`)}</datalist>

    <div class="card col">
      <div class="row" style=${{justifyContent:"space-between"}}><h3>Prancha</h3>
        <div class="row"><input ref=${fileRef} type="file" accept="application/pdf,image/*" hidden onChange=${onFile}/><button class="btn" onClick=${()=>fileRef.current.click()}>${paginas.length?"Trocar arquivo":"Enviar PDF ou foto"}</button></div></div>
      ${prog&&html`<div class="alert info"><span class="spin"></span><span>${prog}</span></div>`}
      ${erro&&html`<div class="alert bad">${erro}</div>`}
      ${paginas.length?html`
        <div class="small muted">Toque nas páginas que têm planta, quadro de cargas ou unifilar (a IA lê só as marcadas). Clique em "ver" para abrir grande.</div>
        <div class="pages">${paginas.map(p=>html`<div key=${p.n} class="pg" role="button" tabindex="0" aria-pressed=${sel.includes(p.n)} onClick=${()=>setSel(s=>s.includes(p.n)?s.filter(x=>x!==p.n):[...s,p.n])}>
          <img src=${p.url} alt=${"Página "+p.n}/><div class="row" style=${{justifyContent:"space-between"}}><span>${sel.includes(p.n)?"✓ ":""}Pág. ${p.n}</span><button class="btn sm ghost" onClick=${e=>{e.stopPropagation();setVer(p)}}>ver</button></div></div>`)}</div>
        <div class="grid" style=${{gridTemplateColumns:"1fr auto",alignItems:"end"}}>
          <${F} label="Observação para a IA (opcional)"><${Inp} id="pj-dica" value=${dica} onChange=${setDica} placeholder="Ex.: a cozinha tem 2 TUEs de forno e cooktop"/><//>
          <button class="btn pri" disabled=${!!prog} onClick=${rodarIA}>${pj.lidoPorIA?"Ler de novo com IA":"Ler com IA"}</button>
        </div>
        ${ver&&html`<div class="col"><div class="row"><b>Página ${ver.n}</b><button class="btn sm" onClick=${()=>setZoom(z=>Math.max(.25,z-.25))}>Zoom −</button><button class="btn sm" onClick=${()=>setZoom(z=>Math.min(3,z+.25))}>Zoom +</button><span class="small muted mono">${Math.round(zoom*100)}%</span></div>
          <div class="viewer"><img src=${ver.url} style=${{width:(zoom*100)+"%"}} alt=${"Prancha página "+ver.n}/></div></div>`}
      `:html`<p class="muted small" style=${{margin:0}}>${salvo&&salvo.assetId?"":"Sem prancha anexada. Você pode contar os pontos à mão nas abas abaixo."}</p>`}
    </div>

    ${(pj.alertas||[]).length?html`<div class="alert warn"><div><b>Dúvidas da leitura${pj.confianca?` (confiança ${pj.confianca})`:""}:</b><ul style=${{margin:"4px 0 0",paddingLeft:18}}>${pj.alertas.map((a,i)=>html`<li key=${i}>${a}</li>`)}</ul></div></div>`:null}

    <${Tabs} value=${tab} onChange=${setTab} tabs=${[["carimbo","1–2 · Carimbo e legenda"],["cargas","3 · Quadro de cargas"],["planta","4 · Planta por cômodo"],["metragem","5 · Metragem"],["quadro","6–7 · Quadro e conferência"]]}/>

    ${tab==="carimbo"&&html`<div class="col">
      <div class="grid g3">${[["cliente","Cliente"],["endereco","Endereço"],["escala","Escala"],["revisao","Revisão"],["tensao","Tensão"],["area","Área"]].map(([k,l])=>html`<${F} key=${k} label=${l}><${Inp} id=${"cb-"+k} value=${pj.carimbo[k]} onChange=${v=>set({carimbo:{...pj.carimbo,[k]:v}})}/><//>`)}</div>
      <${PassoChk} pj=${pj} ids=${["carimbo","legenda"]} passo=${passo}/></div>`}

    ${tab==="cargas"&&html`<div class="col">
      <div class="tbl-wrap"><table><thead><tr><th>Nº</th><th>Descrição</th><th class="r">Potência (W)</th><th class="r">Disjuntor (A)</th><th class="r">Bitola (mm²)</th><th>Polos</th><th></th></tr></thead><tbody>
      ${(pj.circuitos||[]).map((c,i)=>{const up=p=>set({circuitos:pj.circuitos.map(x=>x.id===c.id?{...x,...p}:x)});
        return html`<tr key=${c.id}><td style=${{width:60}}><${Inp} value=${c.num} onChange=${v=>up({num:v})}/></td><td><${Inp} value=${c.desc} onChange=${v=>up({desc:v})}/></td>
        <td style=${{width:110}}><${Inp} type="number" value=${c.potencia} onChange=${v=>up({potencia:v})}/></td><td style=${{width:100}}><${Inp} type="number" value=${c.disjuntor} onChange=${v=>up({disjuntor:v})}/></td>
        <td style=${{width:100}}><${Inp} type="number" value=${c.bitola} onChange=${v=>up({bitola:v})}/></td><td style=${{width:80}}><${Sel} value=${String(c.polos||1)} onChange=${v=>up({polos:num(v)})} opts=${[["1","1"],["2","2"],["3","3"]]}/></td>
        <td><button class="btn sm ghost danger" aria-label="Remover circuito" onClick=${()=>set({circuitos:pj.circuitos.filter(x=>x.id!==c.id)})}>✕</button></td></tr>`})}
      </tbody></table></div>
      <div class="row"><button class="btn sm" onClick=${()=>set({circuitos:[...(pj.circuitos||[]),{id:uid(),num:String((pj.circuitos||[]).length+1),desc:"",potencia:0,disjuntor:0,bitola:2.5,polos:1}]})}>+ Circuito</button>
        ${(pj.circuitos||[]).length?html`<span class="small muted">Total instalado: <b class="num">${n2((pj.circuitos||[]).reduce((a,c)=>a+num(c.potencia),0))} W</b></span>`:null}</div>
      <${PassoChk} pj=${pj} ids=${["cargas"]} passo=${passo}/></div>`}

    ${tab==="planta"&&html`<div class="col">
      ${!S.pontos.length&&html`<div class="alert warn">Cadastre os tipos de ponto em Preços e custos antes de contar.</div>`}
      ${(pj.comodos||[]).map(c=>html`<${Comodo} key=${c.id} c=${c} pontos=${S.pontos} onChange=${nc=>set({comodos:pj.comodos.map(x=>x.id===c.id?nc:x)})} onDel=${()=>set({comodos:pj.comodos.filter(x=>x.id!==c.id)})}/>`)}
      <div class="row"><button class="btn" onClick=${()=>set({comodos:[...(pj.comodos||[]),{id:uid(),nome:"Cômodo "+((pj.comodos||[]).length+1),itens:{}}]})}>+ Cômodo</button>
        ${["Sala","Cozinha","Quarto","Banheiro","Área de serviço","Varanda","Quadro"].map(n=>html`<button key=${n} class="btn sm ghost" onClick=${()=>set({comodos:[...(pj.comodos||[]),{id:uid(),nome:n,itens:{}}]})}>+ ${n}</button>`)}</div>
      <${PassoChk} pj=${pj} ids=${["planta"]} passo=${passo}/></div>`}

    ${tab==="metragem"&&html`<div class="col">
      <p class="small muted" style=${{margin:0}}>Meça na prancha com a escala. Deixando tudo zerado, o orçamento usa a média por ponto e avisa que é estimativa.</p>
      <div class="grid g4">${METRAGENS.map(([k,l])=>html`<${F} key=${k} label=${l+" (m)"}><${Num} id=${"mt-"+k} step=${5} value=${(pj.metragem||{})[k]||0} onChange=${v=>set({metragem:{...pj.metragem,[k]:v}})}/><//>`)}</div>
      <div class="small muted">Estimativa pela média: ${Object.entries(metragemEstimada(tot)).filter(([,v])=>v).map(([k,v])=>`${(METRAGENS.find(m=>m[0]===k)||[k,k])[1]} ${v} m`).join(" · ")||"—"}</div>
      <${PassoChk} pj=${pj} ids=${["caminhos"]} passo=${passo}/></div>`}

    ${tab==="quadro"&&html`<div class="col">
      <div class="grid g2" style=${{alignItems:"start"}}>
        <div class="card col"><h3>Resumo da contagem</h3>
          ${total?html`<div class="tbl-wrap"><table><tbody>${Object.entries(tot).map(([k,q])=>{const ia=pj.iaOriginal&&pj.iaOriginal[k];const dif=pj.iaOriginal&&(ia||0)!==q;
            return html`<tr key=${k}><td>${nomeP(k)}</td><td class="r num">${q}</td>${pj.iaOriginal?html`<td class="r small">${dif?html`<span class="pill warn">IA: ${ia||0}</span>`:html`<span class="muted">igual IA</span>`}</td>`:null}</tr>`})}</tbody></table></div>`:html`<p class="muted" style=${{margin:0}}>Nada contado ainda.</p>`}
          <div class="small"><b class="num">${total}</b> itens · <b class="num">${(pj.circuitos||[]).length}</b> circuitos no quadro de cargas · disjuntores contados: <b class="num">${(tot.dj1||0)+(tot.dj2||0)+(tot.dj3||0)}</b></div>
          ${(pj.circuitos||[]).length&&((tot.dj1||0)+(tot.dj2||0)+(tot.dj3||0))!==(pj.circuitos||[]).length?html`<div class="alert warn">O número de disjuntores (${(tot.dj1||0)+(tot.dj2||0)+(tot.dj3||0)}) não bate com o de circuitos (${pj.circuitos.length}). Confira o unifilar.</div>`:null}
          ${(tot.chuv||tot.ar||tot.tue)&&!(pj.circuitos||[]).some(c=>num(c.disjuntor)>=25)?html`<div class="alert warn">Há chuveiro/ar/TUE mas nenhum circuito de 25A ou mais no quadro de cargas.</div>`:null}
        </div>
        <div class="card col"><h3>Passos</h3>
          ${PASSOS.map((p,i)=>html`<label class="chk" key=${p.id}><input type="checkbox" checked=${!!pj.passos[p.id]} onChange=${e=>passo(p.id,e.target.checked)}/> ${i+1}. ${p.t}</label>`)}
          ${S.admin?html`<button class="btn pri" disabled=${nPass<7||!total} onClick=${()=>setConferir(true)}>${pj.status==="conferido"?"Conferido ✓ (conferir de novo)":"Marcar como conferido"}</button>
            ${nPass<7&&html`<span class="small muted">Marque os 7 passos para liberar.</span>`}`:html`<span class="small muted">Só o patrão marca o projeto como conferido.</span>`}
          ${pj.status==="conferido"&&S.admin&&html`<button class="btn" onClick=${gerarOrc}>Gerar orçamento deste projeto</button>`}
        </div>
      </div></div>`}
    ${conferir&&html`<${ConferirModal} pj=${pj} tot=${tot} nomeP=${nomeP} onClose=${()=>setConferir(false)} onOk=${async regra=>{
      if(regra&&regra.trim()){const r=(S.config.regras?S.config.regras+"\n":"")+"• "+regra.trim();await S.api.setMeta("config",{...S.config,regras:r},null)}
      await salvar({status:"conferido",conferidoEm:new Date().toISOString(),conferidoPor:S.me.id},"Projeto conferido. Já pode gerar o orçamento.");setConferir(false)}}/>`}
  <//>`;
}
function PassoChk({pj,ids,passo}){return html`<div class="row" style=${{borderTop:"1px solid var(--line)",paddingTop:10}}>${ids.map(k=>{const p=PASSOS.find(x=>x.id===k);return html`<label class="chk" key=${k}><input type="checkbox" checked=${!!pj.passos[k]} onChange=${e=>passo(k,e.target.checked)}/> Conferi: ${p.t}</label>`})}<span class="small muted" style=${{flexBasis:"100%"}}>${ids.map(k=>PASSOS.find(x=>x.id===k).d).join(" ")}</span></div>`}
function Comodo({c,pontos,onChange,onDel}){
  const [add,setAdd]=useState("");
  const it=Object.entries(c.itens||{});
  const P=k=>pontos.find(p=>p.id===k);
  const grupos=[...new Set(pontos.map(p=>p.grupo))];
  return html`<div class="comodo"><div class="comodo-h"><input class="i" style=${{flex:1,minWidth:140,fontWeight:600}} value=${c.nome} onChange=${e=>onChange({...c,nome:e.target.value})} aria-label="Nome do cômodo"/>
    <span class="small muted num">${it.reduce((a,[,q])=>a+num(q),0)} itens</span><button class="btn sm ghost danger" onClick=${onDel}>Remover</button></div>
    <div class="comodo-b">
      ${it.map(([k,q])=>html`<div class="it" key=${k}><span class="nm">${(P(k)||{nome:k+" (não cadastrado)"}).nome}</span><${Num} value=${q} onChange=${v=>{const n={...c.itens};if(v>0)n[k]=v;else delete n[k];onChange({...c,itens:n})}}/></div>`)}
      <div class="it"><select class="i" style=${{flex:1,minWidth:180}} value=${add} onChange=${e=>{const k=e.target.value;if(!k)return;onChange({...c,itens:{...c.itens,[k]:(num(c.itens[k])||0)+1}});setAdd("")}} aria-label="Adicionar ponto">
        <option value="">+ adicionar ponto…</option>${grupos.map(g=>html`<optgroup key=${g} label=${g}>${pontos.filter(p=>p.grupo===g).map(p=>html`<option key=${p.id} value=${p.id}>${p.nome}</option>`)}</optgroup>`)}</select></div>
    </div></div>`;
}
function ConferirModal({pj,tot,nomeP,onClose,onOk}){
  const [regra,setRegra]=useState("");
  const difs=pj.iaOriginal?[...new Set([...Object.keys(pj.iaOriginal),...Object.keys(tot)])].filter(k=>(pj.iaOriginal[k]||0)!==(tot[k]||0)):[];
  return html`<${Modal} title="Conferência do patrão" onClose=${onClose}>
    ${pj.iaOriginal?(difs.length?html`<div class="col"><p style=${{margin:0}}>Você corrigiu a leitura da IA em <b>${difs.length}</b> item(ns):</p>
      <div class="tbl-wrap"><table><thead><tr><th>Item</th><th class="r">IA leu</th><th class="r">Você deixou</th></tr></thead><tbody>${difs.map(k=>html`<tr key=${k}><td>${nomeP(k)}</td><td class="r num">${pj.iaOriginal[k]||0}</td><td class="r num">${tot[k]||0}</td></tr>`)}</tbody></table></div>
      <${F} label="Por que a IA errou? Escreva como regra; ela passa a seguir nas próximas leituras e a equipe aprende no guia."><textarea class="i" id="regra" value=${regra} onChange=${e=>setRegra(e.target.value)} placeholder="Ex.: Nesse projetista, triângulo com traço embaixo é tomada 20A, não TUG."></textarea><//></div>`
      :html`<div class="alert ok">A contagem final é igual à leitura da IA.</div>`):html`<p style=${{margin:0}}>Projeto contado à mão. Se quiser, registre uma regra que você usou para ensinar a equipe.</p><${F} label="Regra da casa (opcional)"><textarea class="i" id="regra" value=${regra} onChange=${e=>setRegra(e.target.value)}></textarea><//>`}
    <div class="row" style=${{justifyContent:"flex-end"}}><button class="btn" onClick=${onClose}>Voltar</button><button class="btn pri" onClick=${()=>onOk(regra)}>Confirmar conferência</button></div>
  <//>`;
}

/* ============================== PRECIFICAÇÃO / ORÇAMENTOS ============================== */
PAGES.orcamentos=function Orcamentos({go,arg}){
  const S=useS();
  const [aberto,setAberto]=useState(arg||null);
  const [del,setDel]=useState(null);
  useEffect(()=>{if(arg)setAberto(arg)},[arg]);
  const lista=[...S.data.orcamentos].sort((a,b)=>(b.criadoEm||"").localeCompare(a.criadoEm||""));
  return html`<div class="phead"><div><h1>Precificação</h1><p>Preço por ponto, com o custo real da hora da equipe por trás. O sistema avisa quando o preço não paga a obra.</p></div>
    <div class="row"><button class="btn" onClick=${()=>go("projetos")}>A partir de um projeto</button><button class="btn pri" onClick=${()=>setAberto("novo")}>Orçamento avulso</button></div></div>
  ${lista.length?html`<div class="tbl-wrap"><table><thead><tr><th>Nº</th><th>Cliente</th><th>Etapa</th><th class="r">Total</th><th class="r">Margem</th><th></th></tr></thead><tbody>
    ${lista.map(o=>{const c=calcOrc(o,S.custoHora);const st=c.margem<0?"bad":c.margem<num(S.config.margemMin)?"warn":"ok";
      return html`<tr key=${o.id}><td class="mono">${o.numero}</td><td><b>${o.cliente||"Sem nome"}</b><div class="small muted">${dataBR((o.criadoEm||"").slice(0,10))}</div></td><td>${(PIPE.find(p=>p.id===o.etapa)||PIPE[2]).t}</td><td class="r num">${brl(c.total)}</td><td class="r"><span class=${"pill "+st}>${n2(c.margem)}%</span></td>
      <td class="r"><div class="row" style=${{justifyContent:"flex-end",flexWrap:"nowrap"}}><button class="btn sm" onClick=${()=>setAberto(o.id)}>Abrir</button><button class="btn sm ghost danger" onClick=${()=>setDel(o)}>Excluir</button></div></td></tr>`})}
  </tbody></table></div>`:html`<${Empty} title="Nenhum orçamento ainda" text="O caminho mais rápido é ler o projeto: a contagem de pontos vira o orçamento sozinha. Para serviço pequeno, crie um avulso e adicione os pontos."><div class="row"><button class="btn" onClick=${()=>go("projetos")}>Ler projeto</button><button class="btn pri" onClick=${()=>setAberto("novo")}>Orçamento avulso</button></div><//>`}
  ${aberto&&html`<${EditorOrc} id=${aberto} onClose=${()=>setAberto(null)} go=${go}/>`}
  ${del&&html`<${Confirm} text=${`Excluir o orçamento ${del.numero}?`} onNo=${()=>setDel(null)} onYes=${()=>{S.api.del("orcamentos",del.id,"Orçamento excluído.");setDel(null)}}/>`}`;
};

function EditorOrc({id,onClose,go}){
  const S=useS();
  const salvo=id!=="novo"&&S.data.orcamentos.find(o=>o.id===id);
  const [o,setO]=useState(()=>salvo?JSON.parse(JSON.stringify(salvo)):{id:uid(),numero:proxNumero(S.data.orcamentos,"ORC-"),cliente:"",telefone:"",endereco:"",tipo:"residencial",linhas:[],deslocamento:S.config.deslocamentoPadrao,desconto:0,impostoPct:S.config.impostoPct,clienteMaterial:false,etapa:"orcamento",probabilidade:50,criadoEm:new Date().toISOString(),condicoes:"50% de entrada e 50% na entrega.",prazo:""});
  const [dirty,setDirty]=useState(id==="novo");
  const [add,setAdd]=useState("");
  const [msg,setMsg]=useState(false);
  const set=p=>{setO(x=>({...x,...p}));setDirty(true)};
  const c=calcOrc(o,S.custoHora);
  const saude=saudeOrc(o,c,S.config,S.custoHora);
  const upL=(lid,p)=>set({linhas:o.linhas.map(l=>l.id===lid?{...l,...p}:l)});
  const addPonto=k=>{
    const ind=o.tipo==="industrial";
    if(k.startsWith("m:")){const m=S.mats.find(x=>x.id===k.slice(2));if(!m)return;set({linhas:[...o.linhas,{id:uid(),matId:m.id,desc:m.nome,unid:m.unid,qtd:1,mo:0,custoMat:num(m.custo),mat:Math.round(num(m.custo)*(1+num(S.config.markupMatPct)/100)*100)/100,horas:0}]});return}
    if(k==="livre"){set({linhas:[...o.linhas,{id:uid(),desc:"Serviço",unid:"un",qtd:1,mo:0,custoMat:0,mat:0,horas:1}]});return}
    const p=S.pontos.find(x=>x.id===k);if(!p)return;const ck=custoKit(p,S.mats);
    set({linhas:[...o.linhas,{id:uid(),tipoId:p.id,desc:p.nome,unid:p.unid,qtd:1,mo:Math.round(num(p.mo)*(ind?num(S.config.fatorIndustrial):1)*100)/100,custoMat:ck,mat:Math.round(ck*(1+num(S.config.markupMatPct)/100)*100)/100,horas:num(p.horas)}]});
  };
  const salvar=async(extra={},m="Orçamento salvo.")=>{const x={...o,...extra};setO(x);const ok=await S.api.set("orcamentos",x.id,x,m);if(ok)setDirty(false);return ok};
  const cli=S.data.clientes.find(x=>x.nome===o.cliente);
  const fechar=async()=>{
    const pj=S.data.projetos.find(p=>p.id===o.projetoId);
    const tarefas=pj?gerarTarefas(pj,S.pontos):[{id:uid(),etapa:"infra",comodo:"Geral",desc:"Executar serviço conforme orçamento "+o.numero,horas:c.horas,resp:"",feito:false},{id:uid(),etapa:"testes",comodo:"Geral",desc:"Testar e entregar ao cliente",horas:.5,resp:"",feito:false}];
    const materiais=[];
    if(!o.clienteMaterial){
      const acc={};
      for(const l of o.linhas){
        if(l.matId){acc[l.matId]=(acc[l.matId]||0)+num(l.qtd);continue}
        const p=S.pontos.find(x=>x.id===l.tipoId);if(!p)continue;
        for(const [mid,q] of (p.kit||[]))acc[mid]=(acc[mid]||0)+num(q)*num(l.qtd);
      }
      for(const [mid,q] of Object.entries(acc))materiais.push({matId:mid,qtd:Math.ceil(q),baixado:false});
    }
    const os={id:uid(),numero:proxNumero(S.data.os,"OS-"),orcamentoId:o.id,projetoId:o.projetoId||"",cliente:o.cliente,endereco:o.endereco,telefone:o.telefone,etapa:materiais.length?"material":"infra",tarefas,materiais,inicio:hoje(),prazo:o.prazo||"",criadoEm:new Date().toISOString(),valor:c.total};
    const nid=await S.api.add("os",os,null);
    if(!nid)return;
    await salvar({etapa:"aprovado",aprovadoEm:new Date().toISOString(),osId:nid},null);
    const ent=Math.round(c.total*.5*100)/100;
    await S.api.add("financeiro",{tipo:"entrada",desc:`Entrada ${o.numero} · ${o.cliente}`,valor:ent,venc:hoje(),status:"pendente",categoria:"Obra",ref:o.id,criadoEm:new Date().toISOString()},null);
    await S.api.add("financeiro",{tipo:"entrada",desc:`Saldo na entrega ${o.numero} · ${o.cliente}`,valor:Math.round((c.total-ent)*100)/100,venc:o.prazo||"",status:"pendente",categoria:"Obra",ref:o.id,criadoEm:new Date().toISOString()},null);
    S.toast(`Fechado! ${os.numero} criada com ${tarefas.length} tarefas e 2 parcelas lançadas no financeiro.`);
    onClose();go("os",nid);
  };
  const actions=html`<button class="btn" disabled=${!dirty} onClick=${()=>salvar()}>${dirty?"Salvar":"Salvo"}</button>`;
  return html`<${Modal} title=${"Orçamento "+o.numero} onClose=${onClose} actions=${actions}>
    <div class="grid g4">
      <${F} label="Cliente"><${Inp} id="o-cli" value=${o.cliente} list="lst-cli2" onChange=${v=>{const k=S.data.clientes.find(x=>x.nome===v);set(k?{cliente:v,telefone:o.telefone||k.telefone||"",endereco:o.endereco||k.endereco||""}:{cliente:v})}}/><//>
      <${F} label="Telefone / WhatsApp"><${Inp} id="o-tel" value=${o.telefone} onChange=${v=>set({telefone:v})}/><//>
      <${F} label="Endereço da obra" style=${{gridColumn:"span 2"}}><${Inp} id="o-end" value=${o.endereco} onChange=${v=>set({endereco:v})}/><//>
      <${F} label="Tipo de obra"><${Sel} id="o-tipo" value=${o.tipo} onChange=${v=>set({tipo:v})} opts=${[["residencial","Residencial / predial"],["industrial","Industrial"]]}/><//>
      <${F} label="Etapa no funil"><${Sel} id="o-et" value=${o.etapa} onChange=${v=>set({etapa:v})} opts=${PIPE.map(p=>[p.id,p.t])}/><//>
      <${F} label="Prazo de entrega"><${Inp} id="o-prazo" type="date" value=${o.prazo} onChange=${v=>set({prazo:v})}/><//>
      <${F} label="Chance de fechar (%)"><${Inp} id="o-prob" type="number" value=${o.probabilidade} onChange=${v=>set({probabilidade:v})}/><//>
    </div>
    <datalist id="lst-cli2">${S.data.clientes.map(c=>html`<option value=${c.nome}/>`)}</datalist>
    ${!cli&&o.cliente&&html`<div class="small"><button class="btn sm" onClick=${()=>S.api.add("clientes",{nome:o.cliente,telefone:o.telefone,endereco:o.endereco,criadoEm:new Date().toISOString()},"Cliente cadastrado.")}>Cadastrar "${o.cliente}" como cliente</button></div>`}

    <div class="tbl-wrap"><table><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Mão de obra (un)</th><th class="r">Material (un)</th><th class="r">Horas (un)</th><th class="r">Total</th><th></th></tr></thead><tbody>
      ${o.linhas.map(l=>html`<tr key=${l.id}><td style=${{minWidth:200}}><input class="i" value=${l.desc} onChange=${e=>upL(l.id,{desc:e.target.value})} aria-label="Descrição"/></td>
        <td class="r" style=${{width:130}}><${Num} value=${l.qtd} onChange=${v=>upL(l.id,{qtd:v})}/></td>
        <td class="r" style=${{width:110}}><${Inp} type="number" value=${l.mo} onChange=${v=>upL(l.id,{mo:v})} aria-label="Mão de obra"/></td>
        <td class="r" style=${{width:110}}><${Inp} type="number" value=${l.mat} onChange=${v=>upL(l.id,{mat:v})} aria-label="Material"/></td>
        <td class="r" style=${{width:90}}><${Inp} type="number" value=${l.horas} onChange=${v=>upL(l.id,{horas:v})} aria-label="Horas"/></td>
        <td class="r num">${brl(num(l.qtd)*(num(l.mo)+(o.clienteMaterial?0:num(l.mat))))}</td>
        <td><button class="btn sm ghost danger" aria-label="Remover" onClick=${()=>set({linhas:o.linhas.filter(x=>x.id!==l.id)})}>✕</button></td></tr>`)}
      ${!o.linhas.length&&html`<tr><td colspan="7" class="muted">Sem itens. Adicione pontos abaixo ou gere a partir de um projeto lido.</td></tr>`}
    </tbody></table></div>
    <div class="row"><select class="i" style=${{maxWidth:360}} value=${add} onChange=${e=>{addPonto(e.target.value);setAdd("")}} aria-label="Adicionar item">
      <option value="">+ adicionar ponto, material ou serviço…</option>
      ${[...new Set(S.pontos.map(p=>p.grupo))].map(g=>html`<optgroup key=${g} label=${"Pontos · "+g}>${S.pontos.filter(p=>p.grupo===g).map(p=>html`<option key=${p.id} value=${p.id}>${p.nome} · ${brl(p.mo)}</option>`)}</optgroup>`)}
      <optgroup label="Material avulso">${S.mats.map(m=>html`<option key=${m.id} value=${"m:"+m.id}>${m.nome}</option>`)}</optgroup>
      <option value="livre">Serviço livre (digitar)</option></select>
      <label class="chk"><input type="checkbox" checked=${!!o.clienteMaterial} onChange=${e=>set({clienteMaterial:e.target.checked})}/> Cliente compra o material (cobrar só mão de obra)</label></div>

    <div class="grid g2" style=${{alignItems:"start"}}>
      <div class="col">
        <div class="grid g3">
          <${F} label="Deslocamento (R$)"><${Inp} id="o-desl" type="number" value=${o.deslocamento} onChange=${v=>set({deslocamento:v})}/><//>
          <${F} label="Desconto (R$)"><${Inp} id="o-desc" type="number" value=${o.desconto} onChange=${v=>set({desconto:v})}/><//>
          <${F} label="Imposto (%)"><${Inp} id="o-imp" type="number" value=${o.impostoPct} onChange=${v=>set({impostoPct:v})}/><//>
        </div>
        <${F} label="Condições de pagamento"><${Inp} id="o-cond" value=${o.condicoes} onChange=${v=>set({condicoes:v})}/><//>
        <div class="col">${saude.map(([t,m],i)=>html`<div key=${i} class=${"alert "+t}>${m}</div>`)}</div>
      </div>
      <div class="total-box">
        <div class="ln"><span>Mão de obra</span><span class="num">${brl(c.mo)}</span></div>
        <div class="ln"><span>Material</span><span class="num">${brl(c.mat)}</span></div>
        <div class="ln"><span>Deslocamento − desconto</span><span class="num">${brl(c.desloc-c.desc)}</span></div>
        <div class="ln" style=${{borderTop:"1px solid #ffffff2a",paddingTop:8,marginTop:4}}><span>Preço ao cliente</span></div>
        <div class="big">${brl(c.total)}</div>
        <div class="ln" style=${{opacity:.8}}><span>Imposto</span><span class="num">− ${brl(c.imposto)}</span></div>
        <div class="ln" style=${{opacity:.8}}><span>Custo da equipe (${n2(c.horas)} h × ${brl(S.custoHora)})</span><span class="num">− ${brl(c.custoMO)}</span></div>
        <div class="ln" style=${{opacity:.8}}><span>Custo do material + deslocamento</span><span class="num">− ${brl(c.custoMat+c.desloc)}</span></div>
        <div class="ln" style=${{fontWeight:600,fontSize:15}}><span>Lucro estimado</span><span class="num">${brl(c.lucro)} · ${n2(c.margem)}%</span></div>
      </div>
    </div>

    <div class="row" style=${{justifyContent:"flex-end",borderTop:"1px solid var(--line)",paddingTop:14}}>
      <button class="btn" onClick=${()=>gerarPdfProposta(o,c,S)}>Baixar proposta (PDF)</button>
      <button class="btn" onClick=${()=>setMsg(true)}>Texto para WhatsApp</button>
      ${o.etapa!=="aprovado"?html`<button class="btn pri" disabled=${!o.linhas.length} onClick=${fechar}>Cliente aprovou → gerar OS</button>`:html`<button class="btn pri" onClick=${()=>{onClose();go("os",o.osId)}}>Abrir OS</button>`}
    </div>
    ${msg&&html`<${MsgWhats} o=${o} c=${c} onClose=${()=>setMsg(false)}/>`}
  <//>`;
}
function textoProposta(o,c,S){
  return `Olá${o.cliente?", "+o.cliente.split(" ")[0]:""}! Segue a proposta ${o.numero} da ${S.config.empresa}.

${o.linhas.map(l=>`• ${n2(l.qtd)} ${l.unid||""} ${l.desc}`).join("\n")}

Mão de obra: ${brl(c.mo)}
Material: ${o.clienteMaterial?"por conta do cliente":brl(c.mat)}
${c.desloc?`Deslocamento: ${brl(c.desloc)}\n`:""}${c.desc?`Desconto: −${brl(c.desc)}\n`:""}*Total: ${brl(c.total)}*

Pagamento: ${o.condicoes||"a combinar"}
${o.prazo?`Entrega prevista: ${dataBR(o.prazo)}\n`:""}Validade: 10 dias.
Serviço executado conforme NBR 5410. Qualquer dúvida, é só responder.`;
}
function MsgWhats({o,c,onClose}){
  const S=useS();const t=textoProposta(o,c,S);const ref=useRef(null);
  const tel=String(o.telefone||"").replace(/\D/g,"");const fone=tel?(tel.length<=11?"55"+tel:tel):"";
  const copiar=async()=>{try{await navigator.clipboard.writeText(t);S.toast("Texto copiado. Cole no WhatsApp do cliente.")}catch{ref.current.select();S.toast("Selecionei o texto: use Ctrl+C / copiar.")}};
  return html`<${Modal} title="Mensagem para o cliente" onClose=${onClose}>
    <textarea ref=${ref} class="i" style=${{minHeight:300,fontFamily:"var(--f-mono)",fontSize:12.5}} readonly value=${t}></textarea>
    <div class="row" style=${{justifyContent:"flex-end"}}><button class="btn" onClick=${copiar}>Copiar texto</button>
      ${fone&&html`<a class="btn pri" href=${`https://api.whatsapp.com/send?phone=${fone}&text=${encodeURIComponent(t)}`} target="_blank" rel="noopener">Abrir WhatsApp de ${o.telefone}</a>`}</div><//>`;
}
async function gerarPdfProposta(o,c,S){
  try{
    const {jsPDF}=window.jspdf;const d=new jsPDF({unit:"mm",format:"a4"});
    const W=210,M=16;let y=18;
    d.setFillColor(29,47,69);d.rect(0,0,W,30,"F");d.setTextColor(255);d.setFont("helvetica","bold");d.setFontSize(18);d.text(S.config.empresa||"Elétrica",M,16);
    d.setFontSize(9);d.setFont("helvetica","normal");d.text([S.config.cidade,S.config.telefone].filter(Boolean).join(" · ")||"Instalações elétricas",M,23);
    d.setFontSize(11);d.text("PROPOSTA "+o.numero,W-M,16,{align:"right"});d.setFontSize(9);d.text(new Date().toLocaleDateString("pt-BR"),W-M,23,{align:"right"});
    y=42;d.setTextColor(20);d.setFontSize(10);d.setFont("helvetica","bold");d.text("Cliente",M,y);d.setFont("helvetica","normal");d.text(o.cliente||"—",M+22,y);
    if(o.endereco){y+=6;d.setFont("helvetica","bold");d.text("Obra",M,y);d.setFont("helvetica","normal");d.text(d.splitTextToSize(o.endereco,150),M+22,y)}
    y+=12;d.setFillColor(232,236,240);d.rect(M,y-5,W-2*M,8,"F");d.setFont("helvetica","bold");d.setFontSize(9);
    d.text("ITEM",M+2,y);d.text("QTD",125,y,{align:"right"});d.text("UNIT.",155,y,{align:"right"});d.text("TOTAL",W-M-2,y,{align:"right"});
    d.setFont("helvetica","normal");y+=8;
    for(const l of o.linhas){
      const u=num(l.mo)+(o.clienteMaterial?0:num(l.mat));const ls=d.splitTextToSize(l.desc||"",95);
      if(y+ls.length*5>270){d.addPage();y=20}
      d.text(ls,M+2,y);d.text(n2(l.qtd)+" "+(l.unid||""),125,y,{align:"right"});d.text(brl(u),155,y,{align:"right"});d.text(brl(u*num(l.qtd)),W-M-2,y,{align:"right"});
      y+=ls.length*5+2;d.setDrawColor(220);d.line(M,y-3,W-M,y-3);
    }
    if(y>230){d.addPage();y=20}
    y+=4;const lin=(a,b,bold)=>{d.setFont("helvetica",bold?"bold":"normal");d.text(a,140,y,{align:"right"});d.text(b,W-M-2,y,{align:"right"});y+=6};
    lin("Mão de obra",brl(c.mo));lin("Material",o.clienteMaterial?"por conta do cliente":brl(c.mat));if(c.desloc)lin("Deslocamento",brl(c.desloc));if(c.desc)lin("Desconto","− "+brl(c.desc));
    d.setFontSize(12);lin("TOTAL",brl(c.total),true);d.setFontSize(9);
    y+=6;d.setFont("helvetica","normal");
    const notas=[`Pagamento: ${o.condicoes||"a combinar"}`,o.prazo?`Entrega prevista: ${dataBR(o.prazo)}`:"","Validade da proposta: 10 dias.","Serviço executado conforme NBR 5410. Luminárias e acabamentos decorativos não inclusos, salvo quando listados."].filter(Boolean);
    d.text(d.splitTextToSize(notas.join("\n"),W-2*M),M,y);
    const blob=d.output("blob");
    const dl=await window.claude?.use?.("downloads");
    if(!dl){S.toast("Download indisponível aqui. Use o texto para WhatsApp.");return}
    await dl.save({filename:`Proposta_${o.numero}_${(o.cliente||"cliente").replace(/[^\w]+/g,"_")}.pdf`,data:blob});
    S.toast("Proposta gerada.");
  }catch(e){if(e&&e.code==="declined")return;console.error(e);S.toast("Não foi possível gerar o PDF: "+(e&&e.message||"erro"))}
}

/* ============================== FUNIL ============================== */
PAGES.pipeline=function Pipeline({go}){
  const S=useS();
  const mover=(o,d)=>{const i=PIPE.findIndex(p=>p.id===(o.etapa||"orcamento"));const j=Math.min(PIPE.length-1,Math.max(0,i+d));if(PIPE[j].id==="aprovado"){go("orcamentos",o.id);S.toast("Para fechar, use o botão 'Cliente aprovou' no orçamento: ele já gera a OS.");return}S.api.update("orcamentos",o.id,{etapa:PIPE[j].id})};
  const tot=PIPE.slice(0,4).reduce((a,p)=>a+S.data.orcamentos.filter(o=>(o.etapa||"orcamento")===p.id).reduce((x,o)=>x+calcOrc(o,S.custoHora).total*num(o.probabilidade)/100,0),0);
  return html`<div class="phead"><div><h1>Funil de vendas</h1><p>Onde cada orçamento está. Previsão ponderada pela chance de fechar: <b class="num">${brl(tot)}</b>.</p></div><button class="btn pri" onClick=${()=>go("orcamentos","novo")}>Novo orçamento</button></div>
  <div class="kanban">${PIPE.map(p=>{const it=S.data.orcamentos.filter(o=>(o.etapa||"orcamento")===p.id);
    return html`<div class="kcol" key=${p.id}><h3>${p.t}<span class="pill">${it.length}</span></h3><div class="small muted num">${brl(it.reduce((a,o)=>a+calcOrc(o,S.custoHora).total,0))}</div>
      ${it.map(o=>html`<div class="kcard" key=${o.id} style=${{flexDirection:"column",cursor:"default"}}><button class="btn ghost" style=${{padding:0,justifyContent:"flex-start",textAlign:"left",whiteSpace:"normal"}} onClick=${()=>go("orcamentos",o.id)}><b>${o.cliente||"Sem nome"}</b></button><div class="small muted"><span class="mono">${o.numero}</span> · ${brl(calcOrc(o,S.custoHora).total)} · ${n2(o.probabilidade)}%</div>
        <div class="row" style=${{justifyContent:"space-between"}}><button class="btn sm" disabled=${p.id==="contato"} onClick=${()=>mover(o,-1)} aria-label="Voltar etapa">←</button><button class="btn sm" disabled=${p.id==="perdido"||p.id==="aprovado"} onClick=${()=>mover(o,1)} aria-label="Avançar etapa">→</button></div></div>`)}
    </div>`})}</div>`;
};

/* ============================== ORDENS DE SERVIÇO ============================== */
PAGES.os=function OSPage({go,arg}){
  const S=useS();const [aberta,setAberta]=useState(arg||null);
  useEffect(()=>{if(arg)setAberta(arg)},[arg]);
  const [ver,setVer]=useState("ativas");
  const lista=S.data.os.filter(o=>ver==="todas"||o.etapa!=="concluida");
  return html`<div class="phead"><div><h1>Ordens de serviço</h1><p>Cada obra fechada vira uma OS com tarefas por cômodo e etapa. A cor de cada etapa segue a cor dos fios.</p></div>
    <${Tabs} value=${ver} onChange=${setVer} tabs=${[["ativas","Em andamento"],["todas","Todas"]]}/></div>
  ${S.data.os.length?html`<div class="kanban">${ETAPAS_OS.filter(e=>ver==="todas"||e.id!=="concluida").map(e=>{const it=lista.filter(o=>o.etapa===e.id);
    return html`<div class="kcol" key=${e.id}><h3><span class="wire" style=${{background:e.c,height:16}}></span>${e.t}<span class="pill">${it.length}</span></h3>${e.sub?html`<div class="small muted">${e.sub}</div>`:null}
    ${it.map(o=>{const t=o.tarefas||[];const f=t.filter(x=>x.feito).length;const falta=(o.materiais||[]).some(m=>!m.baixado);
      return html`<button class="kcard" key=${o.id} onClick=${()=>setAberta(o.id)}><span class="wire" style=${{background:e.c}}></span><div style=${{flex:1,minWidth:0}}><b>${o.cliente}</b><div class="small muted"><span class="mono">${o.numero}</span>${o.prazo?" · entrega "+dataBR(o.prazo):""}</div><div class="bar" style=${{margin:"6px 0 4px"}}><i style=${{width:(t.length?f/t.length*100:0)+"%"}}></i></div><div class="small muted">${f}/${t.length} tarefas${falta?" · material a separar":""}</div></div></button>`})}
    </div>`})}</div>`:html`<${Empty} title="Nenhuma OS ainda" text="A OS nasce quando você marca no orçamento que o cliente aprovou. Ela já vem com as tarefas por cômodo e a lista de material."><button class="btn" onClick=${()=>go("orcamentos")}>Ir para Precificação</button><//>`}
  ${aberta&&html`<${DetalheOS} id=${aberta} onClose=${()=>setAberta(null)}/>`}`;
};

function DetalheOS({id,onClose}){
  const S=useS();
  const o=S.data.os.find(x=>x.id===id);
  const [nova,setNova]=useState({etapa:"infra",desc:"",resp:""});
  const [prancha,setPrancha]=useState(null);
  const [del,setDel]=useState(false);
  if(!o)return null;
  const pj=S.data.projetos.find(p=>p.id===o.projetoId);
  const equipe=S.data.team.filter(t=>t.active!==false).map(t=>[t.id,S.nome(t.id)+" · "+(PAPEIS[t.role]||t.role)]);
  if(!equipe.find(e=>e[0]===S.me.id))equipe.unshift([S.me.id,S.nome(S.me.id)]);
  const upT=(tid,p)=>S.api.update("os",o.id,{tarefas:o.tarefas.map(t=>t.id===tid?{...t,...p}:t)});
  const etapa=v=>S.api.update("os",o.id,{etapa:v},"Etapa atualizada.");
  const mat=m=>S.mats.find(x=>x.id===m.matId);
  const separar=async()=>{
    const faltas=[];
    for(const m of (o.materiais||[]).filter(m=>!m.baixado)){const k=mat(m);if(!k){faltas.push(m.matId);continue}if(num(k.estoque)<num(m.qtd))faltas.push(k.nome)}
    if(faltas.length){S.toast("Falta em estoque: "+faltas.slice(0,4).join(", ")+(faltas.length>4?"…":"")+". Dê entrada no almoxarifado ou baixe só o que tem.");return}
    for(const m of (o.materiais||[]).filter(m=>!m.baixado)){const k=mat(m);await S.api.update("materiais",k.id,{estoque:num(k.estoque)-num(m.qtd)});await S.api.add("movimentos",{matId:k.id,tipo:"saida",qtd:num(m.qtd),ref:o.numero,data:hoje(),por:S.me.id},null)}
    await S.api.update("os",o.id,{materiais:o.materiais.map(m=>({...m,baixado:true})),etapa:o.etapa==="material"?"infra":o.etapa},"Material separado e baixado do estoque.");
  };
  const baixarUm=async m=>{const k=mat(m);if(!k)return;await S.api.update("materiais",k.id,{estoque:num(k.estoque)-num(m.qtd)});await S.api.add("movimentos",{matId:k.id,tipo:"saida",qtd:num(m.qtd),ref:o.numero,data:hoje(),por:S.me.id},null);await S.api.update("os",o.id,{materiais:o.materiais.map(x=>x.matId===m.matId?{...x,baixado:true}:x)},"Baixado.")};
  const porEtapa=ETAPAS_OS.filter(e=>e.id!=="material"&&e.id!=="concluida").map(e=>({e,t:(o.tarefas||[]).filter(t=>t.etapa===e.id)})).filter(x=>x.t.length);
  const feitas=(o.tarefas||[]).filter(t=>t.feito).length;
  const distribuir=r=>{if(!r)return;S.api.update("os",o.id,{tarefas:o.tarefas.map(t=>t.resp?t:{...t,resp:r})},"Tarefas sem responsável atribuídas.")};
  return html`<${Modal} title=${o.numero+" · "+o.cliente} onClose=${onClose} actions=${html`${pj&&pj.assetId?html`<button class="btn" onClick=${()=>setPrancha(pj)}>Ver prancha</button>`:null}`}>
    <div class="grid g4">
      <div class="kpi"><span>Endereço</span><div>${o.endereco||"—"}</div></div>
      <div class="kpi"><span>Telefone</span><div class="mono" style=${{userSelect:"all"}}>${o.telefone||"—"}</div></div>
      <div class="kpi"><span>Entrega</span><div>${dataBR(o.prazo)}</div></div>
      <div class="kpi"><span>Andamento</span><div class="num">${feitas}/${(o.tarefas||[]).length} tarefas</div></div>
    </div>
    <div class="row">${ETAPAS_OS.map(e=>html`<button key=${e.id} class=${"btn sm"+(o.etapa===e.id?" pri":"")} disabled=${!S.admin&&!["eletricista"].includes(S.papel)} onClick=${()=>etapa(e.id)}><span class="wire" style=${{background:e.c,height:12,width:3}}></span>${e.t}</button>`)}</div>

    <div class="grid g2" style=${{alignItems:"start"}}>
      <div class="card col"><div class="row" style=${{justifyContent:"space-between"}}><h3>Tarefas</h3>
        ${S.admin&&html`<select class="i" style=${{maxWidth:240}} value="" onChange=${e=>distribuir(e.target.value)} aria-label="Atribuir sem responsável"><option value="">Atribuir as sem responsável a…</option>${equipe.map(([i,n])=>html`<option key=${i} value=${i}>${n}</option>`)}</select>`}</div>
        ${porEtapa.map(({e,t})=>html`<div key=${e.id}><div class="row" style=${{marginTop:6}}><span class="wire" style=${{background:e.c,height:14}}></span><b>${e.t}</b><span class="small muted">${t.filter(x=>x.feito).length}/${t.length}</span></div>
          ${t.map(k=>html`<div key=${k.id} class=${"task"+(k.feito?" done":"")}><input type="checkbox" checked=${!!k.feito} aria-label="Concluir" onChange=${()=>upT(k.id,{feito:!k.feito,feitoPor:S.me.id,feitoEm:new Date().toISOString()})}/>
            <div style=${{flex:1,minWidth:0}}><div class="t">${k.desc}</div><div class="row small muted" style=${{marginTop:4}}>${k.horas?html`<span>~${n2(k.horas)} h</span>`:null}
            ${S.admin?html`<select class="i" style=${{maxWidth:220,padding:"3px 6px"}} value=${k.resp||""} onChange=${ev=>upT(k.id,{resp:ev.target.value})} aria-label="Responsável"><option value="">Sem responsável</option>${equipe.map(([i,n])=>html`<option key=${i} value=${i}>${n}</option>`)}</select>`:html`<span>${k.resp?S.nome(k.resp):"sem responsável"}</span>`}
            ${k.feito&&k.feitoPor?html`<span>feito por ${S.nome(k.feitoPor)}</span>`:null}</div></div>
            ${S.admin&&html`<button class="btn sm ghost danger" aria-label="Remover tarefa" onClick=${()=>S.api.update("os",o.id,{tarefas:o.tarefas.filter(x=>x.id!==k.id)})}>✕</button>`}</div>`)}</div>`)}
        ${S.admin&&html`<div class="grid" style=${{gridTemplateColumns:"minmax(0,140px) minmax(0,1fr) auto",gap:8,borderTop:"1px solid var(--line)",paddingTop:10}}>
          <${Sel} value=${nova.etapa} onChange=${v=>setNova({...nova,etapa:v})} opts=${ETAPAS_OS.filter(e=>!["material","concluida"].includes(e.id)).map(e=>[e.id,e.t])}/>
          <${Inp} value=${nova.desc} onChange=${v=>setNova({...nova,desc:v})} placeholder="Nova tarefa"/>
          <button class="btn" disabled=${!nova.desc} onClick=${()=>{S.api.update("os",o.id,{tarefas:[...(o.tarefas||[]),{id:uid(),etapa:nova.etapa,comodo:"",desc:nova.desc,horas:0,resp:"",feito:false}]});setNova({...nova,desc:""})}}>Adicionar</button></div>`}
      </div>
      <div class="col">
        <div class="card col"><div class="row" style=${{justifyContent:"space-between"}}><h3>Material da obra</h3>${(o.materiais||[]).some(m=>!m.baixado)&&html`<button class="btn sm pri" onClick=${separar}>Separar tudo e dar baixa</button>`}</div>
          ${(o.materiais||[]).length?html`<div class="tbl-wrap"><table><thead><tr><th>Material</th><th class="r">Precisa</th><th class="r">Estoque</th><th></th></tr></thead><tbody>
            ${o.materiais.map(m=>{const k=mat(m);const fal=k&&!m.baixado&&num(k.estoque)<num(m.qtd);return html`<tr key=${m.matId}><td>${k?k.nome:m.matId}</td><td class="r num">${n2(m.qtd)} ${k?k.unid:""}</td><td class="r num">${k?n2(k.estoque):"—"}</td>
              <td class="r">${m.baixado?html`<span class="pill ok">Separado</span>`:fal?html`<span class="pill bad">Comprar ${n2(num(m.qtd)-num(k.estoque))}</span>`:html`<button class="btn sm" onClick=${()=>baixarUm(m)}>Baixar</button>`}</td></tr>`})}
          </tbody></table></div>`:html`<p class="muted small" style=${{margin:0}}>Sem material listado (cliente compra ou serviço avulso).</p>`}
        </div>
        ${pj&&html`<div class="card col"><h3>Do projeto: ${pj.nome}</h3><div class="small muted">${(pj.circuitos||[]).length} circuitos · tensão ${(pj.carimbo||{}).tensao||"—"}</div>
          ${(pj.circuitos||[]).length?html`<div class="tbl-wrap"><table><thead><tr><th>Circ.</th><th>Descrição</th><th class="r">Disj.</th><th class="r">Cabo</th></tr></thead><tbody>${pj.circuitos.map(c=>html`<tr key=${c.id}><td class="mono">${c.num}</td><td>${c.desc}</td><td class="r num">${c.disjuntor}A</td><td class="r num">${c.bitola}mm²</td></tr>`)}</tbody></table></div>`:null}</div>`}
        ${S.admin&&html`<button class="btn ghost danger" onClick=${()=>setDel(true)}>Excluir OS</button>`}
      </div>
    </div>
    ${prancha&&html`<${VerPrancha} pj=${prancha} onClose=${()=>setPrancha(null)}/>`}
    ${del&&html`<${Confirm} text=${`Excluir ${o.numero}? As tarefas somem para a equipe.`} onNo=${()=>setDel(false)} onYes=${()=>{S.api.del("os",o.id,"OS excluída.");onClose()}}/>`}
  <//>`;
}
function VerPrancha({pj,onClose}){
  const [pgs,setPgs]=useState([]);const [err,setErr]=useState("");const [z,setZ]=useState(1);
  useEffect(()=>{(async()=>{try{const r=await fetch("/_blob/"+pj.assetId);if(!r.ok)throw 0;const b=await r.blob();setPgs(await arquivoParaPaginas(new File([b],pj.arquivo||"p.pdf",{type:b.type||"application/pdf"})))}catch{setErr("Não foi possível abrir a prancha.")}})()},[]);
  return html`<${Modal} title=${"Prancha · "+pj.nome} onClose=${onClose} actions=${html`<button class="btn sm" onClick=${()=>setZ(x=>Math.max(.25,x-.25))}>Zoom −</button><button class="btn sm" onClick=${()=>setZ(x=>Math.min(3,x+.25))}>Zoom +</button>`}>
    ${err?html`<div class="alert bad">${err}</div>`:!pgs.length?html`<div class="alert info"><span class="spin"></span> Abrindo…</div>`:pgs.map(p=>html`<div class="viewer" key=${p.n}><img src=${p.url} style=${{width:z*100+"%"}} alt=${"Página "+p.n}/></div>`)}<//>`;
}

PAGES.estoque=function Estoque(){
  const S=useS();const [busca,setBusca]=useState("");const [mov,setMov]=useState(null);const [novo,setNovo]=useState(null);const [tab,setTab]=useState("itens");
  const lista=S.data.materiais.filter(m=>(m.nome||"").toLowerCase().includes(busca.toLowerCase())).sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));
  const comprar=S.data.materiais.filter(m=>num(m.minimo)>0&&num(m.estoque)<num(m.minimo));
  const reservado={};for(const o of S.data.os.filter(o=>o.etapa!=="concluida"))for(const m of (o.materiais||[]))if(!m.baixado)reservado[m.matId]=(reservado[m.matId]||0)+num(m.qtd);
  const pode=S.admin||S.papel==="escritorio"||S.papel==="eletricista";
  return html`<div class="phead"><div><h1>Almoxarifado</h1><p>Quanto tem, quanto as obras abertas vão usar e o que precisa comprar.</p></div>${S.admin&&html`<button class="btn pri" onClick=${()=>setNovo({nome:"",unid:"un",custo:0,estoque:0,minimo:0})}>Novo material</button>`}</div>
  <${Tabs} value=${tab} onChange=${setTab} tabs=${[["itens","Itens"],["comprar",`Comprar (${comprar.length+Object.keys(reservado).filter(k=>{const m=S.mats.find(x=>x.id===k);return m&&num(m.estoque)<reservado[k]}).length})`],["mov","Movimentações"]]}/>
  ${tab==="itens"&&html`<input class="i" style=${{maxWidth:320}} placeholder="Buscar material" value=${busca} onChange=${e=>setBusca(e.target.value)} aria-label="Buscar"/>
    ${lista.length?html`<div class="tbl-wrap"><table><thead><tr><th>Material</th><th class="r">Estoque</th><th class="r">Reservado p/ obras</th><th class="r">Mínimo</th><th class="r">Custo</th><th></th></tr></thead><tbody>
      ${lista.map(m=>{const r=reservado[m.id]||0;const st=num(m.estoque)<r?"bad":num(m.minimo)>0&&num(m.estoque)<num(m.minimo)?"warn":"";
        return html`<tr key=${m.id}><td>${m.nome}</td><td class="r num">${st?html`<span class=${"pill "+st}>${n2(m.estoque)} ${m.unid}</span>`:`${n2(m.estoque)} ${m.unid}`}</td><td class="r num">${r?n2(r):"—"}</td><td class="r num">${n2(m.minimo)}</td><td class="r num">${brl(m.custo)}</td>
        <td class="r"><div class="row" style=${{justifyContent:"flex-end",flexWrap:"nowrap"}}>${pode&&html`<button class="btn sm" onClick=${()=>setMov({m,tipo:"entrada",qtd:0})}>Entrada</button><button class="btn sm" onClick=${()=>setMov({m,tipo:"saida",qtd:0})}>Saída</button>`}${S.admin&&html`<button class="btn sm ghost" onClick=${()=>setNovo({...m})}>Editar</button>`}</div></td></tr>`})}
    </tbody></table></div>`:html`<${Empty} title="Nenhum material cadastrado" text=${S.admin?"Cadastre os materiais em Preços e custos (com o botão de modelo) ou aqui, um a um.":"O patrão ainda não cadastrou os materiais."}/>`}`}
  ${tab==="comprar"&&html`<div class="tbl-wrap"><table><thead><tr><th>Material</th><th class="r">Estoque</th><th class="r">Obras precisam</th><th class="r">Mínimo</th><th class="r">Comprar</th><th class="r">Custo est.</th></tr></thead><tbody>
    ${S.mats.map(m=>{const r=reservado[m.id]||0;const q=Math.max(0,r+num(m.minimo)-num(m.estoque));return q>0?html`<tr key=${m.id}><td>${m.nome}</td><td class="r num">${n2(m.estoque)}</td><td class="r num">${n2(r)}</td><td class="r num">${n2(m.minimo)}</td><td class="r num"><b>${n2(Math.ceil(q))} ${m.unid}</b></td><td class="r num">${brl(Math.ceil(q)*num(m.custo))}</td></tr>`:null})}
  </tbody></table></div>`}
  ${tab==="mov"&&html`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Material</th><th>Tipo</th><th class="r">Qtd</th><th>Ref.</th></tr></thead><tbody>
    ${[...S.data.movimentos].sort((a,b)=>(b.data||"").localeCompare(a.data||"")).slice(0,200).map(v=>html`<tr key=${v.id}><td>${dataBR(v.data)}</td><td>${(S.mats.find(m=>m.id===v.matId)||{nome:v.matId}).nome}</td><td>${v.tipo==="entrada"?html`<span class="pill ok">Entrada</span>`:html`<span class="pill">Saída</span>`}</td><td class="r num">${n2(v.qtd)}</td><td class="small muted">${v.ref||""}</td></tr>`)}
    ${!S.data.movimentos.length&&html`<tr><td colspan="5" class="muted">Nenhuma movimentação.</td></tr>`}</tbody></table></div>`}
  ${mov&&html`<${Modal} title=${(mov.tipo==="entrada"?"Entrada · ":"Saída · ")+mov.m.nome} onClose=${()=>setMov(null)}>
    <div class="grid g3"><${F} label=${"Quantidade ("+mov.m.unid+")"}><${Num} id="mv-q" value=${mov.qtd} onChange=${v=>setMov({...mov,qtd:v})}/><//>
    <${F} label="Referência (nota, OS, fornecedor)"><${Inp} id="mv-r" value=${mov.ref} onChange=${v=>setMov({...mov,ref:v})}/><//>
    ${mov.tipo==="entrada"&&html`<${F} label="Custo unitário pago (R$)"><${Inp} id="mv-c" type="number" value=${mov.custo??mov.m.custo} onChange=${v=>setMov({...mov,custo:v})}/><//>`}</div>
    <div class="row" style=${{justifyContent:"flex-end"}}><button class="btn pri" disabled=${!mov.qtd} onClick=${async()=>{const d=mov.tipo==="entrada"?mov.qtd:-mov.qtd;const p={estoque:num(mov.m.estoque)+d};if(mov.tipo==="entrada"&&mov.custo!=null)p.custo=num(mov.custo);await S.api.update("materiais",mov.m.id,p);await S.api.add("movimentos",{matId:mov.m.id,tipo:mov.tipo,qtd:mov.qtd,ref:mov.ref||"",data:hoje(),por:S.me.id},"Movimentação registrada.");setMov(null)}}>Registrar</button></div><//>`}
  ${novo&&html`<${Modal} title=${novo.id?"Editar material":"Novo material"} onClose=${()=>setNovo(null)}>
    <div class="grid g3"><${F} label="Nome"><${Inp} id="nm-n" value=${novo.nome} onChange=${v=>setNovo({...novo,nome:v})}/><//><${F} label="Unidade"><${Sel} id="nm-u" value=${novo.unid} onChange=${v=>setNovo({...novo,unid:v})} opts=${["un","m","kg","rolo","cx","pç"]}/><//>
    <${F} label="Custo (R$)"><${Inp} id="nm-c" type="number" value=${novo.custo} onChange=${v=>setNovo({...novo,custo:v})}/><//><${F} label="Estoque atual"><${Inp} id="nm-e" type="number" value=${novo.estoque} onChange=${v=>setNovo({...novo,estoque:v})}/><//><${F} label="Estoque mínimo"><${Inp} id="nm-m" type="number" value=${novo.minimo} onChange=${v=>setNovo({...novo,minimo:v})}/><//>
    <${F} label="Fornecedor"><${Sel} id="nm-f" value=${novo.fornecedorId||""} onChange=${v=>setNovo({...novo,fornecedorId:v})} opts=${[["","—"],...S.data.fornecedores.map(f=>[f.id,f.nome])]}/><//></div>
    <div class="row" style=${{justifyContent:"space-between"}}>${novo.id?html`<button class="btn ghost danger" onClick=${()=>{S.api.del("materiais",novo.id,"Material excluído.");setNovo(null)}}>Excluir</button>`:html`<span></span>`}<button class="btn pri" disabled=${!novo.nome} onClick=${()=>{novo.id?S.api.set("materiais",novo.id,novo,"Material salvo."):S.api.add("materiais",novo,"Material cadastrado.");setNovo(null)}}>Salvar</button></div><//>`}`;
};

/* ============================== FINANCEIRO ============================== */
PAGES.financeiro=function Fin(){
  const S=useS();const [ed,setEd]=useState(null);const [filtro,setFiltro]=useState("aberto");const [mes,setMes]=useState(hoje().slice(0,7));
  const L=[...S.data.financeiro].sort((a,b)=>(a.venc||"9").localeCompare(b.venc||"9"));
  const vis=L.filter(f=>filtro==="aberto"?f.status!=="pago":filtro==="mes"?((f.pagoEm||f.venc||"").slice(0,7)===mes):true);
  const doMes=L.filter(f=>f.status==="pago"&&(f.pagoEm||"").slice(0,7)===mes);
  const ent=doMes.filter(f=>f.tipo==="entrada").reduce((a,f)=>a+num(f.valor),0),sai=doMes.filter(f=>f.tipo==="saida").reduce((a,f)=>a+num(f.valor),0);
  const pagar=f=>S.api.update("financeiro",f.id,{status:f.status==="pago"?"pendente":"pago",pagoEm:f.status==="pago"?"":hoje()},f.status==="pago"?"Reaberto.":"Baixado como pago.");
  return html`<div class="phead"><div><h1>Financeiro</h1><p>Contas a receber e a pagar. Ao fechar uma obra, entrada e saldo entram aqui sozinhos.</p></div><button class="btn pri" onClick=${()=>setEd({tipo:"saida",desc:"",valor:0,venc:hoje(),status:"pendente",categoria:"Material"})}>Novo lançamento</button></div>
  <div class="grid g4"><div class="card kpi"><span>Recebido em ${mes.split("-").reverse().join("/")}</span><b>${brl(ent)}</b></div><div class="card kpi"><span>Pago no mês</span><b>${brl(sai)}</b></div><div class="card kpi"><span>Resultado do mês</span><b style=${{color:ent-sai<0?"var(--bad)":"var(--ok)"}}>${brl(ent-sai)}</b></div>
    <div class="card kpi"><span>Mês</span><input class="i" type="month" value=${mes} onChange=${e=>setMes(e.target.value)} aria-label="Mês"/></div></div>
  <${Tabs} value=${filtro} onChange=${setFiltro} tabs=${[["aberto","Em aberto"],["mes","Do mês"],["todos","Todos"]]}/>
  ${vis.length?html`<div class="tbl-wrap"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th>Categoria</th><th class="r">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
    ${vis.map(f=>{const venc=f.status!=="pago"&&f.venc&&f.venc<hoje();return html`<tr key=${f.id}><td>${dataBR(f.venc)}</td><td>${f.desc}</td><td class="small muted">${f.categoria||""}</td><td class="r num" style=${{color:f.tipo==="entrada"?"var(--ok)":"var(--fg)"}}>${f.tipo==="entrada"?"+":"−"} ${brl(f.valor)}</td>
      <td>${f.status==="pago"?html`<span class="pill ok">Pago ${dataBR(f.pagoEm)}</span>`:venc?html`<span class="pill bad">Vencido</span>`:html`<span class="pill warn">Pendente</span>`}</td>
      <td class="r"><div class="row" style=${{justifyContent:"flex-end",flexWrap:"nowrap"}}><button class="btn sm" onClick=${()=>pagar(f)}>${f.status==="pago"?"Reabrir":"Baixar"}</button><button class="btn sm ghost" onClick=${()=>setEd({...f})}>Editar</button></div></td></tr>`})}
  </tbody></table></div>`:html`<${Empty} title="Nada por aqui" text="Lance contas a pagar (material, combustível, folha) e a receber. As parcelas das obras fechadas entram automaticamente."/>`}
  ${ed&&html`<${Modal} title=${ed.id?"Editar lançamento":"Novo lançamento"} onClose=${()=>setEd(null)}>
    <div class="grid g3"><${F} label="Tipo"><${Sel} id="fn-t" value=${ed.tipo} onChange=${v=>setEd({...ed,tipo:v})} opts=${[["entrada","Entrada (a receber)"],["saida","Saída (a pagar)"]]}/><//>
      <${F} label="Descrição"><${Inp} id="fn-d" value=${ed.desc} onChange=${v=>setEd({...ed,desc:v})}/><//><${F} label="Valor (R$)"><${Inp} id="fn-v" type="number" value=${ed.valor} onChange=${v=>setEd({...ed,valor:v})}/><//>
      <${F} label="Vencimento"><${Inp} id="fn-ve" type="date" value=${ed.venc} onChange=${v=>setEd({...ed,venc:v})}/><//><${F} label="Categoria"><${Sel} id="fn-c" value=${ed.categoria} onChange=${v=>setEd({...ed,categoria:v})} opts=${["Obra","Material","Folha","Combustível","Ferramentas","Impostos","Aluguel","Outros"]}/><//>
      <${F} label="Forma"><${Sel} id="fn-f" value=${ed.forma||"Pix"} onChange=${v=>setEd({...ed,forma:v})} opts=${["Pix","Dinheiro","Boleto","Cartão de crédito","Transferência"]}/><//></div>
    <div class="row" style=${{justifyContent:"space-between"}}>${ed.id?html`<button class="btn ghost danger" onClick=${()=>{S.api.del("financeiro",ed.id,"Lançamento excluído.");setEd(null)}}>Excluir</button>`:html`<span></span>`}<button class="btn pri" disabled=${!ed.desc||!ed.valor} onClick=${()=>{ed.id?S.api.set("financeiro",ed.id,ed,"Salvo."):S.api.add("financeiro",{...ed,criadoEm:new Date().toISOString()},"Lançado.");setEd(null)}}>Salvar</button></div><//>`}`;
};

/* ============================== CADASTROS ============================== */
PAGES.cadastros=function Cad(){

  const L=S.data[tab];
  return html`<div class="phead"><div><h1>Clientes e fornecedores</h1></div><button class="btn pri" onClick=${()=>setEd({nome:"",telefone:"",email:"",endereco:"",doc:""})}>Novo ${tab==="clientes"?"cliente":"fornecedor"}</button></div>
  <${Tabs} value=${tab} onChange=${setTab} tabs=${[["clientes",`Clientes (${S.data.clientes.length})`],["fornecedores",`Fornecedores (${S.data.fornecedores.length})`]]}/>
  ${L.length?html`<div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>Endereço</th>${tab==="clientes"?html`<th class="r">Obras</th>`:html`<th>Fornece</th>`}<th></th></tr></thead><tbody>
    ${[...L].sort((a,b)=>(a.nome||"").localeCompare(b.nome||"")).map(c=>html`<tr key=${c.id}><td><b>${c.nome}</b>${c.doc?html`<div class="small muted">${c.doc}</div>`:null}</td><td class="mono" style=${{userSelect:"all"}}>${c.telefone||"—"}</td><td class="small">${c.endereco||"—"}</td>
      ${tab==="clientes"?html`<td class="r num">${S.data.orcamentos.filter(o=>o.cliente===c.nome&&o.etapa==="aprovado").length}</td>`:html`<td class="small">${c.fornece||""}</td>`}
      <td class="r"><button class="btn sm" onClick=${()=>setEd({...c})}>Editar</button></td></tr>`)}</tbody></table></div>`:html`<${Empty} title=${tab==="clientes"?"Nenhum cliente":"Nenhum fornecedor"} text=${tab==="clientes"?"Clientes também podem ser cadastrados direto do orçamento.":"Cadastre as lojas de material elétrico para ligar aos materiais e comparar preço."}/>`}
  ${ed&&html`<${Modal} title=${ed.id?"Editar":"Novo cadastro"} onClose=${()=>setEd(null)}>
    <div class="grid g3"><${F} label="Nome"><${Inp} id="cd-n" value=${ed.nome} onChange=${v=>setEd({...ed,nome:v})}/><//><${F} label="Telefone / WhatsApp"><${Inp} id="cd-t" value=${ed.telefone} onChange=${v=>setEd({...ed,telefone:v})}/><//><${F} label="CPF / CNPJ"><${Inp} id="cd-d" value=${ed.doc} onChange=${v=>setEd({...ed,doc:v})}/><//>
    <${F} label="Endereço" style=${{gridColumn:"1/-1"}}><${Inp} id="cd-e" value=${ed.endereco} onChange=${v=>setEd({...ed,endereco:v})}/><//>${tab==="fornecedores"&&html`<${F} label="O que fornece"><${Inp} id="cd-f" value=${ed.fornece} onChange=${v=>setEd({...ed,fornece:v})}/><//>`}</div>
    <div class="row" style=${{justifyContent:"space-between"}}>${ed.id?html`<button class="btn ghost danger" onClick=${()=>{S.api.del(tab,ed.id,"Excluído.");setEd(null)}}>Excluir</button>`:html`<span></span>`}<button class="btn pri" disabled=${!ed.nome} onClick=${()=>{ed.id?S.api.set(tab,ed.id,ed,"Salvo."):S.api.add(tab,{...ed,criadoEm:new Date().toISOString()},"Cadastrado.");setEd(null)}}>Salvar</button></div><//>`}`;
};

/* ============================== PREÇOS E CUSTOS ============================== */
PAGES.precos=function Precos(){
  const S=useS();const [tab,setTab]=useState(S.pontos.length?"pontos":"param");
  const [cfg,setCfg]=useState(S.config);const [cfgDirty,setCfgDirty]=useState(false);
  useEffect(()=>{if(!cfgDirty)setCfg(S.config)},[S.configSalva,S.config.regras]);
  const [pts,setPts]=useState(S.pontos);const [ptsDirty,setPtsDirty]=useState(false);
  useEffect(()=>{if(!ptsDirty)setPts(S.pontos)},[S.precos]);
  const [kit,setKit]=useState(null);const [carregando,setCarregando]=useState(false);
  const setC=p=>{setCfg(x=>({...x,...p}));setCfgDirty(true)};
  const ch=(num(cfg.folhaMensal)*(1+num(cfg.encargosPct)/100)+num(cfg.custosFixos))/Math.max(1,num(cfg.horasProdutivas));
  const upP=(id,p)=>{setPts(a=>a.map(x=>x.id===id?{...x,...p}:x));setPtsDirty(true)};
  const carregarModelo=async()=>{
    setCarregando(true);
    try{
      const exist=new Set(S.mats.map(m=>m.id));
      for(const [id,nome,unid,custo] of MODELO.materiais)if(!exist.has(id))await S.api.set("materiais",id,{id,nome,unid,custo,estoque:0,minimo:0},null);
      const pontos=MODELO.pontos.map(([id,nome,grupo,unid,mo,horas,kit])=>({id,nome,grupo,unid,mo,horas,kit}));
      const atuais=new Set(S.pontos.map(p=>p.id));
      const novos=[...S.pontos,...pontos.filter(p=>!atuais.has(p.id))];
      await S.api.setMeta("precos",{pontos:novos},null);setPts(novos);setPtsDirty(false);
      if(!S.configSalva)await S.api.setMeta("config",cfg,null);
      S.toast("Tabela modelo carregada. Ajuste os valores para a sua realidade.");
    }finally{setCarregando(false)}
  };
  return html`<div class="phead"><div><h1>Preços e custos</h1><p>A base de toda a precificação: quanto custa a sua hora, quanto você cobra por ponto e o material que cada ponto leva.</p></div>
    <div class="row">${(!S.pontos.length||!S.mats.length)&&html`<button class="btn" disabled=${carregando} onClick=${carregarModelo}>${carregando?"Carregando…":"Carregar tabela modelo"}</button>`}</div></div>
  <${Tabs} value=${tab} onChange=${setTab} tabs=${[["param","Custo da hora e parâmetros"],["pontos",`Preço por ponto (${pts.length})`]]}/>
  ${tab==="param"&&html`<div class="grid g2" style=${{alignItems:"start"}}>
    <div class="card col"><h3>Quanto custa 1 hora da sua equipe</h3><p class="small muted" style=${{margin:0}}>É aqui que a maioria erra o preço: cobra o ponto sem saber quanto custa a hora trabalhada.</p>
      <div class="grid g2"><${F} label="Folha mensal da equipe (R$)"><${Inp} id="pc-fo" type="number" value=${cfg.folhaMensal} onChange=${v=>setC({folhaMensal:v})}/><//>
      <${F} label="Encargos e benefícios (%)"><${Inp} id="pc-en" type="number" value=${cfg.encargosPct} onChange=${v=>setC({encargosPct:v})}/><//>
      <${F} label="Custos fixos mensais (R$) · carro, aluguel, contador, ferramentas"><${Inp} id="pc-cf" type="number" value=${cfg.custosFixos} onChange=${v=>setC({custosFixos:v})}/><//>
      <${F} label="Horas produtivas por mês (equipe toda)"><${Inp} id="pc-hp" type="number" value=${cfg.horasProdutivas} onChange=${v=>setC({horasProdutivas:v})}/><//></div>
      <div class="small muted">Horas produtivas = pessoas em obra × ~150 h/mês (já descontando deslocamento, chuva e retrabalho). Ex.: 3 pessoas ≈ 450 h.</div>
      <div class="total-box"><div class="ln"><span>Custo da hora</span></div><div class="big">${brl(ch)}</div><div class="small" style=${{opacity:.8}}>Qualquer ponto que renda menos que isso por hora dá prejuízo.</div></div>
    </div>
    <div class="col"><div class="card col"><h3>Parâmetros do orçamento</h3>
      <div class="grid g2"><${F} label="Nome da empresa"><${Inp} id="pc-emp" value=${cfg.empresa} onChange=${v=>setC({empresa:v})}/><//><${F} label="Cidade"><${Inp} id="pc-cid" value=${cfg.cidade} onChange=${v=>setC({cidade:v})}/><//>
      <${F} label="Telefone (aparece na proposta)"><${Inp} id="pc-tel" value=${cfg.telefone} onChange=${v=>setC({telefone:v})}/><//><${F} label="Imposto padrão (%)"><${Inp} id="pc-imp" type="number" value=${cfg.impostoPct} onChange=${v=>setC({impostoPct:v})}/><//>
      <${F} label="Markup sobre material (%)"><${Inp} id="pc-mk" type="number" value=${cfg.markupMatPct} onChange=${v=>setC({markupMatPct:v})}/><//><${F} label="Fator industrial (× mão de obra)"><${Inp} id="pc-fi" type="number" value=${cfg.fatorIndustrial} onChange=${v=>setC({fatorIndustrial:v})}/><//>
      <${F} label="Deslocamento padrão (R$)"><${Inp} id="pc-dp" type="number" value=${cfg.deslocamentoPadrao} onChange=${v=>setC({deslocamentoPadrao:v})}/><//><${F} label="Margem mínima aceitável (%)"><${Inp} id="pc-mm" type="number" value=${cfg.margemMin} onChange=${v=>setC({margemMin:v})}/><//></div></div>
      <div class="card col"><h3>Regras da casa para ler projeto</h3><p class="small muted" style=${{margin:0}}>O jeito do patrão ler. A IA obedece estas regras e a equipe vê no guia. Uma por linha.</p>
        <textarea class="i" id="pc-rg" style=${{minHeight:130}} value=${cfg.regras} onChange=${e=>setC({regras:e.target.value})} placeholder=${"• Todo banheiro tem chuveiro mesmo que o projeto não mostre\n• Ponto de ar-condicionado: contar tomada 20A + dreno"}></textarea></div>
      <div class="row" style=${{justifyContent:"flex-end"}}><button class="btn pri" disabled=${!cfgDirty} onClick=${async()=>{if(await S.api.setMeta("config",cfg,"Parâmetros salvos."))setCfgDirty(false)}}>Salvar parâmetros</button></div>
    </div></div>`}
  ${tab==="pontos"&&html`${pts.length?html`<div class="alert info">Valores do modelo são só referência para começar. Ajuste pelo que você cobra hoje e confira a coluna R$/hora: ela tem que ficar acima do custo da hora (${brl(S.custoHora)}).</div>
    <div class="tbl-wrap"><table><thead><tr><th>Tipo de ponto</th><th>Grupo</th><th class="r">Preço M.O.</th><th class="r">Horas</th><th class="r">R$/hora</th><th class="r">Material (kit)</th><th></th></tr></thead><tbody>
    ${pts.map(p=>{const rh=num(p.horas)?num(p.mo)/num(p.horas):0;const ck=custoKit(p,S.mats);return html`<tr key=${p.id}><td style=${{minWidth:200}}><input class="i" value=${p.nome} onChange=${e=>upP(p.id,{nome:e.target.value})} aria-label="Nome"/></td>
      <td style=${{width:130}}><${Sel} value=${p.grupo} onChange=${v=>upP(p.id,{grupo:v})} opts=${["Residencial","Quadro","Industrial"]}/></td>
      <td style=${{width:110}}><${Inp} type="number" value=${p.mo} onChange=${v=>upP(p.id,{mo:v})} aria-label="Preço mão de obra"/></td>
      <td style=${{width:90}}><${Inp} type="number" value=${p.horas} onChange=${v=>upP(p.id,{horas:v})} aria-label="Horas"/></td>
      <td class="r num">${rh?html`<span class=${"pill "+(rh<S.custoHora?"bad":rh<S.custoHora*1.3?"warn":"ok")}>${brl(rh)}</span>`:"—"}</td>
      <td class="r"><button class="btn sm" onClick=${()=>setKit(p)}>${(p.kit||[]).length} itens · ${brl(ck)}</button></td>
      <td><button class="btn sm ghost danger" aria-label="Remover" onClick=${()=>{setPts(a=>a.filter(x=>x.id!==p.id));setPtsDirty(true)}}>✕</button></td></tr>`})}</tbody></table></div>
    <div class="row" style=${{justifyContent:"space-between"}}><button class="btn" onClick=${()=>{setPts(a=>[...a,{id:"p"+uid().slice(-6),nome:"Novo tipo de ponto",grupo:"Residencial",unid:"pt",mo:0,horas:1,kit:[]}]);setPtsDirty(true)}}>+ Tipo de ponto</button>
      <button class="btn pri" disabled=${!ptsDirty} onClick=${async()=>{if(await S.api.setMeta("precos",{pontos:pts},"Tabela de preços salva."))setPtsDirty(false)}}>Salvar tabela</button></div>`
    :html`<${Empty} title="Tabela de preços vazia" text="Carregue a tabela modelo (28 tipos de ponto com kit de material) e ajuste os valores, ou crie os tipos um a um."><div class="row"><button class="btn pri" disabled=${carregando} onClick=${carregarModelo}>Carregar tabela modelo</button><button class="btn" onClick=${()=>{setPts([{id:"p"+uid().slice(-6),nome:"Novo tipo de ponto",grupo:"Residencial",unid:"pt",mo:0,horas:1,kit:[]}]);setPtsDirty(true)}}>Criar do zero</button></div><//>`}`}
  ${kit&&html`<${KitModal} p=${pts.find(x=>x.id===kit.id)||kit} onClose=${()=>setKit(null)} onSave=${k=>{upP(kit.id,{kit:k});setKit(null)}}/>`}`;
};
function KitModal({p,onClose,onSave}){
  const S=useS();const [k,setK]=useState(p.kit||[]);const [add,setAdd]=useState("");
  return html`<${Modal} title=${"Material por ponto · "+p.nome} onClose=${onClose}>
    <p class="small muted" style=${{margin:0}}>O que vai em cada unidade deste ponto. Cabo e eletroduto ficam de fora: entram pela metragem do projeto.</p>
    ${k.map(([mid,q],i)=>{const m=S.mats.find(x=>x.id===mid);return html`<div class="it" key=${mid}><span class="nm">${m?m.nome:mid+" (não cadastrado)"}</span><span class="small muted num">${m?brl(num(m.custo)*num(q)):""}</span><${Num} value=${q} onChange=${v=>setK(a=>v>0?a.map((x,j)=>j===i?[x[0],v]:x):a.filter((_,j)=>j!==i))}/></div>`})}
    <select class="i" value=${add} onChange=${e=>{const v=e.target.value;if(v&&!k.find(x=>x[0]===v))setK([...k,[v,1]]);setAdd("")}} aria-label="Adicionar material"><option value="">+ adicionar material…</option>${S.mats.map(m=>html`<option key=${m.id} value=${m.id}>${m.nome}</option>`)}</select>
    <div class="row" style=${{justifyContent:"flex-end"}}><button class="btn pri" onClick=${()=>onSave(k)}>Aplicar</button></div><//>`;
}

/* ============================== EQUIPE ============================== */
PAGES.equipe=function Equipe(){
  const S=useS();const [papelNovo,setPapelNovo]=useState({});
  const local=S.be.status!=="ready";
  const liberar=async id=>{await S.api.set("team",id,{id,role:papelNovo[id]||"eletricista",active:true,addedAt:new Date().toISOString()},null);await S.api.del("access_requests",id,"Acesso liberado.")};
  return html`<div class="phead"><div><h1>Equipe e acessos</h1><p>Quem entra no sistema e o que cada um vê. Eletricista e ajudante veem só tarefas, OS, almoxarifado e o guia; preço e financeiro ficam com o patrão e o escritório.</p></div></div>
  ${local&&html`<div class="alert warn">No modo local não há equipe. Abra pelo link do claude.ai e compartilhe com a equipe (permissão de edição) para cada um pedir acesso.</div>`}
  <div class="card col"><h3>Como colocar alguém na equipe</h3><ol style=${{margin:0,paddingLeft:18}} class="small"><li>Compartilhe o link deste sistema com a pessoa, com permissão de edição.</li><li>Ela abre, faz login e toca em "Pedir acesso".</li><li>O pedido aparece aqui: escolha a função e libere.</li></ol></div>
  ${S.data.access_requests.length?html`<div class="card col"><h3>Pedidos de acesso</h3>${S.data.access_requests.map(r=>html`<div class="row" key=${r.id} style=${{justifyContent:"space-between"}}><div><b>${S.nome(r.id)}</b><div class="small muted">pediu em ${dataBR((r.requestedAt||"").slice(0,10))}</div></div>
    <div class="row"><select class="i" style=${{width:"auto"}} value=${papelNovo[r.id]||"eletricista"} onChange=${e=>setPapelNovo({...papelNovo,[r.id]:e.target.value})} aria-label="Função">${Object.entries(PAPEIS).filter(([k])=>k!=="patrao").map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select>
    <button class="btn pri" onClick=${()=>liberar(r.id)}>Liberar</button><button class="btn ghost danger" onClick=${()=>S.api.del("access_requests",r.id,"Pedido recusado.")}>Recusar</button></div></div>`)}</div>`:null}
  ${S.data.team.length?html`<div class="tbl-wrap"><table><thead><tr><th>Pessoa</th><th>Função</th><th class="r">Tarefas abertas</th><th>Acesso</th><th></th></tr></thead><tbody>
    ${S.data.team.map(t=>{const ab=S.data.os.filter(o=>o.etapa!=="concluida").flatMap(o=>o.tarefas||[]).filter(k=>k.resp===t.id&&!k.feito).length;
      return html`<tr key=${t.id}><td><b>${S.nome(t.id)}</b></td><td><select class="i" style=${{width:"auto"}} value=${t.role} onChange=${e=>S.api.update("team",t.id,{role:e.target.value},"Função atualizada.")} aria-label="Função">${Object.entries(PAPEIS).filter(([k])=>k!=="patrao").map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select></td>
      <td class="r num">${ab}</td><td>${t.active!==false?html`<span class="pill ok">Ativo</span>`:html`<span class="pill">Pausado</span>`}</td>
      <td class="r"><div class="row" style=${{justifyContent:"flex-end",flexWrap:"nowrap"}}><button class="btn sm" onClick=${()=>S.api.update("team",t.id,{active:t.active===false},t.active===false?"Acesso reativado.":"Acesso pausado.")}>${t.active===false?"Reativar":"Pausar"}</button><button class="btn sm ghost danger" onClick=${()=>S.api.del("team",t.id,"Removido da equipe.")}>Remover</button></div></td></tr>`})}
  </tbody></table></div>`:!local&&html`<${Empty} title="Ninguém na equipe ainda" text="Quando alguém pedir acesso pelo link compartilhado, o pedido aparece aqui."/>`}`;
};

/* ============================== BOOT ============================== */
ReactDOM.createRoot(document.getElementById("root")).render(html`<${Provider}><${App}/><//>`);
</script>
