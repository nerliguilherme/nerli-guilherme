<title>Lumen Gestão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: menu lateral claro com 5 destinos principais (desktop) / barra de abas embaixo (celular).
   Amarelo Lumen = ação principal. Cores dos fios da NBR 5410 marcam as etapas da obra. */
:root{
  --bg:#f4f6f8; --panel:#ffffff; --sunk:#eef1f4; --line:#e1e6eb; --fg:#17202a; --muted:#5d6975;
  --ink:#1b2733; --ink-fg:#eef2f6;
  --accent:#f7b52c; --accent-fg:#1d1600; --accent-text:#0573a8; --accent-soft:#fff3d1;
  --brand:#0a97d9; --brand-soft:#e1f2fb;
  --ok:#1d7a45; --ok-soft:#dff2e6; --warn:#946000; --warn-soft:#fbefd2; --bad:#b3261e; --bad-soft:#fbe1de;
  --fio-fase:#c8392b; --fio-neutro:#3a8bd0; --fio-terra:#3f9b45; --fio-retorno:#3a3f45; --fio-cinza:#98a3ae;
  --f-disp:"Montserrat","Inter",Arial,sans-serif;
  --f-body:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,30,40,.06),0 2px 8px rgba(20,30,40,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#192029; --sunk:#141a21; --line:#29323c; --fg:#e8edf2; --muted:#9aa6b2;
  --ink:#0c1116; --ink-fg:#e2e8ee;
  --accent:#f7b52c; --accent-fg:#1d1600; --accent-text:#5cc0ee; --accent-soft:#3a2f0a;
  --brand:#2aa9e6; --brand-soft:#0f2c3b;
  --ok:#5fc78c; --ok-soft:#15301f; --warn:#e8b54d; --warn-soft:#33270f; --bad:#f28a82; --bad-soft:#3a1715;
  --fio-retorno:#cfd6dd; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#192029; --sunk:#141a21; --line:#29323c; --fg:#e8edf2; --muted:#9aa6b2;
  --ink:#0c1116; --ink-fg:#e2e8ee;
  --accent:#f7b52c; --accent-fg:#1d1600; --accent-text:#5cc0ee; --accent-soft:#3a2f0a;
  --brand:#2aa9e6; --brand-soft:#0f2c3b;
  --ok:#5fc78c; --ok-soft:#15301f; --warn:#e8b54d; --warn-soft:#33270f; --bad:#f28a82; --bad-soft:#3a1715;
  --fio-retorno:#cfd6dd; --shadow:none; color-scheme:dark}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800} h2{font-size:20px} h3{font-size:16.5px}
.num,.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.app{display:flex;height:100%}
/* menu lateral */
.rail{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand .shield{width:34px;height:44px;flex:none}
.brand .wm{font-family:var(--f-disp);font-size:23px;font-weight:800;line-height:1;letter-spacing:.01em}
.brand .wm span{font-size:inherit} .brand .wm .a{color:var(--accent)} .brand .wm .b{color:var(--brand)}
.brand .sub{font-size:10.5px;line-height:1.25;color:var(--brand);font-weight:600;letter-spacing:.02em;text-transform:uppercase;display:block;margin-top:3px}
.brand img.logoimg{max-width:190px;max-height:52px;object-fit:contain}
.brand b{font-family:var(--f-disp);font-size:21px;font-weight:800;display:block;line-height:1}
.brand span{font-size:12px;color:var(--muted)}
.navgrp{font-size:11.5px;font-weight:600;color:var(--muted);padding:16px 12px 4px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;background:none;border:0;color:var(--fg);text-align:left;cursor:pointer;width:100%;font-size:15px;font-weight:500;min-height:44px}
.nav svg{width:20px;height:20px;flex:none;color:var(--muted)}
.nav.sec{font-size:14px;min-height:38px;padding:7px 12px}
.nav.sec svg{width:18px;height:18px}
.nav:hover{background:var(--sunk)}
.nav[aria-current="page"]{background:var(--brand-soft);font-weight:600}
.nav[aria-current="page"] svg{color:var(--accent-text)}
.nav .badge{margin-left:auto}
.rail .me{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.rail .me b{color:var(--fg);font-weight:600;display:block}
.bottombar{display:none}
.main{flex:1;min-width:0;overflow-y:auto}
.page{max-width:1120px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between}
.phead p{margin:6px 0 0;color:var(--muted);max-width:620px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.card.flat{background:transparent;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:8px 15px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap;min-height:40px;font-size:14.5px}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(.96)}
.btn.big{min-height:48px;font-size:15.5px;padding:10px 20px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px;min-height:32px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
input.i,select.i,textarea.i{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 11px;width:100%;min-width:0;min-height:40px}
textarea.i{min-height:80px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent-text);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:var(--sunk);width:34px;height:36px;cursor:pointer;font-weight:700;font-size:16px}
.stepper input{width:52px;border:0;text-align:center;background:var(--panel);height:36px;font-variant-numeric:tabular-nums;font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--muted);text-align:left;background:var(--sunk);font-weight:600}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.badge{background:var(--bad);color:#fff;font-size:11.5px;border-radius:99px;padding:1px 7px;font-weight:700;line-height:1.4}
.kpi{display:flex;flex-direction:column;gap:3px}
.kpi b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted);font-weight:500}
.wire{width:4px;border-radius:2px;align-self:stretch;flex:none}
.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--sunk);padding:4px;border-radius:10px;width:fit-content;max-width:100%}
.tab{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);border-radius:7px;white-space:nowrap;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{color:var(--fg);background:var(--panel);box-shadow:var(--shadow)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--sunk);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kcol h3{font-size:15px;display:flex;align-items:center;gap:8px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer;display:flex;gap:10px;text-align:left;width:100%;box-shadow:var(--shadow)}
.kcard:hover{border-color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:9px;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ok{background:var(--ok-soft);color:var(--ok)} .alert.info{background:var(--accent-soft);color:var(--fg)}
.alert b{font-weight:700}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--panel)}
.empty h3{color:var(--fg);font-size:19px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ink-fg);padding:12px 18px;border-radius:10px;box-shadow:0 8px 28px #0005;z-index:50;max-width:min(420px,calc(100vw - 32px));font-weight:500}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--bg);border-radius:14px;width:min(1100px,100%);margin-top:12px;display:flex;flex-direction:column;overflow:clip}
.modal-f{position:sticky;bottom:0;z-index:2;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(20,30,40,.06)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2;flex-wrap:wrap}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:18px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent-text);font-size:14px}
.step.done .n{background:var(--ok);color:#fff}
.sym{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sym svg{width:52px;height:40px}
.sym svg *{stroke:var(--fg);fill:none;stroke-width:1.6}
.sym svg .fill{fill:var(--fg)}
.sym svg text{fill:var(--fg);stroke:none;font:600 10px var(--f-body)}
.pages{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pg{flex:none;width:140px;border:2px solid var(--line);border-radius:9px;padding:4px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.pg[aria-pressed="true"]{border-color:var(--accent)}
.pg img{width:100%;height:100px;object-fit:contain;background:#fff;border-radius:5px}
.viewer{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:auto;max-height:70vh}
.viewer img{display:block;max-width:none}
.crop-layer{position:absolute;inset:0;cursor:crosshair;touch-action:none;background:rgba(23,32,42,.08)}
.crop-rect{position:absolute;border:2px dashed #d39b00;background:rgba(245,180,0,.18)}
.comodo{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.comodo-h{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.comodo-b{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.it{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it .nm{flex:1;min-width:150px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.task input[type=checkbox]{width:24px;height:24px;margin-top:1px;accent-color:var(--ok);flex:none}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--ok);width:18px;height:18px}
.total-box{background:var(--ink);color:var(--ink-fg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:7px}
.total-box .ln{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.total-box .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.gate{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate .card{max-width:440px;display:flex;flex-direction:column;gap:12px}
/* início: caminho da obra */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fstep{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;min-width:0}
.fstep .top{display:flex;align-items:center;gap:10px}
.fstep .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:800;display:grid;place-items:center;flex:none}
.fstep h3{font-size:17px}
.fstep .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.fstep p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.fstep .btn{width:100%}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-12px;top:32px;width:10px;height:10px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:rotate(45deg);opacity:.5}
.mais{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mais button{display:flex;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;box-shadow:var(--shadow)}
.mais button:hover{border-color:var(--muted)}
.mais .ic{width:42px;height:42px;border-radius:10px;background:var(--brand-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.mais .ic svg{width:22px;height:22px}
.mais b{display:block;font-size:15.5px}
.mais span{font-size:13px;color:var(--muted)}
.help{font-size:13.5px;color:var(--muted)}
.help summary{cursor:pointer;font-weight:600;color:var(--fg);width:fit-content}
@media (max-width: 1000px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.fstep::after{display:none}}
@media (max-width: 860px){
  .rail{display:none}
  .page{padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
  .bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottombar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:600;padding:6px 2px;border-radius:9px;position:relative;cursor:pointer;min-width:0}
  .bottombar svg{width:23px;height:23px}
  .bottombar button[aria-current="page"]{color:var(--fg)}
  .bottombar button[aria-current="page"] svg{color:var(--accent-text)}
  .bottombar .badge{position:absolute;top:0;left:55%}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .modal-bg{padding:0}
  .modal{margin-top:0;border-radius:0;min-height:100%}
  h1{font-size:25px}
}
@media (max-width: 560px){.flow{grid-template-columns:1fr}}
</style>

const Ctx=createContext(null);
const useS=()=>useContext(Ctx);

function useBackend(){
  const [st,setSt]=useState({status:"loading"});
  useEffect(()=>{
    let dead=false;
    const c=window.claude;
    if(!c||typeof c.use!=="function"){setSt({status:"local"});return}
    const t=setTimeout(()=>{if(!dead)setSt(s=>s.status==="loading"?{status:"local"}:s)},11000);
    (async()=>{
      try{
        const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
        if(dead)return;
        if(!db||!user){setSt({status:user?"signedout":"local"});return}
        const me=await user.me();
        const isOwner=!!(await user.isOwner?.());
        const canEdit=!!(await user.canEdit?.());
        if(!me||!me.id){setSt({status:"signedout"});return}
        setSt({status:"ready",db,user,me:{id:me.id,name:me.name||"",isOwner,canEdit}});
      }catch(e){console.error(e);if(!dead)setSt({status:"local"})}
    })();
    return()=>{dead=true;clearTimeout(t)};
  },[]);
  return st;
}

function Provider({children}){
  const be=useBackend();
  const [data,setData]=useState(()=>Object.fromEntries(COLS.map(c=>[c,[]])));
  const [config,setConfig]=useState(null);
  const [precos,setPrecos]=useState(null);
  const [loaded,setLoaded]=useState(false);
  const [toastMsg,setToastMsg]=useState(null);
  const [names,setNames]=useState({});
  const local=useRef(null);
  const toast=useCallback(m=>{setToastMsg(m);clearTimeout(toast._t);toast._t=setTimeout(()=>setToastMsg(null),3800)},[]);

  // carregar dados
  useEffect(()=>{
    if(be.status==="local"){
      const d=lsGet("elet_local",null)||{};
      local.current={cols:Object.fromEntries(COLS.map(c=>[c,d[c]||[]])),config:d.config||null,precos:d.precos||null};
      setData(local.current.cols);setConfig(local.current.config);setPrecos(local.current.precos);setLoaded(true);return;
    }
    if(be.status!=="ready")return;
    const db=be.db,unsubs=[];let pend=COLS.length+2;
    const done=()=>{pend--;if(pend<=0)setLoaded(true)};
    for(const c of COLS){
      let first=true;
      if(c==="access_requests"&&!(be.me.isOwner||be.me.canEdit)){done();continue}
      unsubs.push(db.collection(c).onSnapshot(s=>{setData(p=>({...p,[c]:s.docs.map(d=>({...(d.data()||{}),id:d.id}))}));if(first){first=false;done()}},()=>{if(first){first=false;done()}}));
    }
    let f1=true,f2=true;
    unsubs.push(db.doc("meta/config").onSnapshot(s=>{setConfig(s.exists?s.data():null);if(f1){f1=false;done()}},()=>{if(f1){f1=false;done()}}));
    unsubs.push(db.doc("meta/precos").onSnapshot(s=>{setPrecos(s.exists?s.data():null);if(f2){f2=false;done()}},()=>{if(f2){f2=false;done()}}));
    const t=setTimeout(()=>setLoaded(true),6000);
    return()=>{unsubs.forEach(u=>{try{u()}catch{}});clearTimeout(t)};
  },[be.status]);

  // nomes da equipe
  useEffect(()=>{
    if(be.status!=="ready")return;
    const ids=[...new Set([...data.team.map(t=>t.id),...data.access_requests.map(r=>r.id),be.me.id])].filter(Boolean);
    if(!ids.length)return;
    be.user.profiles(ids).then(ps=>{const o={};for(const id of ids)o[id]=(ps&&ps[id]&&ps[id].name)||"";setNames(o)}).catch(()=>{});
  },[be.status,data.team.length,data.access_requests.length]);

  const persistLocal=()=>lsSet("elet_local",{...local.current.cols,config:local.current.config,precos:local.current.precos});
  const wrap=async(fn,ok)=>{try{await fn();if(ok)toast(ok);return true}catch(e){console.error(e);toast(e&&e.code==="not_granted"?"Você não tem permissão para salvar isso.":"Não foi possível salvar: "+(e&&e.message||"erro"));return false}};

  const api=useMemo(()=>{
    if(be.status==="ready"){
      const db=be.db;
      return{
        add:(c,o,ok)=>{const id=o.id||uid();return wrap(()=>db.doc(`${c}/${id}`).set(clean({...o,id})),ok).then(r=>r?id:null)},
        set:(c,id,o,ok)=>wrap(()=>db.doc(`${c}/${id}`).set(clean({...o,id})),ok),
        update:(c,id,p,ok)=>wrap(()=>db.doc(`${c}/${id}`).update(clean(p)),ok),
        del:(c,id,ok)=>wrap(()=>db.doc(`${c}/${id}`).delete(),ok),
        setMeta:(k,o,ok)=>wrap(()=>db.doc(`meta/${k}`).set(clean(o)),ok)
      };
    }
    const L=()=>local.current;
    const upd=(c,f)=>{L().cols={...L().cols,[c]:f(L().cols[c]||[])};setData(L().cols);persistLocal()};
    return{
      add:async(c,o,ok)=>{const id=o.id||uid();upd(c,a=>[...a,clean({...o,id})]);ok&&toast(ok);return id},
      set:async(c,id,o,ok)=>{upd(c,a=>[...a.filter(x=>x.id!==id),clean({...o,id})]);ok&&toast(ok);return true},
      update:async(c,id,p,ok)=>{upd(c,a=>a.map(x=>x.id===id?clean({...x,...p}):x));ok&&toast(ok);return true},
      del:async(c,id,ok)=>{upd(c,a=>a.filter(x=>x.id!==id));ok&&toast(ok);return true},
      setMeta:async(k,o,ok)=>{L()[k]=clean(o);k==="config"?setConfig(L().config):setPrecos(L().precos);persistLocal();ok&&toast(ok);return true}
    };
  },[be.status]);

  // papel do usuário
  const me=be.status==="ready"?be.me:{id:"local",name:"Você",isOwner:true,canEdit:true};
  const membro=data.team.find(t=>t.id===me.id);
  const admin=me.isOwner||me.canEdit;
  const papel=admin?"patrao":(membro&&membro.active!==false?membro.role:null);
  const cfg={...CONFIG_PADRAO,...(config||{})};
  const custoHora=(num(cfg.folhaMensal)*(1+num(cfg.encargosPct)/100)+num(cfg.custosFixos))/Math.max(1,num(cfg.horasProdutivas));
  const mats=data.materiais;
  const pontos=(precos&&precos.pontos)||[];
  const nome=id=>id===me.id?(names[id]||me.name||"Você"):(names[id]||"Pessoa da equipe");

  const value={be,data,config:cfg,configSalva:!!config,precos,pontos,mats,api,toast,me,papel,admin,membro,custoHora,nome,loaded};
  return html`<${Ctx.Provider} value=${value}>${children}${toastMsg&&html`<div class="toast" role="status">${toastMsg}</div>`}<//>`;
}

/* ============================== CÁLCULOS ============================== */
function custoKit(p,mats){let s=0;for(const [mid,q] of (p.kit||[])){const m=mats.find(x=>x.id===mid);if(m)s+=num(m.custo)*num(q)}return s}
const repDe=c=>Math.max(1,num(c&&c.rep)||1);
function totaisProjeto(pj){const t={};for(const c of (pj.comodos||[])){const r=repDe(c);for(const [k,q] of Object.entries(c.itens||{}))if(num(q))t[k]=(t[k]||0)+num(q)*r}return t}
function metragemEstimada(tot){
  const g=k=>tot[k]||0;
  const luzes=g("luz")+g("arand")+g("int1")+g("int2")+g("int3w")+g("int4w")+g("sens")+g("lumind");
  const tugs=g("tug")+g("tug20")+g("rede")+g("tv")+g("camp")+g("tomind");
  const tues=g("chuv")+g("ar")+g("tue")+g("motor");
  const tot_=Object.entries(tot).filter(([k])=>!["qdc","dj1","dj2","dj3","dr","dps","padrao","aterr","qcm","eletcal"].includes(k)).reduce((a,[,v])=>a+v,0);
  return{el34:Math.round(tot_*5),el1:tues?Math.round(tues*4):0,c15:Math.round(luzes*10),c25:Math.round(tugs*12),c4:0,c6:Math.round(tues*20),c10:0,c16:0};
}
function linhasDoProjeto(pj,ctx){
  const {pontos,mats,config}=ctx;
  const tot=totaisProjeto(pj);
  const ind=pj.tipo==="industrial";
  const linhas=[];
  for(const p of pontos){
    const q=tot[p.id];if(!q)continue;
    const ck=custoKit(p,mats);
    linhas.push({id:uid(),tipoId:p.id,desc:p.nome,unid:p.unid,qtd:q,mo:Math.round(num(p.mo)*(ind?num(config.fatorIndustrial):1)*100)/100,custoMat:ck,mat:Math.round(ck*(1+num(config.markupMatPct)/100)*100)/100,horas:num(p.horas)});
  }
  for(const k of Object.keys(tot))if(!pontos.find(p=>p.id===k))linhas.push({id:uid(),tipoId:k,desc:"Item não cadastrado: "+k,unid:"un",qtd:tot[k],mo:0,custoMat:0,mat:0,horas:0});
  const med=pj.metragem||{};const temMed=Object.values(med).some(v=>num(v)>0);
  const mt=temMed?med:metragemEstimada(tot);
  for(const [mid,lab] of METRAGENS){
    const q=num(mt[mid]);if(!q)continue;
    const m=mats.find(x=>x.id===mid);const c=m?num(m.custo):0;
    linhas.push({id:uid(),matId:mid,desc:lab+(temMed?"":" (estimado)"),unid:"m",qtd:q,mo:0,custoMat:c,mat:Math.round(c*(1+num(config.markupMatPct)/100)*100)/100,horas:0});
  }
  for(const o of (pj.outros||[]))if(num(o.qtd))linhas.push({id:uid(),desc:o.desc+" (lista do projeto)",unid:o.unid||"un",qtd:num(o.qtd),mo:0,custoMat:0,mat:0,horas:0});
  return linhas;
}
function calcOrc(o,custoHora){
  const L=o.linhas||[];
  const mo=L.reduce((a,l)=>a+num(l.qtd)*num(l.mo),0);
  const mat=o.clienteMaterial?0:L.reduce((a,l)=>a+num(l.qtd)*num(l.mat),0);
  const custoMat=o.clienteMaterial?0:L.reduce((a,l)=>a+num(l.qtd)*num(l.custoMat),0);
  const horas=L.reduce((a,l)=>a+num(l.qtd)*num(l.horas),0);
  const desloc=num(o.deslocamento),desc=num(o.desconto);
  const subtotal=mo+mat+desloc-desc;
  const imposto=subtotal*num(o.impostoPct)/100;
  const custoMO=horas*custoHora;
  const custo=custoMO+custoMat+desloc;
  const lucro=subtotal-imposto-custo;
  const margem=subtotal>0?lucro/subtotal*100:0;
  const moHora=horas>0?mo/horas:0;
  return{mo,mat,custoMat,horas,desloc,desc,subtotal,imposto,custoMO,custo,lucro,margem,moHora,total:subtotal};
}
function saudeOrc(o,c,cfg,custoHora){
  const a=[];
  if(!(o.linhas||[]).length)a.push(["bad","Orçamento sem itens."]);
  if(c.horas>0&&c.moHora<custoHora)a.push(["bad",`A mão de obra está saindo a ${brl(c.moHora)} por hora trabalhada, abaixo do custo da sua hora (${brl(custoHora)}). Cada hora nessa obra dá prejuízo.`]);
  if(c.margem<0)a.push(["bad",`Margem negativa (${n2(c.margem)}%). Esse preço não paga a obra.`]);
  else if(c.margem<num(cfg.margemMin))a.push(["warn",`Margem de ${n2(c.margem)}%, abaixo do mínimo definido (${n2(cfg.margemMin)}%).`]);
  if(!num(o.impostoPct))a.push(["warn","Imposto zerado. Se emite nota, o imposto sai do seu lucro."]);
  if(!num(o.deslocamento))a.push(["warn","Sem deslocamento. Combustível e tempo de ida e volta ficam por sua conta."]);
  if((o.linhas||[]).some(l=>/estimado/.test(l.desc||"")))a.push(["warn","Metragem de cabo e eletroduto estimada pela média. Meça no projeto (passo 5) para fechar o preço certo."]);
  if((o.linhas||[]).some(l=>num(l.qtd)>0&&!num(l.mo)&&!num(l.mat)))a.push(["warn","Há itens com preço zero."]);
  if(!a.length)a.push(["ok","Preço saudável: cobre a hora da equipe, o material, o imposto e deixa margem acima do mínimo."]);
  return a;
}
function gerarTarefas(pj,pontos){
  const tarefas=[];
  const P=id=>pontos.find(p=>p.id===id);
  const grupoQ=id=>{const p=P(id);return p&&p.grupo==="Quadro"};
  for(const c of (pj.comodos||[])){
    const itens=Object.entries(c.itens||{}).filter(([k,q])=>num(q)>0&&!grupoQ(k)&&k!=="qcm");
    if(!itens.length)continue;
    const r=repDe(c);
    const desc=itens.map(([k,q])=>`${q}× ${(P(k)||{nome:k}).nome}`).join(", ");
    const h=itens.reduce((a,[k,q])=>a+num(q)*num((P(k)||{}).horas),0)*r;
    for(const e of ["infra","enfiacao","acabamento"]){
      const E=ETAPAS_OS.find(x=>x.id===e);
      tarefas.push({id:uid(),etapa:e,comodo:c.nome,desc:`${c.nome}${r>1?` (×${r} unidades)`:""}: ${E.t.toLowerCase()} (${desc}${r>1?" em cada":""})`,horas:Math.round(h*E.frac*10)/10,resp:"",feito:false});
    }
  }
  const tot=totaisProjeto(pj);
  const q=Object.entries(tot).filter(([k])=>grupoQ(k)||k==="qcm");
  if(q.length){
    const h=q.reduce((a,[k,v])=>a+v*num((P(k)||{}).horas),0);
    tarefas.push({id:uid(),etapa:"quadro",comodo:"Quadro",desc:"Montar e ligar o quadro: "+q.map(([k,v])=>`${v}× ${(P(k)||{nome:k}).nome}`).join(", "),horas:Math.round(h*10)/10,resp:"",feito:false});
    tarefas.push({id:uid(),etapa:"quadro",comodo:"Quadro",desc:"Identificar circuitos no quadro (etiquetas conforme quadro de cargas)",horas:0.5,resp:"",feito:false});
  }
  tarefas.push({id:uid(),etapa:"testes",comodo:"Geral",desc:"Testar isolamento, polaridade das tomadas, aterramento e botão de teste do DR",horas:1.5,resp:"",feito:false});
  tarefas.push({id:uid(),etapa:"testes",comodo:"Geral",desc:"Entregar ao cliente: mostrar o quadro, explicar circuitos e tirar fotos finais",horas:0.5,resp:"",feito:false});
  return tarefas;
}

function Num({value,onChange,step=1,min=0,id}){

  return html`<span class="stepper"><button type="button" aria-label="Diminuir" onClick=${()=>onChange(Math.max(min,num(value)-step))}>−</button><input id=${id} inputmode="decimal" value=${v} onChange=${e=>{setV(e.target.value);onChange(num(e.target.value))}}/><button type="button" aria-label="Aumentar" onClick=${()=>onChange(num(value)+step)}>+</button></span>`;
}
function F({label,children,style}){return html`<label class="f" style=${style}>${label}${children}</label>`}
function Inp({value,onChange,type="text",placeholder,id,...r}){return html`<input class="i" id=${id} type=${type} value=${value??""} placeholder=${placeholder} onChange=${e=>onChange(type==="number"?num(e.target.value):e.target.value)} ...${r}/>`}
function Sel({value,onChange,opts,id}){return html`<select class="i" id=${id} value=${value??""} onChange=${e=>onChange(e.target.value)}>${opts.map(o=>Array.isArray(o)?html`<option value=${o[0]}>${o[1]}</option>`:html`<option value=${o}>${o}</option>`)}</select>`}
function Modal({title,onClose,children,actions,footer}){
  const ref=useRef(onClose);ref.current=onClose;
  useEffect(()=>{const k=e=>e.key==="Escape"&&ref.current();addEventListener("keydown",k);return()=>removeEventListener("keydown",k)},[]);
  return html`<div class="modal-bg" onMouseDown=${e=>e.target===e.currentTarget&&onClose()}><div class="modal" role="dialog" aria-label=${title}>
    <div class="modal-h"><h2 style=${{flex:1,minWidth:0}}>${title}</h2>${actions}<button class="btn ghost" onClick=${onClose} aria-label="Fechar">✕</button></div>
    <div class="modal-b">${children}</div>${footer?html`<div class="modal-f">${footer}</div>`:null}</div></div>`;
}
function StatusSalvo({salvando,dirty,ok,hora,vazio}){

if(window.pdfjsLib){try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch{}}
async function abrirPdf(buf){return await pdfjsLib.getDocument({data:buf,isEvalSupported:false}).promise}
async function renderPagina(pdf,n,maxLado){
  const pg=await pdf.getPage(n);const v0=pg.getViewport({scale:1});
  const sc=maxLado/Math.max(v0.width,v0.height);const v=pg.getViewport({scale:sc});
  const cv=document.createElement("canvas");cv.width=Math.round(v.width);cv.height=Math.round(v.height);
  const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
  await pg.render({canvasContext:cx,viewport:v}).promise;return cv;
}
const canvasBlob=(cv,q=.85)=>new Promise(r=>cv.toBlob(b=>r(b),"image/jpeg",q));
async function arquivoParaPaginas(file,onProg){
  const out=[];
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib)throw new Error("Leitor de PDF não carregou. Recarregue a página.");
    const pdf=await abrirPdf(await file.arrayBuffer());
    const N=Math.min(pdf.numPages,20);
    for(let i=1;i<=N;i++){onProg&&onProg(`Lendo página ${i} de ${N}…`);const big=await renderPagina(pdf,i,4200);const blob=await canvasBlob(big);out.push({n:i,blob,url:URL.createObjectURL(blob),w:big.width,h:big.height})}
  }else{
    const blob=file;const url=URL.createObjectURL(blob);out.push({n:1,blob,url})
  }
  return out;
}
async function recortar(blob,r){
  const bmp=await createImageBitmap(blob);
  const sx=r.x*bmp.width,sy=r.y*bmp.height,sw=r.w*bmp.width,sh=r.h*bmp.height;
  const k=Math.min(1,3200/Math.max(sw,sh));
  const cv=document.createElement("canvas");cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
  const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
  cx.drawImage(bmp,sx,sy,sw,sh,0,0,cv.width,cv.height);
  return await canvasBlob(cv,.9);
}
async function caber(blob,maxB){
  if(!maxB||blob.size<=maxB)return blob;
  const bmp=await createImageBitmap(blob);let s=1,b=blob;
  while(b.size>maxB&&s>.15){s*=.75;const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bmp,0,0,cv.width,cv.height);b=await canvasBlob(cv,.82)}
  return b;
}

const IA_DESENHO=`Projetos feitos em software (símbolos coloridos, eletrodutos em curva) seguem a mesma lógica: cada símbolo é um ponto; a linha ou curva é eletroduto e NÃO é ponto; números e letras ao lado são circuito e comando.`;
function promptRecorte(modo,rotulo,cat,regras,dica){
  const fim=`\nRegras da casa (o patrão definiu, obedeça):\n${regras||"(nenhuma)"}${dica?"\nObservação de quem enviou: "+dica:""}\nResponda SOMENTE com JSON.`;
  if(modo==="unidade")return `Você é um eletricista projetista brasileiro. A imagem é um RECORTE AMPLIADO de uma prancha elétrica mostrando: ${rotulo||"uma área da planta"}.
Conte os pontos CÔMODO POR CÔMODO usando SOMENTE os ids do catálogo abaixo. ${IA_DESENHO}
Símbolos cortados pela borda do recorte: não conte e cite em "alertas". Se houver mais de uma unidade no recorte, avise em "alertas".
Catálogo de ids:\n${cat}${fim}
Formato: {"comodos":[{"nome":"Sala","itens":{"tug":4,"luz":2}}],"alertas":["..."],"confianca":"alta|média|baixa"}`;
  if(modo==="lista")return `Você é um orçamentista de instalações elétricas. A imagem é a tabela de LISTA DE MATERIAIS (quantitativo) de um projeto elétrico.
Transcreva TODAS as linhas da tabela, sem pular nenhuma:
- Linha que é um dispositivo equivalente a um ponto do catálogo (tomada, interruptor, luminária / ponto de luz, disjuntor por polos, DR, DPS, quadro): some a quantidade no id do catálogo, em "itens".
- Eletroduto e cabo: metros por bitola em "metragem" (el34 = eletroduto 3/4", el1 = 1", c15 = cabo 1,5mm², c25, c4, c6, c10, c16).
- Caixas 4x2 e octogonais: NÃO lance (o sistema já conta pelo kit de cada ponto), mas escreva o total delas em "alertas" para conferência.
- Todo o resto (curvas, luvas, buchas, conectores, cabos de outras bitolas, itens que não são ponto): em "outros" com desc, qtd e unid.
Catálogo de ids:\n${cat}${fim}
Formato: {"itens":{"tug":10},"metragem":{"el34":0,"el1":0,"c15":0,"c25":0,"c4":0,"c6":0,"c10":0,"c16":0},"outros":[{"desc":"","qtd":0,"unid":"un"}],"alertas":["..."],"confianca":"alta|média|baixa"}`;
  return `Você é um eletricista projetista brasileiro. A imagem é um QUADRO DE CARGAS (ou diagrama unifilar) de um projeto elétrico. Liste cada circuito.${fim}
Formato: {"circuitos":[{"num":"1","desc":"Iluminação","potencia":800,"disjuntor":10,"bitola":1.5,"polos":1}],"alertas":["..."],"confianca":"alta|média|baixa"}`;
}
async function lerComIA(imagens,ctx,dica,onProg,modo="pagina",rotulo=""){
  const s=await window.claude?.use?.("sample");
  if(!s)throw {code:"unavailable",message:"A leitura por IA não está disponível nesta visualização. Use a contagem manual."};
  const lim=await s.limits().catch(()=>null);
  const max=(lim&&lim.images&&lim.images.maxCount)||0;
  if(!max)throw {code:"images_unavailable",message:"Este acesso não permite enviar imagens para a IA. Use a contagem manual."};
  onProg&&onProg("Preparando imagens…");
  const imgs=[];for(const b of imagens.slice(0,max))imgs.push(await caber(b,lim.images.maxInputBytes));
  const cat=ctx.pontos.map(p=>`${p.id} = ${p.nome} (${p.grupo})`).join("\n");
  if(modo!=="pagina"){
    onProg&&onProg("Lendo o recorte com IA… de 20 s a 1 min.");
    return await s.json(promptRecorte(modo,rotulo,cat,ctx.config.regras,dica),{images:imgs,modelTier:"complex"});
  }
  const prompt=`Você é um eletricista projetista brasileiro lendo um PROJETO ELÉTRICO (pranchas em imagem). ${IA_DESENHO}
Se a prancha for densa demais para contar com segurança (ex.: prédio com vários apartamentos), conte o que der e escreva em "alertas" que é melhor recortar um apartamento tipo. Se houver tabela de LISTA DE MATERIAIS, avise em "alertas" que ela pode ser lida por recorte.
Siga este método, na ordem:
1) Carimbo: cliente, endereço, escala, revisão, tensão, área.
2) Legenda: identifique como esta prancha desenha cada símbolo (NBR 5444 ou legenda própria). Use a legenda da prancha como verdade.
3) Quadro de cargas: liste cada circuito (número, descrição, potência W, disjuntor A, bitola mm², polos).
4) Planta baixa: conte, CÔMODO POR CÔMODO, cada ponto usando SOMENTE os ids do catálogo abaixo.
5) Metragem: se houver escala e traçado de eletrodutos, estime metros de eletroduto e cabos por bitola; se não der para medir, deixe 0.
6) Quadro/unifilar: conte disjuntores por polos, DR, DPS. Coloque esses itens num cômodo chamado "Quadro".
7) Conferência: compare a soma da planta com o quadro de cargas e liste divergências e dúvidas em "alertas".

Catálogo de ids (use exatamente estes ids):
${cat}

Regras da casa (o patrão definiu, obedeça):
${ctx.config.regras||"(nenhuma)"}
${dica?"\nObservação de quem enviou: "+dica:""}

Seja conservador: se não tiver certeza de um símbolo, conte na categoria mais provável e escreva a dúvida em "alertas". Não invente cômodos que não aparecem.
Responda SOMENTE com JSON neste formato:
{"carimbo":{"cliente":"","endereco":"","escala":"","revisao":"","tensao":"","area":""},
 "tipo":"residencial|industrial",
 "comodos":[{"nome":"Sala","itens":{"tug":4,"luz":2}}],
 "circuitos":[{"num":"1","desc":"Iluminação social","potencia":800,"disjuntor":10,"bitola":1.5,"polos":1}],
 "metragem":{"el34":0,"el1":0,"c15":0,"c25":0,"c4":0,"c6":0,"c10":0,"c16":0},
 "alertas":["..."],
 "confianca":"alta|média|baixa"}`;
  onProg&&onProg(`Analisando ${imgs.length} página(s) com IA… isso leva de 30 s a 2 min.`);
  const r=await s.json(prompt,{images:imgs,modelTier:"complex"});
  return r;
}

function PedirAcesso(){
  const S=useS();const [env,setEnv]=useState(false);
  const pedido=S.data.access_requests.find(r=>r.id===S.me.id);
  useEffect(()=>{
    if(S.be.status!=="ready")return;
    S.be.db.doc(`access_requests/${S.me.id}`).get().then(s=>{if(s.exists)setEnv(true)}).catch(()=>{});
  },[]);
  const pedir=async()=>{try{await S.be.db.doc(`access_requests/${S.me.id}`).set({id:S.me.id,requestedAt:new Date().toISOString()});setEnv(true)}catch(e){S.toast("Não foi possível enviar o pedido. Peça ao patrão para compartilhar o link com permissão de edição.")}};
  const inativo=S.membro&&S.membro.active===false;
  return html`<div class="gate"><div class="card">
    <${Marca} style=${{padding:0}}/>
    <h2>${inativo?"Acesso pausado":"Peça acesso"}</h2>
    <p class="muted" style=${{margin:0}}>${inativo?"Seu acesso foi pausado. Fale com o patrão para reativar.":"O patrão precisa liberar seu acesso e dizer sua função."}</p>
    ${!inativo&&(env||pedido?html`<div class="alert ok">Pedido enviado. Quando for liberado, esta tela abre sozinha.</div>`:html`<button class="btn pri big" onClick=${pedir}>Pedir acesso</button>`)}
  </div></div>`;
}

PAGES.painel=function Painel({go}){
  const S=useS();const {orcamentos,os,financeiro,materiais,projetos}=S.data;
  const h=new Date().getHours();const saud=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
  const primeiro=(S.nome(S.me.id)||"").split(" ")[0];
  const abertos=orcamentos.filter(o=>["contato","visita","orcamento","negociacao"].includes(o.etapa||"orcamento"));
  const valAberto=abertos.reduce((a,o)=>a+calcOrc(o,S.custoHora).total,0);
  const osAtivas=os.filter(o=>o.etapa!=="concluida");
  const tarefasAb=osAtivas.flatMap(o=>o.tarefas||[]).filter(t=>!t.feito).length;
  const receber=financeiro.filter(f=>f.tipo==="entrada"&&f.status!=="pago").reduce((a,f)=>a+num(f.valor),0);
  const vencidos=financeiro.filter(f=>f.status!=="pago"&&f.venc&&f.venc<hoje());
  const baixo=materiais.filter(m=>num(m.minimo)>0&&num(m.estoque)<num(m.minimo));
  const semConf=projetos.filter(p=>p.status!=="conferido");
  const atencao=[
    semConf.length&&{t:"warn",m:`${semConf.length} projeto(s) esperando a conferência do patrão`,a:["Conferir","projetos"]},
    vencidos.length&&{t:"bad",m:`${vencidos.length} conta(s) vencida(s): ${brl(vencidos.reduce((a,f)=>a+num(f.valor),0))}`,a:["Ver contas","financeiro"]},
    baixo.length&&{t:"warn",m:`${baixo.length} material(is) acabando: ${baixo.slice(0,3).map(m=>m.nome).join(", ")}${baixo.length>3?"…":""}`,a:["Ver estoque","estoque"]}
  ].filter(Boolean);
  const passos=[
    {n:1,t:"Ler o projeto",big:projetos.length,sub:semConf.length?`${semConf.length} para conferir`:"projetos lidos",b:["Enviar prancha",()=>go("projetos","novo")]},
    {n:2,t:"Fazer o orçamento",big:brl(valAberto),sub:`${abertos.length} orçamento(s) em aberto`,b:["Novo orçamento",()=>go("orcamentos","novo")]},
    {n:3,t:"Executar a obra",big:osAtivas.length,sub:`obra(s) andando · ${tarefasAb} tarefa(s) a fazer`,b:["Ver obras",()=>go("os")]},
    {n:4,t:"Receber",big:brl(receber),sub:vencidos.length?`${vencidos.length} conta(s) vencida(s)`:"a receber",b:["Ver dinheiro",()=>go("financeiro")]}
  ];
  return html`
  <div class="phead"><div><h1>${saud}${primeiro?", "+primeiro:""}</h1><p>Todo serviço segue estes 4 passos. Toque no botão do passo que você quer fazer.</p></div></div>
  ${!S.pontos.length&&html`<div class="alert info"><div style=${{flex:1}}><b>Antes de tudo:</b> cadastre seus preços. Sem eles o sistema não calcula orçamento.</div><button class="btn pri sm" onClick=${()=>go("precos")}>Cadastrar preços</button></div>`}
  <div class="flow">${passos.map(p=>html`<div class="fstep" key=${p.n}><div class="top"><span class="n">${p.n}</span><h3>${p.t}</h3></div><div class="big">${p.big}</div><p>${p.sub}</p><button class=${"btn"+(p.n===1||p.n===2?" pri":"")} onClick=${p.b[1]}>${p.b[0]}</button></div>`)}</div>
  ${atencao.length?html`<div class="col"><h2>Precisa de atenção</h2>${atencao.map((a,i)=>html`<div key=${i} class=${"alert "+a.t} style=${{alignItems:"center"}}><div style=${{flex:1}}>${a.m}</div><button class="btn sm" onClick=${()=>go(a.a[1])}>${a.a[0]}</button></div>`)}</div>`:null}
  <div class="col"><div class="row" style=${{justifyContent:"space-between"}}><h2>Obras em andamento</h2>${osAtivas.length?html`<button class="btn sm ghost" onClick=${()=>go("os")}>Ver todas</button>`:null}</div>
    ${osAtivas.length?html`<div class="card col">${osAtivas.slice(0,6).map(o=>{const t=o.tarefas||[];const f=t.filter(x=>x.feito).length;const E=etapaOS(o.etapa);
      return html`<button key=${o.id} class="row" style=${{flexWrap:"nowrap",background:"none",border:0,padding:0,textAlign:"left",cursor:"pointer",width:"100%"}} onClick=${()=>go("os",o.id)}><span class="wire" style=${{background:E.c}}></span><div style=${{flex:1,minWidth:0}}><div class="row" style=${{justifyContent:"space-between"}}><b>${o.cliente}</b><span class="small muted">${E.t}</span></div><div class="bar" style=${{margin:"6px 0 3px"}}><i style=${{width:(t.length?f/t.length*100:0)+"%"}}></i></div><div class="small muted">${f} de ${t.length} tarefas feitas</div></div></button>`})}</div>`
    :html`<div class="card muted">Nenhuma obra andando. A obra aparece aqui quando o cliente aprova um orçamento.</div>`}
  </div>`;
};

PAGES.tarefas=function Tarefas({go}){
  const S=useS();
  const [todas,setTodas]=useState(false);
  const lista=[];
  for(const o of S.data.os.filter(o=>o.etapa!=="concluida"))for(const t of (o.tarefas||[]))if(todas||t.resp===S.me.id)lista.push({o,t});
  const pend=lista.filter(x=>!x.t.feito);const feitas=lista.filter(x=>x.t.feito);
  const marcar=(o,t)=>{
    const tarefas=o.tarefas.map(x=>x.id===t.id?{...x,feito:!x.feito,feitoPor:S.me.id,feitoEm:new Date().toISOString()}:x);
    S.api.update("os",o.id,{tarefas},t.feito?"Tarefa reaberta.":"Tarefa concluída.");
  };
  const Row=({o,t})=>{const E=etapaOS(t.etapa);return html`<div class=${"task"+(t.feito?" done":"")} key=${t.id}>
    <input type="checkbox" id=${"tk"+t.id} checked=${!!t.feito} onChange=${()=>marcar(o,t)}/>
    <span class="wire" style=${{background:E.c}}></span>
    <label for=${"tk"+t.id} style=${{flex:1,minWidth:0,cursor:"pointer"}}><div class="t">${t.desc}</div>
      <div class="small muted">${o.numero} · ${o.cliente}${o.endereco?" · "+o.endereco:""} · ${E.t}${t.horas?` · ~${n2(t.horas)} h`:""}${todas?` · ${t.resp?S.nome(t.resp):"sem responsável"}`:""}</div></label>
    <button class="btn sm" onClick=${()=>go("os",o.id)}>Abrir OS</button></div>`};
  return html`<div class="phead"><div><h1>Minhas tarefas</h1><p>Marque quando terminar. O patrão vê na hora.</p></div>
    ${S.admin&&html`<label class="chk"><input type="checkbox" checked=${todas} onChange=${e=>setTodas(e.target.checked)}/> Ver tarefas de toda a equipe</label>`}</div>
  <div class="card">${pend.length?pend.map(x=>html`<${Row} key=${x.t.id} ...${x}/>`):html`<${Empty} title="Nada pendente" text=${todas?"Nenhuma tarefa aberta nas obras.":"Nenhuma tarefa atribuída a você agora. Quando o patrão distribuir o serviço de uma OS, ela aparece aqui."}/>`}</div>
  ${feitas.length?html`<details class="card"><summary style=${{cursor:"pointer"}}><b>Concluídas (${feitas.length})</b></summary>${feitas.map(x=>html`<${Row} key=${x.t.id} ...${x}/>`)}</details>`:null}`;
};

  const S=useS();
  const [aberto,setAberto]=useState(arg==="novo"?"novo":(arg||null));
  const [del,setDel]=useState(null);
  useEffect(()=>{if(arg)setAberto(arg)},[arg]);

  ${lista.length?html`<div class="tbl-wrap"><table><thead><tr><th>Projeto</th><th>Cliente</th><th>Tipo</th><th class="r">Pontos</th><th>Situação</th><th></th></tr></thead><tbody>
    ${lista.map(p=>{const t=totaisProjeto(p);const tot=Object.values(t).reduce((a,b)=>a+b,0);const pass=PASSOS.filter(x=>(p.passos||{})[x.id]).length;
      return html`<tr key=${p.id}><td><b>${p.nome||"Sem nome"}</b><div class="small muted">${dataBR((p.criadoEm||"").slice(0,10))}${p.arquivo?" · "+p.arquivo:""}</div></td><td>${p.cliente||"—"}</td><td>${p.tipo==="industrial"?"Industrial":"Residencial / predial"}</td><td class="r num">${tot}</td>
      <td>${p.status==="conferido"?html`<span class="pill ok">Conferido</span>`:html`<span class="pill warn">${pass}/7 passos</span>`}</td>
      <td class="r"><div class="row" style=${{justifyContent:"flex-end",flexWrap:"nowrap"}}><button class="btn sm" onClick=${()=>setAberto(p.id)}>Abrir</button>${S.admin&&html`<button class="btn sm ghost danger" onClick=${()=>setDel(p)}>Excluir</button>`}</div></td></tr>`})}
  </tbody></table></div>`:html`<${Empty} title="Nenhum projeto lido ainda" text="Comece enviando o PDF de um projeto elétrico. Sem PDF, dá para criar o projeto e contar os pontos à mão, cômodo por cômodo."><button class="btn pri" onClick=${()=>setAberto("novo")}>Ler o primeiro projeto</button><//>`}
  ${aberto&&html`<${EditorProjeto} id=${aberto} onClose=${()=>setAberto(null)} go=${go}/>`}
  ${del&&html`<${Confirm} text=${`Excluir o projeto "${del.nome}"? Orçamentos já gerados continuam salvos.`} onNo=${()=>setDel(null)} onYes=${()=>{S.api.del("projetos",del.id,"Projeto excluído.");setDel(null)}}/>`}`;
};

function EditorProjeto({id,onClose,go}){
  const S=useS();
  const salvo=id!=="novo"&&S.data.projetos.find(p=>p.id===id);
  const [pj,setPj]=useState(()=>salvo?JSON.parse(JSON.stringify(salvo)):{id:uid(),nome:"",cliente:"",tipo:"residencial",carimbo:{},comodos:[],circuitos:[],metragem:{},passos:{},alertas:[],status:"rascunho",criadoEm:new Date().toISOString()});
  const [paginas,setPaginas]=useState([]);
  const [sel,setSel]=useState([]);
  const [ver,setVer]=useState(null);
  const [zoom,setZoom]=useState(1);
  const [prog,setProg]=useState("");
  const [erro,setErro]=useState("");
  const [dica,setDica]=useState("");
  const [tab,setTab]=useState("planta");
  const [dirty,setDirty]=useState(id==="novo");
  const [conferir,setConferir]=useState(false);
  const fileRef=useRef(null);
  const rev=useRef(0);const pjRef=useRef(pj);pjRef.current=pj;
  const [salvoEm,setSalvoEm]=useState(salvo&&salvo.atualizadoEm||null);const [salvando,setSalvando]=useState(false);
  const set=p=>{setPj(x=>({...x,...p}));setDirty(true);rev.current++};
  const passo=(k,v)=>set({passos:{...pj.passos,[k]:v}});

  // abrir prancha salva
  useEffect(()=>{
    if(!salvo||!salvo.assetId||paginas.length)return;
    (async()=>{try{setProg("Abrindo a prancha salva…");const r=await fetch("/_blob/"+salvo.assetId);if(!r.ok)throw 0;const b=await r.blob();const f=new File([b],salvo.arquivo||"projeto.pdf",{type:b.type||"application/pdf"});const ps=await arquivoParaPaginas(f,setProg);setPaginas(ps);setSel(ps.map(p=>p.n));setVer(ps[0]||null)}catch{}finally{setProg("")}})();
  },[]);

  const onFile=async e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;setErro("");
    try{
      const ps=await arquivoParaPaginas(f,setProg);setPaginas(ps);setSel(ps.slice(0,6).map(p=>p.n));setVer(ps[0]);
      set({arquivo:f.name,nome:pj.nome||f.name.replace(/\.[^.]+$/,"")});
      const as=await window.claude?.use?.("assets");
      if(as&&f.size<20e6){setProg("Guardando a prancha para a equipe consultar…");try{const r=await as.upload(f);set({assetId:r.id,arquivo:f.name})}catch(err){console.warn(err)}}
    }catch(err){setErro(err.message||"Não foi possível abrir o arquivo.")}finally{setProg("")}
  };

  const rodarIA=async(rc)=>{
    setErro("");
    const modo=rc?rc.modo:"pagina";
    const imgs=rc?[rc.blob]:paginas.filter(p=>sel.includes(p.n)).map(p=>p.blob);
    if(!imgs.length){setErro("Selecione ao menos uma página.");return}
    try{
      const r=await lerComIA(imgs,S,dica,setProg,modo,rc&&rc.rotulo);
      const ids=new Set(S.pontos.map(p=>p.id));
      const filtra=o=>Object.fromEntries(Object.entries(o||{}).filter(([k,v])=>ids.has(k)&&num(v)>0).map(([k,v])=>[k,num(v)]));
      const mapC=l=>(l||[]).map(c=>({id:uid(),nome:String(c.nome||"Cômodo"),rep:1,itens:filtra(c.itens)}));
      let novo;
      if(modo==="pagina"){
        novo={...pj,comodos:mapC(r.comodos),circuitos:(r.circuitos||[]).map(c=>({id:uid(),...c})),metragem:r.metragem||{},alertas:r.alertas||[],confianca:r.confianca||"",carimbo:{...pj.carimbo,...(r.carimbo||{})},tipo:r.tipo==="industrial"?"industrial":pj.tipo};
        if(!novo.cliente&&r.carimbo&&r.carimbo.cliente)novo.cliente=r.carimbo.cliente;
      }else{
        novo={...pj,alertas:[...(pj.alertas||[]),...(r.alertas||[]).map(a=>`[${rc.rotulo||"recorte"}] ${a}`)],confianca:r.confianca||pj.confianca};
        if(modo==="unidade")novo.comodos=[...(pj.comodos||[]),...mapC(r.comodos).map(c=>({...c,nome:(rc.rotulo?rc.rotulo+" · ":"")+c.nome,rep:repDe(rc)}))];
        if(modo==="lista"){
          novo.comodos=[...(pj.comodos||[]),{id:uid(),nome:"Lista de materiais do projeto",rep:1,itens:filtra(r.itens)}];
          const m={...(pj.metragem||{})};for(const [k,v] of Object.entries(r.metragem||{}))if(num(v)>0)m[k]=num(m[k])+num(v);novo.metragem=m;
          novo.outros=[...(pj.outros||[]),...(r.outros||[]).filter(o=>o&&o.desc).map(o=>({id:uid(),desc:String(o.desc),qtd:num(o.qtd),unid:String(o.unid||"un")}))];
        }
        if(modo==="quadro")novo.circuitos=[...(pj.circuitos||[]),...(r.circuitos||[]).map(c=>({id:uid(),...c}))];
      }
      novo.lidoPorIA=true;novo.iaOriginal=totaisProjeto(novo);
      setPj(novo);setDirty(true);rev.current++;setTab(modo==="quadro"?"cargas":modo==="lista"?"metragem":"planta");S.toast(rc?"Recorte lido e somado ao projeto. Confira.":"Leitura feita. Agora confira passo a passo.");
    }catch(e){setErro((e&&e.message)||"A IA não conseguiu ler. Tente um recorte menor ou faça a contagem manual.")}finally{setProg("")}
  };
  const [recortes,setRecortes]=useState([]);
  const [cortando,setCortando]=useState(false);
  const [drag,setDrag]=useState(null);

      await salvar({status:"conferido",conferidoEm:new Date().toISOString(),conferidoPor:S.me.id},"Projeto conferido. Já pode gerar o orçamento.");setConferir(false);irPara(4)}}/>`}
  <//>`;
}
function PassoChk({pj,ids,passo}){return html`<div class="row" style=${{borderTop:"1px solid var(--line)",paddingTop:10}}>${ids.map(k=>{const p=PASSOS.find(x=>x.id===k);return html`<label class="chk" key=${k}><input type="checkbox" checked=${!!pj.passos[k]} onChange=${e=>passo(k,e.target.checked)}/> Conferi: ${p.t}</label>`})}<span class="small muted" style=${{flexBasis:"100%"}}>${ids.map(k=>PASSOS.find(x=>x.id===k).d).join(" ")}</span></div>`}
function Comodo({c,pontos,onChange,onDel}){

    <span class="small muted num">${n} itens${r>1?` · ${n*r} na obra`:""}</span><button class="btn sm ghost danger" onClick=${onDel}>Remover</button></div>
    <div class="comodo-b">
      ${it.map(([k,q])=>html`<div class="it" key=${k}><span class="nm">${(P(k)||{nome:k+" (não cadastrado)"}).nome}</span><${Num} value=${q} onChange=${v=>{const n={...c.itens};if(v>0)n[k]=v;else delete n[k];onChange({...c,itens:n})}}/></div>`)}
      <div class="it"><select class="i" style=${{flex:1,minWidth:180}} value=${add} onChange=${e=>{const k=e.target.value;if(!k)return;onChange({...c,itens:{...c.itens,[k]:(num(c.itens[k])||0)+1}});setAdd("")}} aria-label="Adicionar ponto">
        <option value="">+ adicionar ponto…</option>${grupos.map(g=>html`<optgroup key=${g} label=${g}>${pontos.filter(p=>p.grupo===g).map(p=>html`<option key=${p.id} value=${p.id}>${p.nome}</option>`)}</optgroup>`)}</select></div>
    </div></div>`;

function ConferirModal({pj,tot,nomeP,onClose,onOk}){

      :html`<div class="alert ok">A contagem final é igual à leitura da IA.</div>`):html`<p style=${{margin:0}}>Projeto contado à mão. Se quiser, registre uma regra que você usou para ensinar a equipe.</p><${F} label="Regra da casa (opcional)"><textarea class="i" id="regra" value=${regra} onChange=${e=>setRegra(e.target.value)}></textarea><//>`}
    <div class="row" style=${{justifyContent:"flex-end"}}><button class="btn" onClick=${onClose}>Voltar</button><button class="btn pri" onClick=${()=>onOk(regra)}>Confirmar conferência</button></div>

  </tbody></table></div>`:html`<${Empty} title="Nenhum orçamento ainda" text="O caminho mais rápido é ler o projeto: a contagem de pontos vira o orçamento sozinha. Para serviço pequeno, crie um avulso e adicione os pontos."><div class="row"><button class="btn" onClick=${()=>go("projetos")}>Ler projeto</button><button class="btn pri" onClick=${()=>setAberto("novo")}>Orçamento avulso</button></div><//>`}

function EditorOrc({id,onClose,go}){
  const S=useS();
  const salvo=id!=="novo"&&S.data.orcamentos.find(o=>o.id===id);
  const [o,setO]=useState(()=>salvo?JSON.parse(JSON.stringify(salvo)):{id:uid(),numero:proxNumero(S.data.orcamentos,"ORC-"),cliente:"",telefone:"",endereco:"",tipo:"residencial",linhas:[],deslocamento:S.config.deslocamentoPadrao,desconto:0,impostoPct:S.config.impostoPct,clienteMaterial:false,etapa:"orcamento",probabilidade:50,criadoEm:new Date().toISOString(),condicoes:"50% de entrada e 50% na entrega.",prazo:""});
  const [dirty,setDirty]=useState(id==="novo");
  const [add,setAdd]=useState("");
  const [msg,setMsg]=useState(false);
  const rev=useRef(0);const oRef=useRef(o);oRef.current=o;
  const [salvoEm,setSalvoEm]=useState(salvo&&salvo.atualizadoEm||null);const [salvando,setSalvando]=useState(false);
  const set=p=>{setO(x=>({...x,...p}));setDirty(true);rev.current++};
  const c=calcOrc(o,S.custoHora);
  const saude=saudeOrc(o,c,S.config,S.custoHora);
  const upL=(lid,p)=>set({linhas:o.linhas.map(l=>l.id===lid?{...l,...p}:l)});
  const addPonto=k=>{
    const ind=o.tipo==="industrial";
    if(k.startsWith("m:")){const m=S.mats.find(x=>x.id===k.slice(2));if(!m)return;set({linhas:[...o.linhas,{id:uid(),matId:m.id,desc:m.nome,unid:m.unid,qtd:1,mo:0,custoMat:num(m.custo),mat:Math.round(num(m.custo)*(1+num(S.config.markupMatPct)/100)*100)/100,horas:0}]});return}
    if(k==="livre"){set({linhas:[...o.linhas,{id:uid(),desc:"Serviço",unid:"un",qtd:1,mo:0,custoMat:0,mat:0,horas:1}]});return}
    const p=S.pontos.find(x=>x.id===k);if(!p)return;const ck=custoKit(p,S.mats);
    set({linhas:[...o.linhas,{id:uid(),tipoId:p.id,desc:p.nome,unid:p.unid,qtd:1,mo:Math.round(num(p.mo)*(ind?num(S.config.fatorIndustrial):1)*100)/100,custoMat:ck,mat:Math.round(ck*(1+num(S.config.markupMatPct)/100)*100)/100,horas:num(p.horas)}]});
  };
  const salvar=async(extra={},m="Orçamento salvo.")=>{const r0=rev.current;const em=new Date().toISOString();const x={...oRef.current,...extra,atualizadoEm:em};setO(y=>({...y,...extra,atualizadoEm:em}));setSalvando(true);const ok=await S.api.set("orcamentos",x.id,x,m);setSalvando(false);if(ok){if(rev.current===r0)setDirty(false);setSalvoEm(em)}return ok};
  const temConteudo=!!(o.cliente||(o.linhas||[]).length);
  useEffect(()=>{if(!dirty||!temConteudo)return;const t=setTimeout(()=>salvar({},null),1500);return()=>clearTimeout(t)},[o,dirty]);
  const sair=async()=>{if(dirty&&temConteudo)await salvar({},"Orçamento salvo.");onClose()};
  const cli=S.data.clientes.find(x=>x.nome===o.cliente);
  const fechar=async()=>{
    const pj=S.data.projetos.find(p=>p.id===o.projetoId);
    const tarefas=pj?gerarTarefas(pj,S.pontos):[{id:uid(),etapa:"infra",comodo:"Geral",desc:"Executar serviço conforme orçamento "+o.numero,horas:c.horas,resp:"",feito:false},{id:uid(),etapa:"testes",comodo:"Geral",desc:"Testar e entregar ao cliente",horas:.5,resp:"",feito:false}];
    const materiais=[];
    if(!o.clienteMaterial){
      const acc={};
      for(const l of o.linhas){
        if(l.matId){acc[l.matId]=(acc[l.matId]||0)+num(l.qtd);continue}
        const p=S.pontos.find(x=>x.id===l.tipoId);if(!p)continue;
        for(const [mid,q] of (p.kit||[]))acc[mid]=(acc[mid]||0)+num(q)*num(l.qtd);
      }
      for(const [mid,q] of Object.entries(acc))materiais.push({matId:mid,qtd:Math.ceil(q),baixado:false});
    }
    const os={id:uid(),numero:proxNumero(S.data.os,"OS-"),orcamentoId:o.id,projetoId:o.projetoId||"",cliente:o.cliente,endereco:o.endereco,telefone:o.telefone,etapa:materiais.length?"material":"infra",tarefas,materiais,inicio:hoje(),prazo:o.prazo||"",criadoEm:new Date().toISOString(),valor:c.total};
    const nid=await S.api.add("os",os,null);
    if(!nid)return;
    await salvar({etapa:"aprovado",aprovadoEm:new Date().toISOString(),osId:nid},null);
    const ent=Math.round(c.total*.5*100)/100;
    await S.api.add("financeiro",{tipo:"entrada",desc:`Entrada ${o.numero} · ${o.cliente}`,valor:ent,venc:hoje(),status:"pendente",categoria:"Obra",ref:o.id,criadoEm:new Date().toISOString()},null);
    await S.api.add("financeiro",{tipo:"entrada",desc:`Saldo na entrega ${o.numero} · ${o.cliente}`,valor:Math.round((c.total-ent)*100)/100,venc:o.prazo||"",status:"pendente",categoria:"Obra",ref:o.id,criadoEm:new Date().toISOString()},null);
    S.toast(`Fechado! ${os.numero} criada com ${tarefas.length} tarefas e 2 parcelas lançadas no financeiro.`);
    onClose();go("os",nid);
  };
  const hora=salvoEm?new Date(salvoEm).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
  const footer=html`<${StatusSalvo} salvando=${salvando} dirty=${dirty} ok=${temConteudo} hora=${hora} vazio="Escreva o cliente ou adicione um item para começar a salvar"/>
    <div class="row"><span class="small muted">Total</span><b style=${{fontSize:18}}>${brl(c.total)}</b><button class="btn pri" onClick=${sair}>Salvar e fechar</button></div>`;
  return html`<${Modal} title=${"Orçamento "+o.numero} onClose=${sair} footer=${footer}>
    <div class="grid g4">
      <${F} label="Cliente"><${Inp} id="o-cli" value=${o.cliente} list="lst-cli2" onChange=${v=>{const k=S.data.clientes.find(x=>x.nome===v);set(k?{cliente:v,telefone:o.telefone||k.telefone||"",endereco:o.endereco||k.endereco||""}:{cliente:v})}}/><//>
      <${F} label="Telefone / WhatsApp"><${Inp} id="o-tel" value=${o.telefone} onChange=${v=>set({telefone:v})}/><//>
      <${F} label="Endereço da obra" style=${{gridColumn:"span 2"}}><${Inp} id="o-end" value=${o.endereco} onChange=${v=>set({endereco:v})}/><//>
      <${F} label="Tipo de obra"><${Sel} id="o-tipo" value=${o.tipo} onChange=${v=>set({tipo:v})} opts=${[["residencial","Residencial / predial"],["industrial","Industrial"]]}/><//>
      <${F} label="Etapa no funil"><${Sel} id="o-et" value=${o.etapa} onChange=${v=>set({etapa:v})} opts=${PIPE.map(p=>[p.id,p.t])}/><//>
      <${F} label="Prazo de entrega"><${Inp} id="o-prazo" type="date" value=${o.prazo} onChange=${v=>set({prazo:v})}/><//>
      <${F} label="Chance de fechar (%)"><${Inp} id="o-prob" type="number" value=${o.probabilidade} onChange=${v=>set({probabilidade:v})}/><//>
    </div>
    <datalist id="lst-cli2">${S.data.clientes.map(c=>html`<option value=${c.nome}/>`)}</datalist>
    ${!cli&&o.cliente&&html`<div class="small"><button class="btn sm" onClick=${()=>S.api.add("clientes",{nome:o.cliente,telefone:o.telefone,endereco:o.endereco,criadoEm:new Date().toISOString()},"Cliente cadastrado.")}>Cadastrar "${o.cliente}" como cliente</button></div>`}

    <div class="tbl-wrap"><table><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Mão de obra (un)</th><th class="r">Material (un)</th><th class="r">Horas (un)</th><th class="r">Total</th><th></th></tr></thead><tbody>
      ${o.linhas.map(l=>html`<tr key=${l.id}><td style=${{minWidth:200}}><input class="i" value=${l.desc} onChange=${e=>upL(l.id,{desc:e.target.value})} aria-label="Descrição"/></td>
        <td class="r" style=${{width:130}}><${Num} value=${l.qtd} onChange=${v=>upL(l.id,{qtd:v})}/></td>
        <td class="r" style=${{width:110}}><${Inp} type="number" value=${l.mo} onChange=${v=>upL(l.id,{mo:v})} aria-label="Mão de obra"/></td>
        <td class="r" style=${{width:110}}><${Inp} type="number" value=${l.mat} onChange=${v=>upL(l.id,{mat:v})} aria-label="Material"/></td>
        <td class="r" style=${{width:90}}><${Inp} type="number" value=${l.horas} onChange=${v=>upL(l.id,{horas:v})} aria-label="Horas"/></td>
        <td class="r num">${brl(num(l.qtd)*(num(l.mo)+(o.clienteMaterial?0:num(l.mat))))}</td>
        <td><button class="btn sm ghost danger" aria-label="Remover" onClick=${()=>set({linhas:o.linhas.filter(x=>x.id!==l.id)})}>✕</button></td></tr>`)}
      ${!o.linhas.length&&html`<tr><td colspan="7" class="muted">Sem itens. Adicione pontos abaixo ou gere a partir de um projeto lido.</td></tr>`}
    </tbody></table></div>
    <div class="row"><select class="i" style=${{maxWidth:360}} value=${add} onChange=${e=>{addPonto(e.target.value);setAdd("")}} aria-label="Adicionar item">
      <option value="">+ adicionar ponto, material ou serviço…</option>
      ${[...new Set(S.pontos.map(p=>p.grupo))].map(g=>html`<optgroup key=${g} label=${"Pontos · "+g}>${S.pontos.filter(p=>p.grupo===g).map(p=>html`<option key=${p.id} value=${p.id}>${p.nome} · ${brl(p.mo)}</option>`)}</optgroup>`)}
      <optgroup label="Material avulso">${S.mats.map(m=>html`<option key=${m.id} value=${"m:"+m.id}>${m.nome}</option>`)}</optgroup>
      <option value="livre">Serviço livre (digitar)</option></select>
      <label class="chk"><input type="checkbox" checked=${!!o.clienteMaterial} onChange=${e=>set({clienteMaterial:e.target.checked})}/> Cliente compra o material (cobrar só mão de obra)</label></div>

          <${F} label="Desconto (R$)"><${Inp} id="o-desc" type="number" value=${o.desconto} onChange=${v=>set({desconto:v})}/><//>

    </div>
    ${msg&&html`<${MsgWhats} o=${o} c=${c} onClose=${()=>setMsg(false)}/>`}
  <//>`;
}
function textoProposta(o,c,S){
  return `Olá${o.cliente?", "+o.cliente.split(" ")[0]:""}! Segue a proposta ${o.numero} da ${S.config.empresa}.

${o.linhas.map(l=>`• ${n2(l.qtd)} ${l.unid||""} ${l.desc}`).join("\n")}

Mão de obra: ${brl(c.mo)}
Material: ${o.clienteMaterial?"por conta do cliente":brl(c.mat)}
${c.desloc?`Deslocamento: ${brl(c.desloc)}\n`:""}${c.desc?`Desconto: −${brl(c.desc)}\n`:""}*Total: ${brl(c.total)}*

Pagamento: ${o.condicoes||"a combinar"}
${o.prazo?`Entrega prevista: ${dataBR(o.prazo)}\n`:""}Validade: ${num(S.config.validadeDias)||10} dias.
Serviço executado conforme NBR 5410. Qualquer dúvida, é só responder.`;
}
function MsgWhats({o,c,onClose}){
  const S=useS();const t=textoProposta(o,c,S);const ref=useRef(null);
  const tel=String(o.telefone||"").replace(/\D/g,"");const fone=tel?(tel.length<=11?"55"+tel:tel):"";
  const copiar=async()=>{try{await navigator.clipboard.writeText(t);S.toast("Texto copiado. Cole no WhatsApp do cliente.")}catch{ref.current.select();S.toast("Selecionei o texto: use Ctrl+C / copiar.")}};
  return html`<${Modal} title="Mensagem para o cliente" onClose=${onClose}>
    <textarea ref=${ref} class="i" style=${{minHeight:300,fontFamily:"var(--f-mono)",fontSize:12.5}} readonly value=${t}></textarea>
    <div class="row" style=${{justifyContent:"flex-end"}}><button class="btn" onClick=${copiar}>Copiar texto</button>
      ${fone&&html`<a class="btn pri" href=${`https://api.whatsapp.com/send?phone=${fone}&text=${encodeURIComponent(t)}`} target="_blank" rel="noopener">Abrir WhatsApp de ${o.telefone}</a>`}</div><//>`;
}
async function logoParaPdf(S){
  try{
    const proprio=!!S.config.logoAssetId;
    const src=proprio?URL.createObjectURL(await (await fetch("/_blob/"+S.config.logoAssetId)).blob()):SHIELD_URL;
    const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=src});
    const h=360,w=Math.round(h*(img.naturalWidth||100)/(img.naturalHeight||130));
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);

}

PAGES.pipeline=function Pipeline({go}){
  const S=useS();
  const mover=(o,d)=>{const i=PIPE.findIndex(p=>p.id===(o.etapa||"orcamento"));const j=Math.min(PIPE.length-1,Math.max(0,i+d));if(PIPE[j].id==="aprovado"){go("orcamentos",o.id);S.toast("Para fechar, use o botão 'Cliente aprovou' no orçamento: ele já gera a OS.");return}S.api.update("orcamentos",o.id,{etapa:PIPE[j].id})};
  const tot=PIPE.slice(0,4).reduce((a,p)=>a+S.data.orcamentos.filter(o=>(o.etapa||"orcamento")===p.id).reduce((x,o)=>x+calcOrc(o,S.custoHora).total*num(o.probabilidade)/100,0),0);
  return html`<div class="phead"><div><h1>Funil de vendas</h1><p>Previsão de fechamento: <b class="num">${brl(tot)}</b></p></div><button class="btn pri" onClick=${()=>go("orcamentos","novo")}>Novo orçamento</button></div>
  <div class="kanban">${PIPE.map(p=>{const it=S.data.orcamentos.filter(o=>(o.etapa||"orcamento")===p.id);
    return html`<div class="kcol" key=${p.id}><h3>${p.t}<span class="pill">${it.length}</span></h3><div class="small muted num">${brl(it.reduce((a,o)=>a+calcOrc(o,S.custoHora).total,0))}</div>
      ${it.map(o=>html`<div class="kcard" key=${o.id} style=${{flexDirection:"column",cursor:"default"}}><button class="btn ghost" style=${{padding:0,justifyContent:"flex-start",textAlign:"left",whiteSpace:"normal"}} onClick=${()=>go("orcamentos",o.id)}><b>${o.cliente||"Sem nome"}</b></button><div class="small muted"><span class="mono">${o.numero}</span> · ${brl(calcOrc(o,S.custoHora).total)} · ${n2(o.probabilidade)}%</div>
        <div class="row" style=${{justifyContent:"space-between"}}><button class="btn sm" disabled=${p.id==="contato"} onClick=${()=>mover(o,-1)} aria-label="Voltar etapa">←</button><button class="btn sm" disabled=${p.id==="perdido"||p.id==="aprovado"} onClick=${()=>mover(o,1)} aria-label="Avançar etapa">→</button></div></div>`)}
    </div>`})}</div>`;
};

              <div style=${{flex:1,minWidth:0}}><div class="t">${k.desc}</div><div class="row small muted" style=${{marginTop:4}}>${k.horas?html`<span>~${n2(k.horas)} h</span>`:null}

              ${k.feito&&k.feitoPor?html`<span>feito por ${S.nome(k.feitoPor)}</span>`:null}</div></div>
              ${podeCampo&&html`<button class="btn sm ghost" onClick=${()=>setEdTarefa({id:k.id,desc:k.desc,etapa:k.etapa,horas:num(k.horas)})}>Editar</button>`}</div>`)}
          ${addEm===e.id&&html`<div class="row" style=${{padding:"8px 0"}}><input class="i" style=${{flex:1,minWidth:180}} value=${novaT.desc} onChange=${ev=>setNovaT({...novaT,desc:ev.target.value})} placeholder=${"Nova tarefa de "+e.t.toLowerCase()} aria-label="Nova tarefa"/>

        </div>

        ${podeEditar&&html`<div class="card col">
          <${Hd} t="Serviços extras">${pendX.length?html`<button class="btn sm pri" onClick=${cobrar}>Cobrar ${brl(pendX.reduce((a,x)=>a+num(x.qtd)*num(x.valor),0))}</button>`:null}<//>
          <p class="small muted" style=${{margin:0}}>O cliente pediu algo a mais na obra? Lance aqui para não trabalhar de graça.</p>
          ${extras.map(x=>edX&&edX.id===x.id?html`<div key=${x.id} class="row"><input class="i" style=${{flex:1,minWidth:160}} value=${edX.desc} onChange=${e=>setEdX({...edX,desc:e.target.value})} aria-label="Descrição"/><${Num} value=${edX.qtd} onChange=${v=>setEdX({...edX,qtd:v})}/><input class="i" style=${{width:110}} type="number" value=${edX.valor} onChange=${e=>setEdX({...edX,valor:num(e.target.value)})} aria-label="Valor unitário"/>
              <button class="btn" onClick=${()=>setEdX(null)}>Cancelar</button><button class="btn pri" onClick=${()=>{save({extras:extras.map(y=>y.id===x.id?{...y,...edX}:y)},"Extra salvo.");setEdX(null)}}>Salvar</button></div>`
            :html`<div key=${x.id} class="row" style=${{justifyContent:"space-between",borderBottom:"1px solid var(--line)",paddingBottom:8}}><div style=${{flex:1,minWidth:0}}><b>${x.desc}</b><div class="small muted">${n2(x.qtd)} × ${brl(x.valor)} = ${brl(num(x.qtd)*num(x.valor))}</div></div>
              ${x.lancado?html`<span class="pill ok">Cobrado</span>`:html`<button class="btn sm" onClick=${()=>setEdX({...x})}>Editar</button><button class="btn sm ghost danger" aria-label="Remover extra" onClick=${()=>save({extras:extras.filter(y=>y.id!==x.id)},"Extra removido.")}>✕</button>`}</div>`)}
          ${extras.length?html`<div class="small" style=${{textAlign:"right"}}>Total de extras: <b>${brl(totX)}</b></div>`:null}
          <div class="col" style=${{gap:8,borderTop:extras.length?"0":"1px solid var(--line)",paddingTop:extras.length?0:10}}>
            <div class="row"><input class="i" style=${{flex:1,minWidth:160}} value=${novoX.desc} onChange=${e=>setNovoX({...novoX,desc:e.target.value})} placeholder="Ex.: 2 tomadas a mais na cozinha" aria-label="Novo serviço extra"/>
              <${Num} value=${novoX.qtd} onChange=${v=>setNovoX({...novoX,qtd:v})}/><input class="i" style=${{width:110}} type="number" placeholder="R$ unit." value=${novoX.valor||""} onChange=${e=>setNovoX({...novoX,valor:num(e.target.value)})} aria-label="Valor unitário"/></div>
            <div class="row" style=${{justifyContent:"space-between"}}><label class="chk"><input type="checkbox" checked=${novoX.tarefa} onChange=${e=>setNovoX({...novoX,tarefa:e.target.checked})}/> Criar tarefa para a equipe</label>
              <button class="btn pri" disabled=${!novoX.desc} onClick=${()=>{const p={extras:[...extras,{id:uid(),desc:novoX.desc,qtd:novoX.qtd,valor:novoX.valor,lancado:false,em:new Date().toISOString()}]};
                if(novoX.tarefa)p.tarefas=[...tarefas,{id:uid(),etapa:["material","concluida"].includes(o.etapa)?"infra":o.etapa,comodo:"",desc:"Extra: "+novoX.desc,horas:0,resp:"",feito:false}];
                save(p,"Serviço extra adicionado.");setNovoX({desc:"",qtd:1,valor:0,tarefa:true})}}>Adicionar extra</button></div></div>
        </div>`}

        <div class="card col">
          <${Hd} t="Anotações da obra"><//>

              ${(n.por===S.me.id||S.admin)&&html`<div class="row"><button class="btn sm ghost" onClick=${()=>setEdNota({id:n.id,texto:n.texto})}>Editar</button><button class="btn sm ghost danger" aria-label="Apagar anotação" onClick=${()=>save({notas:notas.filter(x=>x.id!==n.id)},"Anotação apagada.")}>✕</button></div>`}</div></div>`)}

        ${pj&&html`<div class="card col"><h3>Do projeto: ${pj.nome}</h3><div class="small muted">${(pj.circuitos||[]).length} circuitos · tensão ${(pj.carimbo||{}).tensao||"—"}</div>

  <//>`;
}
function VerPrancha({pj,onClose}){
  const [pgs,setPgs]=useState([]);const [err,setErr]=useState("");const [z,setZ]=useState(1);
  useEffect(()=>{(async()=>{try{const r=await fetch("/_blob/"+pj.assetId);if(!r.ok)throw 0;const b=await r.blob();setPgs(await arquivoParaPaginas(new File([b],pj.arquivo||"p.pdf",{type:b.type||"application/pdf"})))}catch{setErr("Não foi possível abrir a prancha.")}})()},[]);
  return html`<${Modal} title=${"Prancha · "+pj.nome} onClose=${onClose} actions=${html`<button class="btn sm" onClick=${()=>setZ(x=>Math.max(.25,x-.25))}>Zoom −</button><button class="btn sm" onClick=${()=>setZ(x=>Math.min(3,x+.25))}>Zoom +</button>`}>
    ${err?html`<div class="alert bad">${err}</div>`:!pgs.length?html`<div class="alert info"><span class="spin"></span> Abrindo…</div>`:pgs.map(p=>html`<div class="viewer" key=${p.n}><img src=${p.url} style=${{width:z*100+"%"}} alt=${"Página "+p.n}/></div>`)}<//>`;
}

/* ============================== ALMOXARIFADO ============================== */
PAGES.estoque=function Estoque(){
  const S=useS();const [busca,setBusca]=useState("");const [mov,setMov]=useState(null);const [novo,setNovo]=useState(null);const [tab,setTab]=useState("itens");
  const lista=S.data.materiais.filter(m=>(m.nome||"").toLowerCase().includes(busca.toLowerCase())).sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));

  const pode=S.admin||S.papel==="escritorio"||S.papel==="eletricista";
  return html`<div class="phead"><div><h1>Estoque</h1><p>O que tem guardado e o que precisa comprar.</p></div>${S.admin&&html`<button class="btn pri" onClick=${()=>setNovo({nome:"",unid:"un",custo:0,estoque:0,minimo:0})}>Novo material</button>`}</div>
  <${Tabs} value=${tab} onChange=${setTab} tabs=${[["itens","Itens"],["comprar",`Comprar (${comprar.length+Object.keys(reservado).filter(k=>{const m=S.mats.find(x=>x.id===k);return m&&num(m.estoque)<reservado[k]}).length})`],["mov","Movimentações"]]}/>
  ${tab==="itens"&&html`<input class="i" style=${{maxWidth:320}} placeholder="Buscar material" value=${busca} onChange=${e=>setBusca(e.target.value)} aria-label="Buscar"/>
    ${lista.length?html`<div class="tbl-wrap"><table><thead><tr><th>Material</th><th class="r">Estoque</th><th class="r">Reservado p/ obras</th><th class="r">Mínimo</th><th class="r">Custo</th><th></th></tr></thead><tbody>
      ${lista.map(m=>{const r=reservado[m.id]||0;const st=num(m.estoque)<r?"bad":num(m.minimo)>0&&num(m.estoque)<num(m.minimo)?"warn":"";
        return html`<tr key=${m.id}><td>${m.nome}</td><td class="r num">${st?html`<span class=${"pill "+st}>${n2(m.estoque)} ${m.unid}</span>`:`${n2(m.estoque)} ${m.unid}`}</td><td class="r num">${r?n2(r):"—"}</td><td class="r num">${n2(m.minimo)}</td><td class="r num">${brl(m.custo)}</td>
        <td class="r"><div class="row" style=${{justifyContent:"flex-end",flexWrap:"nowrap"}}>${pode&&html`<button class="btn sm" onClick=${()=>setMov({m,tipo:"entrada",qtd:0})}>Entrada</button><button class="btn sm" onClick=${()=>setMov({m,tipo:"saida",qtd:0})}>Saída</button>`}${S.admin&&html`<button class="btn sm ghost" onClick=${()=>setNovo({...m})}>Editar</button>`}</div></td></tr>`})}
    </tbody></table></div>`:html`<${Empty} title="Nenhum material cadastrado" text=${S.admin?"Cadastre os materiais em Preços e custos (com o botão de modelo) ou aqui, um a um.":"O patrão ainda não cadastrou os materiais."}/>`}`}
  ${tab==="comprar"&&html`<div class="tbl-wrap"><table><thead><tr><th>Material</th><th class="r">Estoque</th><th class="r">Obras precisam</th><th class="r">Mínimo</th><th class="r">Comprar</th><th class="r">Custo est.</th></tr></thead><tbody>
    ${S.mats.map(m=>{const r=reservado[m.id]||0;const q=Math.max(0,r+num(m.minimo)-num(m.estoque));return q>0?html`<tr key=${m.id}><td>${m.nome}</td><td class="r num">${n2(m.estoque)}</td><td class="r num">${n2(r)}</td><td class="r num">${n2(m.minimo)}</td><td class="r num"><b>${n2(Math.ceil(q))} ${m.unid}</b></td><td class="r num">${brl(Math.ceil(q)*num(m.custo))}</td></tr>`:null})}
  </tbody></table></div>`}
  ${tab==="mov"&&html`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Material</th><th>Tipo</th><th class="r">Qtd</th><th>Ref.</th></tr></thead><tbody>
    ${[...S.data.movimentos].sort((a,b)=>(b.data||"").localeCompare(a.data||"")).slice(0,200).map(v=>html`<tr key=${v.id}><td>${dataBR(v.data)}</td><td>${(S.mats.find(m=>m.id===v.matId)||{nome:v.matId}).nome}</td><td>${v.tipo==="entrada"?html`<span class="pill ok">Entrada</span>`:html`<span class="pill">Saída</span>`}</td><td class="r num">${n2(v.qtd)}</td><td class="small muted">${v.ref||""}</td></tr>`)}
    ${!S.data.movimentos.length&&html`<tr><td colspan="5" class="muted">Nenhuma movimentação.</td></tr>`}</tbody></table></div>`}
  ${mov&&html`<${Modal} title=${(mov.tipo==="entrada"?"Entrada · ":"Saída · ")+mov.m.nome} onClose=${()=>setMov(null)}>
    <div class="grid g3"><${F} label=${"Quantidade ("+mov.m.unid+")"}><${Num} id="mv-q" value=${mov.qtd} onChange=${v=>setMov({...mov,qtd:v})}/><//>
    <${F} label="Referência (nota, OS, fornecedor)"><${Inp} id="mv-r" value=${mov.ref} onChange=${v=>setMov({...mov,ref:v})}/><//>
    ${mov.tipo==="entrada"&&html`<${F} label="Custo unitário pago (R$)"><${Inp} id="mv-c" type="number" value=${mov.custo??mov.m.custo} onChange=${v=>setMov({...mov,custo:v})}/><//>`}</div>

  ${novo&&html`<${Modal} title=${novo.id?"Editar material":"Novo material"} onClose=${()=>setNovo(null)}>
    <div class="grid g3"><${F} label="Nome"><${Inp} id="nm-n" value=${novo.nome} onChange=${v=>setNovo({...novo,nome:v})}/><//><${F} label="Unidade"><${Sel} id="nm-u" value=${novo.unid} onChange=${v=>setNovo({...novo,unid:v})} opts=${["un","m","kg","rolo","cx","pç"]}/><//>
    <${F} label="Custo (R$)"><${Inp} id="nm-c" type="number" value=${novo.custo} onChange=${v=>setNovo({...novo,custo:v})}/><//><${F} label="Estoque atual"><${Inp} id="nm-e" type="number" value=${novo.estoque} onChange=${v=>setNovo({...novo,estoque:v})}/><//><${F} label="Estoque mínimo"><${Inp} id="nm-m" type="number" value=${novo.minimo} onChange=${v=>setNovo({...novo,minimo:v})}/><//>
    <${F} label="Fornecedor"><${Sel} id="nm-f" value=${novo.fornecedorId||""} onChange=${v=>setNovo({...novo,fornecedorId:v})} opts=${[["","—"],...S.data.fornecedores.map(f=>[f.id,f.nome])]}/><//></div>
    <div class="row" style=${{justifyContent:"space-between"}}>${novo.id?html`<button class="btn ghost danger" onClick=${()=>{S.api.del("materiais",novo.id,"Material excluído.");setNovo(null)}}>Excluir</button>`:html`<span></span>`}<button class="btn pri" disabled=${!novo.nome} onClick=${()=>{novo.id?S.api.set("materiais",novo.id,novo,"Material salvo."):S.api.add("materiais",novo,"Material cadastrado.");setNovo(null)}}>Salvar</button></div><//>`}`;
