PAGES.financeiro=function Fin(){
  const S=useS();const [ed,setEd]=useState(null);const [filtro,setFiltro]=useState("aberto");const [mes,setMes]=useState(hoje().slice(0,7));
  const L=[...S.data.financeiro].sort((a,b)=>(a.venc||"9").localeCompare(b.venc||"9"));
  const vis=L.filter(f=>filtro==="aberto"?f.status!=="pago":filtro==="mes"?((f.pagoEm||f.venc||"").slice(0,7)===mes):true);
  const doMes=L.filter(f=>f.status==="pago"&&(f.pagoEm||"").slice(0,7)===mes);
  const ent=doMes.filter(f=>f.tipo==="entrada").reduce((a,f)=>a+num(f.valor),0),sai=doMes.filter(f=>f.tipo==="saida").reduce((a,f)=>a+num(f.valor),0);
  const pagar=f=>S.api.update("financeiro",f.id,{status:f.status==="pago"?"pendente":"pago",pagoEm:f.status==="pago"?"":hoje()},f.status==="pago"?"Reaberto.":"Baixado como pago.");
  return html`<div class="phead"><div><h1>Dinheiro</h1><p>Contas a receber e a pagar. Obra aprovada já entra aqui sozinha.</p></div><button class="btn pri" onClick=${()=>setEd({tipo:"saida",desc:"",valor:0,venc:hoje(),status:"pendente",categoria:"Material"})}>Novo lançamento</button></div>
  <div class="grid g4"><div class="card kpi"><span>Recebido em ${mes.split("-").reverse().join("/")}</span><b>${brl(ent)}</b></div><div class="card kpi"><span>Pago no mês</span><b>${brl(sai)}</b></div><div class="card kpi"><span>Resultado do mês</span><b style=${{color:ent-sai<0?"var(--bad)":"var(--ok)"}}>${brl(ent-sai)}</b></div>
    <div class="card kpi"><span>Mês</span><input class="i" type="month" value=${mes} onChange=${e=>setMes(e.target.value)} aria-label="Mês"/></div></div>
  <${Tabs} value=${filtro} onChange=${setFiltro} tabs=${[["aberto","Em aberto"],["mes","Do mês"],["todos","Todos"]]}/>
  ${vis.length?html`<div class="tbl-wrap"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th>Categoria</th><th class="r">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
    ${vis.map(f=>{const venc=f.status!=="pago"&&f.venc&&f.venc<hoje();return html`<tr key=${f.id}><td>${dataBR(f.venc)}</td><td>${f.desc}</td><td class="small muted">${f.categoria||""}</td><td class="r num" style=${{color:f.tipo==="entrada"?"var(--ok)":"var(--fg)"}}>${f.tipo==="entrada"?"+":"−"} ${brl(f.valor)}</td>
      <td>${f.status==="pago"?html`<span class="pill ok">Pago ${dataBR(f.pagoEm)}</span>`:venc?html`<span class="pill bad">Vencido</span>`:html`<span class="pill warn">Pendente</span>`}</td>
      <td class="r"><div class="row" style=${{justifyContent:"flex-end",flexWrap:"nowrap"}}><button class="btn sm" onClick=${()=>pagar(f)}>${f.status==="pago"?"Reabrir":"Baixar"}</button><button class="btn sm ghost" onClick=${()=>setEd({...f})}>Editar</button></div></td></tr>`})}
  </tbody></table></div>`:html`<${Empty} title="Nada por aqui" text="Lance contas a pagar (material, combustível, folha) e a receber. As parcelas das obras fechadas entram automaticamente."/>`}
  ${ed&&html`<${Modal} title=${ed.id?"Editar lançamento":"Novo lançamento"} onClose=${()=>setEd(null)}>
    <div class="grid g3"><${F} label="Tipo"><${Sel} id="fn-t" value=${ed.tipo} onChange=${v=>setEd({...ed,tipo:v})} opts=${[["entrada","Entrada (a receber)"],["saida","Saída (a pagar)"]]}/><//>
      <${F} label="Descrição"><${Inp} id="fn-d" value=${ed.desc} onChange=${v=>setEd({...ed,desc:v})}/><//><${F} label="Valor (R$)"><${Inp} id="fn-v" type="number" value=${ed.valor} onChange=${v=>setEd({...ed,valor:v})}/><//>
      <${F} label="Vencimento"><${Inp} id="fn-ve" type="date" value=${ed.venc} onChange=${v=>setEd({...ed,venc:v})}/><//><${F} label="Categoria"><${Sel} id="fn-c" value=${ed.categoria} onChange=${v=>setEd({...ed,categoria:v})} opts=${["Obra","Material","Folha","Combustível","Ferramentas","Impostos","Aluguel","Outros"]}/><//>
      <${F} label="Forma"><${Sel} id="fn-f" value=${ed.forma||"Pix"} onChange=${v=>setEd({...ed,forma:v})} opts=${["Pix","Dinheiro","Boleto","Cartão de crédito","Transferência"]}/><//></div>
    <div class="row" style=${{justifyContent:"space-between"}}>${ed.id?html`<button class="btn ghost danger" onClick=${()=>{S.api.del("financeiro",ed.id,"Lançamento excluído.");setEd(null)}}>Excluir</button>`:html`<span></span>`}<button class="btn pri" disabled=${!ed.desc||!ed.valor} onClick=${()=>{ed.id?S.api.set("financeiro",ed.id,ed,"Salvo."):S.api.add("financeiro",{...ed,criadoEm:new Date().toISOString()},"Lançado.");setEd(null)}}>Salvar</button></div><//>`}`;
};

/* ============================== PREÇOS E CUSTOS ============================== */
PAGES.precos=function Precos(){
  const S=useS();const [tab,setTab]=useState(S.pontos.length?"pontos":"param");
  const [cfg,setCfg]=useState(S.config);const [cfgDirty,setCfgDirty]=useState(false);
  useEffect(()=>{if(!cfgDirty)setCfg(S.config)},[S.configSalva,S.config.regras]);
  const [pts,setPts]=useState(S.pontos);const [ptsDirty,setPtsDirty]=useState(false);
  useEffect(()=>{if(!ptsDirty)setPts(S.pontos)},[S.precos]);
  const [kit,setKit]=useState(null);const [carregando,setCarregando]=useState(false);
  const setC=p=>{setCfg(x=>({...x,...p}));setCfgDirty(true)};
  const ch=(num(cfg.folhaMensal)*(1+num(cfg.encargosPct)/100)+num(cfg.custosFixos))/Math.max(1,num(cfg.horasProdutivas));
  const upP=(id,p)=>{setPts(a=>a.map(x=>x.id===id?{...x,...p}:x));setPtsDirty(true)};
  const carregarModelo=async()=>{
    setCarregando(true);
    try{
      const exist=new Set(S.mats.map(m=>m.id));
      for(const [id,nome,unid,custo] of MODELO.materiais)if(!exist.has(id))await S.api.set("materiais",id,{id,nome,unid,custo,estoque:0,minimo:0},null);
      const pontos=MODELO.pontos.map(([id,nome,grupo,unid,mo,horas,kit])=>({id,nome,grupo,unid,mo,horas,kit}));
      const atuais=new Set(S.pontos.map(p=>p.id));
      const novos=[...S.pontos,...pontos.filter(p=>!atuais.has(p.id))];
      await S.api.setMeta("precos",{pontos:novos},null);setPts(novos);setPtsDirty(false);
      if(!S.configSalva)await S.api.setMeta("config",cfg,null);
      S.toast("Tabela modelo carregada. Ajuste os valores para a sua realidade.");
    }finally{setCarregando(false)}
  };
  return html`<div class="phead"><div><h1>Preços</h1><p>Quanto custa sua hora e quanto você cobra por ponto.</p></div>
    <div class="row">${(!S.pontos.length||!S.mats.length)&&html`<button class="btn" disabled=${carregando} onClick=${carregarModelo}>${carregando?"Carregando…":"Carregar tabela modelo"}</button>`}</div></div>
  <${Tabs} value=${tab} onChange=${setTab} tabs=${[["param","Custo da hora e parâmetros"],["pontos",`Preço por ponto (${pts.length})`]]}/>
  ${tab==="param"&&html`<div class="grid g2" style=${{alignItems:"start"}}>
    <div class="card col"><h3>Quanto custa 1 hora da sua equipe</h3><p class="small muted" style=${{margin:0}}>É aqui que a maioria erra o preço: cobra o ponto sem saber quanto custa a hora trabalhada.</p>
      <div class="grid g2"><${F} label="Folha mensal da equipe (R$)"><${Inp} id="pc-fo" type="number" value=${cfg.folhaMensal} onChange=${v=>setC({folhaMensal:v})}/><//>
      <${F} label="Encargos e benefícios (%)"><${Inp} id="pc-en" type="number" value=${cfg.encargosPct} onChange=${v=>setC({encargosPct:v})}/><//>
      <${F} label="Custos fixos mensais (R$) · carro, aluguel, contador, ferramentas"><${Inp} id="pc-cf" type="number" value=${cfg.custosFixos} onChange=${v=>setC({custosFixos:v})}/><//>
      <${F} label="Horas produtivas por mês (equipe toda)"><${Inp} id="pc-hp" type="number" value=${cfg.horasProdutivas} onChange=${v=>setC({horasProdutivas:v})}/><//></div>
      <div class="small muted">Horas produtivas = pessoas em obra × ~150 h/mês (já descontando deslocamento, chuva e retrabalho). Ex.: 3 pessoas ≈ 450 h.</div>
      <div class="total-box"><div class="ln"><span>Custo da hora</span></div><div class="big">${brl(ch)}</div><div class="small" style=${{opacity:.8}}>Qualquer ponto que renda menos que isso por hora dá prejuízo.</div></div>
    </div>
    <div class="col"><div class="card col"><h3>Parâmetros do orçamento</h3>
      <div class="grid g2"><${F} label="Nome da empresa"><${Inp} id="pc-emp" value=${cfg.empresa} onChange=${v=>setC({empresa:v})}/><//><${F} label="Cidade"><${Inp} id="pc-cid" value=${cfg.cidade} onChange=${v=>setC({cidade:v})}/><//>
      <${F} label="Telefone (aparece na proposta)"><${Inp} id="pc-tel" value=${cfg.telefone} onChange=${v=>setC({telefone:v})}/><//><${F} label="Imposto padrão (%)"><${Inp} id="pc-imp" type="number" value=${cfg.impostoPct} onChange=${v=>setC({impostoPct:v})}/><//>
      <${F} label="Markup sobre material (%)"><${Inp} id="pc-mk" type="number" value=${cfg.markupMatPct} onChange=${v=>setC({markupMatPct:v})}/><//><${F} label="Fator industrial (× mão de obra)"><${Inp} id="pc-fi" type="number" value=${cfg.fatorIndustrial} onChange=${v=>setC({fatorIndustrial:v})}/><//>
      <${F} label="Deslocamento padrão (R$)"><${Inp} id="pc-dp" type="number" value=${cfg.deslocamentoPadrao} onChange=${v=>setC({deslocamentoPadrao:v})}/><//><${F} label="Margem mínima aceitável (%)"><${Inp} id="pc-mm" type="number" value=${cfg.margemMin} onChange=${v=>setC({margemMin:v})}/><//></div></div>
      <div class="card col"><h3>Logo da empresa</h3>
        <div class="row"><div style=${{background:"var(--sunk)",borderRadius:8,padding:10}}><${Marca} style=${{padding:0}}/></div>
          <input id="pc-logo" type="file" accept="image/png,image/jpeg,image/svg+xml" hidden onChange=${async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const as=await window.claude?.use?.("assets");if(!as){S.toast("Envio de arquivo indisponível aqui. Abra pelo link do claude.ai.");return}try{const r=await as.upload(f);const novo={...cfg,logoAssetId:r.id};setCfg(novo);await S.api.setMeta("config",novo,"Logo atualizada.");setCfgDirty(false)}catch(err){S.toast("Não foi possível enviar a logo: "+(err&&err.message||"erro"))}}}/>
          <button class="btn" onClick=${()=>document.getElementById("pc-logo").click()}>Enviar logo (PNG ou JPG)</button>
          ${cfg.logoAssetId&&html`<button class="btn ghost danger" onClick=${async()=>{const novo={...cfg,logoAssetId:""};setCfg(novo);await S.api.setMeta("config",novo,"Logo removida: voltou o desenho padrão.");setCfgDirty(false)}}>Usar desenho padrão</button>`}</div>
        <p class="small muted" style=${{margin:0}}>Aparece no menu e na proposta em PDF. Use a versão com fundo branco ou transparente.</p></div>
      <div class="card col"><h3>Dados da proposta (PDF)</h3>
        <div class="grid g2"><${F} label="CNPJ"><${Inp} id="pc-cnpj" value=${cfg.cnpj} onChange=${v=>setC({cnpj:v})}/><//><${F} label="E-mail"><${Inp} id="pc-mail" value=${cfg.email} onChange=${v=>setC({email:v})}/><//>
        <${F} label="Validade da proposta (dias)"><${Inp} id="pc-val" type="number" value=${cfg.validadeDias} onChange=${v=>setC({validadeDias:v})}/><//></div>
        <${F} label="Garantia (uma por linha)"><textarea class="i" id="pc-gar" value=${cfg.garantia} onChange=${e=>setC({garantia:e.target.value})}></textarea><//>
        <${F} label="Não está incluso (uma por linha)"><textarea class="i" id="pc-ni" value=${cfg.naoIncluso} onChange=${e=>setC({naoIncluso:e.target.value})}></textarea><//></div>
      <div class="card col"><h3>Regras da casa para ler projeto</h3><p class="small muted" style=${{margin:0}}>O jeito do patrão ler. A IA obedece estas regras e a equipe vê no guia. Uma por linha.</p>
        <textarea class="i" id="pc-rg" style=${{minHeight:130}} value=${cfg.regras} onChange=${e=>setC({regras:e.target.value})} placeholder=${"• Todo banheiro tem chuveiro mesmo que o projeto não mostre\n• Ponto de ar-condicionado: contar tomada 20A + dreno"}></textarea></div>
      <div class="row" style=${{justifyContent:"flex-end"}}><button class="btn pri" disabled=${!cfgDirty} onClick=${async()=>{if(await S.api.setMeta("config",cfg,"Parâmetros salvos."))setCfgDirty(false)}}>Salvar parâmetros</button></div>
    </div></div>`}
  ${tab==="pontos"&&html`${pts.length?html`<div class="alert info">Valores do modelo são só referência para começar. Ajuste pelo que você cobra hoje e confira a coluna R$/hora: ela tem que ficar acima do custo da hora (${brl(S.custoHora)}).</div>
    <div class="tbl-wrap"><table><thead><tr><th>Tipo de ponto</th><th>Grupo</th><th class="r">Preço M.O.</th><th class="r">Horas</th><th class="r">R$/hora</th><th class="r">Material (kit)</th><th></th></tr></thead><tbody>
    ${pts.map(p=>{const rh=num(p.horas)?num(p.mo)/num(p.horas):0;const ck=custoKit(p,S.mats);return html`<tr key=${p.id}><td style=${{minWidth:200}}><input class="i" value=${p.nome} onChange=${e=>upP(p.id,{nome:e.target.value})} aria-label="Nome"/></td>
      <td style=${{width:130}}><${Sel} value=${p.grupo} onChange=${v=>upP(p.id,{grupo:v})} opts=${["Residencial","Quadro","Industrial"]}/></td>
      <td style=${{width:110}}><${Inp} type="number" value=${p.mo} onChange=${v=>upP(p.id,{mo:v})} aria-label="Preço mão de obra"/></td>
      <td style=${{width:90}}><${Inp} type="number" value=${p.horas} onChange=${v=>upP(p.id,{horas:v})} aria-label="Horas"/></td>
      <td class="r num">${rh?html`<span class=${"pill "+(rh<S.custoHora?"bad":rh<S.custoHora*1.3?"warn":"ok")}>${brl(rh)}</span>`:"—"}</td>
      <td class="r"><button class="btn sm" onClick=${()=>setKit(p)}>${(p.kit||[]).length} itens · ${brl(ck)}</button></td>
      <td><button class="btn sm ghost danger" aria-label="Remover" onClick=${()=>{setPts(a=>a.filter(x=>x.id!==p.id));setPtsDirty(true)}}>✕</button></td></tr>`})}</tbody></table></div>
    <div class="row" style=${{justifyContent:"space-between"}}><button class="btn" onClick=${()=>{setPts(a=>[...a,{id:"p"+uid().slice(-6),nome:"Novo tipo de ponto",grupo:"Residencial",unid:"pt",mo:0,horas:1,kit:[]}]);setPtsDirty(true)}}>+ Tipo de ponto</button>
      <button class="btn pri" disabled=${!ptsDirty} onClick=${async()=>{if(await S.api.setMeta("precos",{pontos:pts},"Tabela de preços salva."))setPtsDirty(false)}}>Salvar tabela</button></div>`
    :html`<${Empty} title="Tabela de preços vazia" text="Carregue a tabela modelo (28 tipos de ponto com kit de material) e ajuste os valores, ou crie os tipos um a um."><div class="row"><button class="btn pri" disabled=${carregando} onClick=${carregarModelo}>Carregar tabela modelo</button><button class="btn" onClick=${()=>{setPts([{id:"p"+uid().slice(-6),nome:"Novo tipo de ponto",grupo:"Residencial",unid:"pt",mo:0,horas:1,kit:[]}]);setPtsDirty(true)}}>Criar do zero</button></div><//>`}`}
  ${kit&&html`<${KitModal} p=${pts.find(x=>x.id===kit.id)||kit} onClose=${()=>setKit(null)} onSave=${k=>{upP(kit.id,{kit:k});setKit(null)}}/>`}`;
};
function KitModal({p,onClose,onSave}){
  const S=useS();const [k,setK]=useState(p.kit||[]);const [add,setAdd]=useState("");
  return html`<${Modal} title=${"Material por ponto · "+p.nome} onClose=${onClose}>
    <p class="small muted" style=${{margin:0}}>O que vai em cada unidade deste ponto. Cabo e eletroduto ficam de fora: entram pela metragem do projeto.</p>
    ${k.map(([mid,q],i)=>{const m=S.mats.find(x=>x.id===mid);return html`<div class="it" key=${mid}><span class="nm">${m?m.nome:mid+" (não cadastrado)"}</span><span class="small muted num">${m?brl(num(m.custo)*num(q)):""}</span><${Num} value=${q} onChange=${v=>setK(a=>v>0?a.map((x,j)=>j===i?[x[0],v]:x):a.filter((_,j)=>j!==i))}/></div>`})}
    <select class="i" value=${add} onChange=${e=>{const v=e.target.value;if(v&&!k.find(x=>x[0]===v))setK([...k,[v,1]]);setAdd("")}} aria-label="Adicionar material"><option value="">+ adicionar material…</option>${S.mats.map(m=>html`<option key=${m.id} value=${m.id}>${m.nome}</option>`)}</select>
    <div class="row" style=${{justifyContent:"flex-end"}}><button class="btn pri" onClick=${()=>onSave(k)}>Aplicar</button></div><//>`;
}

/* ============================== EQUIPE ============================== */
PAGES.equipe=function Equipe(){
  const S=useS();const [papelNovo,setPapelNovo]=useState({});
  const local=S.be.status!=="ready";
  const liberar=async id=>{await S.api.set("team",id,{id,role:papelNovo[id]||"eletricista",active:true,addedAt:new Date().toISOString()},null);await S.api.del("access_requests",id,"Acesso liberado.")};
  return html`<div class="phead"><div><h1>Equipe</h1><p>Eletricista e ajudante veem só tarefas, obras, estoque e o guia. Preço e dinheiro ficam com patrão e escritório.</p></div></div>
  ${local&&html`<div class="alert warn">No modo local não há equipe. Abra pelo link do claude.ai e compartilhe com a equipe (permissão de edição) para cada um pedir acesso.</div>`}
  <div class="card col"><h3>Como colocar alguém na equipe</h3><ol style=${{margin:0,paddingLeft:18}} class="small"><li>Compartilhe o link deste sistema com a pessoa, com permissão de edição.</li><li>Ela abre, faz login e toca em "Pedir acesso".</li><li>O pedido aparece aqui: escolha a função e libere.</li></ol></div>
  ${S.data.access_requests.length?html`<div class="card col"><h3>Pedidos de acesso</h3>${S.data.access_requests.map(r=>html`<div class="row" key=${r.id} style=${{justifyContent:"space-between"}}><div><b>${S.nome(r.id)}</b><div class="small muted">pediu em ${dataBR((r.requestedAt||"").slice(0,10))}</div></div>
    <div class="row"><select class="i" style=${{width:"auto"}} value=${papelNovo[r.id]||"eletricista"} onChange=${e=>setPapelNovo({...papelNovo,[r.id]:e.target.value})} aria-label="Função">${Object.entries(PAPEIS).filter(([k])=>k!=="patrao").map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select>
    <button class="btn pri" onClick=${()=>liberar(r.id)}>Liberar</button><button class="btn ghost danger" onClick=${()=>S.api.del("access_requests",r.id,"Pedido recusado.")}>Recusar</button></div></div>`)}</div>`:null}
  ${S.data.team.length?html`<div class="tbl-wrap"><table><thead><tr><th>Pessoa</th><th>Função</th><th class="r">Tarefas abertas</th><th>Acesso</th><th></th></tr></thead><tbody>
    ${S.data.team.map(t=>{const ab=S.data.os.filter(o=>o.etapa!=="concluida").flatMap(o=>o.tarefas||[]).filter(k=>k.resp===t.id&&!k.feito).length;
      return html`<tr key=${t.id}><td><b>${S.nome(t.id)}</b></td><td><select class="i" style=${{width:"auto"}} value=${t.role} onChange=${e=>S.api.update("team",t.id,{role:e.target.value},"Função atualizada.")} aria-label="Função">${Object.entries(PAPEIS).filter(([k])=>k!=="patrao").map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select></td>
      <td class="r num">${ab}</td><td>${t.active!==false?html`<span class="pill ok">Ativo</span>`:html`<span class="pill">Pausado</span>`}</td>
      <td class="r"><div class="row" style=${{justifyContent:"flex-end",flexWrap:"nowrap"}}><button class="btn sm" onClick=${()=>S.api.update("team",t.id,{active:t.active===false},t.active===false?"Acesso reativado.":"Acesso pausado.")}>${t.active===false?"Reativar":"Pausar"}</button><button class="btn sm ghost danger" onClick=${()=>S.api.del("team",t.id,"Removido da equipe.")}>Remover</button></div></td></tr>`})}
  </tbody></table></div>`:!local&&html`<${Empty} title="Ninguém na equipe ainda" text="Quando alguém pedir acesso pelo link compartilhado, o pedido aparece aqui."/>`}`;
};

/* ============================== BOOT ============================== */
ReactDOM.createRoot(document.getElementById("root")).render(html`<${Provider}><${App}/><//>`);
</script>
