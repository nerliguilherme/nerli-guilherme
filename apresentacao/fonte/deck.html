<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
@page{size:1920px 1080px;margin:0}
html,body{margin:0;background:#ddd}
*{box-sizing:border-box}
:root{--navy:#142C6C;--blue:#004299;--mag:#DB0074;--ora:#F28E25;--ink:#16181D;--mut:#6B7280;--bg:#F6F5F2}
.s{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;page-break-after:always}
.s.dark{background:#0D1530;color:#fff}
.stripe{position:absolute;left:0;top:0;width:100%;height:10px;background:linear-gradient(90deg,var(--mag) 0 33.3%,var(--blue) 33.3% 66.6%,var(--ora) 66.6%)}
.kick{font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ora)}
h1{margin:0;font-size:96px;line-height:1.02;font-weight:800;letter-spacing:-.04em;color:var(--navy)}
h2{margin:0;font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-.035em;color:var(--navy)}
.dark h1,.dark h2{color:#fff}
p.lead{font-size:28px;line-height:1.45;color:var(--mut);margin:0;font-weight:500;letter-spacing:-.01em}
.dark p.lead{color:#C7CCE0}
.k{color:var(--ora)}
.foot{position:absolute;left:96px;right:96px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-size:18px;color:#9CA3AF;font-weight:600;letter-spacing:0}
.foot img{height:34px}
.ph{position:relative;border-radius:22px;overflow:hidden;background:#1d2233;box-shadow:0 24px 50px -28px rgba(20,44,108,.45)}
.ph .bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(30px) brightness(.85)}
.ph .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ph.cover .fg{object-fit:cover}
.cap{margin-top:14px;font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.cap span{display:block;font-size:17px;font-weight:500;color:var(--mut);margin-top:3px;letter-spacing:0}
.dark .cap{color:#fff}.dark .cap span{color:#AAB2CC}
.grid{position:absolute;display:grid;gap:26px}
.num{font-size:120px;font-weight:800;letter-spacing:-.05em;line-height:1}
.card{background:#fff;border-radius:24px;padding:38px;box-shadow:0 18px 40px -28px rgba(20,44,108,.35)}
.card h3{margin:16px 0 10px;font-size:32px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.card p{margin:0;font-size:21px;line-height:1.45;color:var(--mut)}
.ic{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.tag{display:inline-block;padding:8px 18px;border-radius:999px;background:var(--ora);color:#fff;font-size:20px;font-weight:800;letter-spacing:.08em}
/* cartões NFC */
.nfc{position:relative;width:330px;height:520px;border-radius:30px;overflow:hidden;box-shadow:0 30px 60px -26px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08)}
.nfc .tx{position:absolute;left:0;width:100%;text-align:center;font-weight:800;letter-spacing:-.01em}
.nfc .brand{position:absolute;left:0;bottom:22px;width:100%;text-align:center;font-size:13px;font-weight:700;letter-spacing:.18em;opacity:.55}
.nfc .wave{position:absolute;right:26px;top:26px}
</style></head><body>
