<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f3f4fb}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#ffffff 0%,#eef0fa 55%,#e3e6f5 100%)}
.poly{position:absolute;opacity:.0;mix-blend-mode:multiply}
.bar{position:absolute;height:1920px;width:420px;top:0}
#logo{position:absolute;left:80px;top:840px;width:920px;height:240px;transform-origin:460px 120px}
#logo img{position:absolute;left:0;top:0}
.L{position:absolute;overflow:hidden}
#shine{position:absolute;left:0;top:0;width:920px;height:240px;pointer-events:none;
 -webkit-mask-image:url(logo_full.png);mask-image:url(logo_full.png);mask-size:920px 240px}
#shine div{position:absolute;top:-40px;width:120px;height:320px;transform:skewX(-20deg);
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}
#chips{position:absolute;left:80px;top:1180px;display:flex;gap:6px}
#chips span{display:block;height:22px;width:0}
</style></head><body>
<div id="bg"></div>
<svg class="poly" id="p1" width="1080" height="1920" style="left:0;top:0"><polygon points="0,1500 1080,1180 1080,2300 0,2300" fill="#f2a23a"/></svg>
<svg class="poly" id="p2" width="1080" height="1920" style="left:0;top:0"><polygon points="300,1920 1080,1350 1080,2300 300,2300" fill="#3b4fd0"/></svg>
<svg class="poly" id="p3" width="1080" height="1920" style="left:0;top:0"><polygon points="0,-300 1080,-300 1080,380 0,640" fill="#cf2c6b"/></svg>
<div id="logo">
 <img id="nm" src="n_mag.png"><img id="nb" src="n_blu.png"><img id="no" src="n_ora.png">
 <div id="letters"></div>
 <div class="L" id="tagw" style="left:0;top:172px;height:68px;width:0"><img src="tag.png" style="top:0"></div>
 <div id="shine"><div></div></div>
</div>
<div id="chips"><span style="background:#cf2c6b"></span><span style="background:#1e3f99"></span><span style="background:#f0a13a"></span></div>
<div class="bar" id="b1" style="background:#cf2c6b"></div>
<div class="bar" id="b2" style="background:#1e3f99"></div>
<div class="bar" id="b3" style="background:#f0a13a"></div>
<script>
const LX=[236,377,507,650,788],LW=[121,112,123,117,113];
const box=document.getElementById('letters');
LX.forEach((x,i)=>{const d=document.createElement('div');d.className='L';d.id='l'+i;
 d.style.cssText=`left:${x}px;top:0;width:${LW[i]}px;height:172px`;
 d.innerHTML=`<img src="L${i}.png" style="left:0;top:0">`;box.appendChild(d)});
const cl=(x)=>Math.max(0,Math.min(1,x));
const p=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const $=id=>document.getElementById(id);
window.render=function(t){
 // abertura: 3 faixas varrem a tela
 [['b1',0],['b2',.08],['b3',.16]].forEach(([id,d])=>{
  const k=eio(p(t,d,d+.9));
  $(id).style.left=(-480+k*(1080+960))+'px';
  $(id).style.transform='skewX(-14deg)';
 });
 // poligonos de fundo
 const pk=eo(p(t,.6,1.6));
 $('p1').style.opacity=.10*pk; $('p1').style.transform=`translateY(${(1-pk)*200 - t*6}px)`;
 $('p2').style.opacity=.10*pk; $('p2').style.transform=`translateY(${(1-pk)*260 - t*10}px)`;
 $('p3').style.opacity=.07*pk; $('p3').style.transform=`translateY(${-(1-pk)*200 + t*6}px)`;
 // N: magenta sobe, azul na diagonal, laranja desce
 const km=eo(p(t,.75,1.35)), kb=eo(p(t,1.0,1.6)), ko=eo(p(t,1.2,1.8));
 $('nm').style.clipPath=`inset(${(1-km)*100}% 0 0 0)`; $('nm').style.transform=`translateY(${(1-km)*40}px)`;
 $('nb').style.clipPath=`polygon(0 0, ${kb*520}px 0, 0 ${kb*520}px)`;
 $('no').style.clipPath=`inset(0 0 ${(1-ko)*100}% 0)`; $('no').style.transform=`translateY(${-(1-ko)*40}px)`;
 // letras GRAPH sobem com mascara
 for(let i=0;i<5;i++){const k=eb(p(t,1.6+i*.09,2.15+i*.09));
  const im=$('l'+i).firstChild; im.style.transform=`translateY(${(1-k)*175}px)`;}
 // tagline revela da esquerda
 const kt=eo(p(t,2.4,3.1)); $('tagw').style.width=(kt*920)+'px';
 // chips
 const kc=[0,1,2].map(i=>eo(p(t,2.7+i*.1,3.2+i*.1)));
 document.querySelectorAll('#chips span').forEach((s,i)=>s.style.width=(kc[i]*80)+'px');
 // brilho
 const ks=p(t,3.5,4.3); $('shine').firstChild.style.left=(-200+ks*1300)+'px';
 // respiro / escala
 const s=0.92+0.08*eo(p(t,.75,2.4))+0.015*eio(p(t,3.2,6));
 $('logo').style.transform=`scale(${s})`;
};
render(0);
</script></body></html>
