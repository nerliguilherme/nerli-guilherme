.flip{border-radius:34px;display:flex;align-items:center;justify-content:center;text-align:center;font:900 64px/1.05 Mont;color:#fff}

#morph{position:absolute;left:0;top:0;overflow:visible}

.kt{position:absolute;left:40px;right:40px;text-align:center;font:110px/1.02 Anton;text-transform:uppercase;color:#fff;letter-spacing:1px;perspective:900px;
  -webkit-text-stroke:10px #000;paint-order:stroke fill}
.kt .w{display:inline-block;white-space:nowrap;margin:0 .14em;transform-style:preserve-3d}
.kt .l{display:inline-block;transform-origin:50% 100%}
.kt .hl{color:var(--acc,#2f7bff)}
.num{position:absolute;font:900 280px/1 Mont;color:transparent;-webkit-text-stroke:5px rgba(255,255,255,.85);letter-spacing:-10px}
.ttl{position:absolute;left:0;right:0;text-align:center;font:800 64px/1.1 Mont;color:#fff}
.ttl .l{display:inline-block}

<script>
const {cl,eo,eio,eb,lerp,$}=E;

const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const ss=(a,b,x)=>{const k=cl((x-a)/(b-a));return k*k*(3-2*k);};

 <div class="face flip" style="width:700px;height:400px;transform:rotateY(180deg);background:#03140f;box-shadow:inset 0 0 0 5px #19e3c4,0 0 60px rgba(25,227,196,.6)"><div>Promo de<br>novembro 🔥</div></div>`;

$('spin').innerHTML=`<svg width="560" height="560" viewBox="0 0 24 24" fill="none" stroke="#ff9a1f" stroke-width=".6" stroke-linecap="round" style="filter:drop-shadow(0 0 8px #ff9a1f)"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>`;

$('rings').innerHTML=[0,1,2,3].map(i=>`<div id="rg${i}" style="position:absolute;border:7px solid #8fb6ff;border-radius:50%;box-shadow:0 0 22px #2f7bff"></div>`).join('');
// partículas em profundidade (posições por hash)
const PT=[];for(let i=0;i<80;i++){const d=document.createElement('div');d.className='pt';const s=3+hash(i+7)*6;d.style.width=d.style.height=s+'px';$('pts').appendChild(d);PT.push([hash(i)*2400-660,hash(i+100)*2600-340,-1400+hash(i+200)*1800,.3+hash(i+300)*.7]);}
// ---------- tipografia cinética ----------
const COL={0:'#ff2d8a',1:'#ff2d8a',2:'#2f7bff',3:'#ff9a1f',4:'#19e3c4',5:'#2f7bff'};
function sceneOf(t){return t<A.v1?0:t<A.v2?1:t<A.v3?2:t<A.v4?3:t<A.end?4:5;}
const KT=window.CAPS_V.map((c,gi)=>{const el=document.createElement('div');el.className='kt';
  const big=c[0]<A.olha;el.style.top=(big?720:1430)+'px';if(big)el.style.fontSize='150px';
  el.style.setProperty('--acc',COL[sceneOf(c[0]+.01)]);
  let li=0;el.innerHTML=c[2].replace(/\*([^*]+)\*/g,'\u0001$1\u0002').split(/(\u0001[^\u0002]*\u0002)/).map(seg=>{const hl=seg.startsWith('\u0001');const s=hl?seg.slice(1,-1):seg;
    return s.trim().split(/\s+/).filter(Boolean).map(w=>`<span class="w${hl?' hl':''}">${[...w].map(ch=>`<span class="l" data-i="${li++}">${ch}</span>`).join('')}</span>`).join(' ');}).join(' ');
  $('kts').appendChild(el);return {el,t0:c[0],t1:c[1],n:li,ls:[...el.querySelectorAll('.l')],ws:[...el.querySelectorAll('.w')]};});
function renderKT(t){KT.forEach(g=>{const vis=t>=g.t0-.05&&t<g.t1+.1;g.el.style.display=vis?'block':'none';if(!vis)return;
  const st=Math.min(.03,.32/g.n);
  g.ls.forEach((l,i)=>{const a=t-(g.t0+i*st);const k=eb(cl(a/.32));const ko=ss(g.t1-.14+i*.004,g.t1+.02+i*.004,t);
    l.style.transform=`translateY(${(1-k)*70-ko*60}px) rotateX(${(1-eo(cl(a/.32)))*-95+ko*70}deg) scale(${.6+.4*k})`;l.style.opacity=cl(a/.08)*(1-ko);});
  g.ws.forEach(w=>{if(!w.classList.contains('hl'))return;const a=t-g.t0-.25;const pk=Math.max(0,Math.sin(Math.PI*cl(a/.35)));w.style.transform=`scale(${1+.16*pk})`;});});}
// títulos de cena: número vazado gigante + título letra a letra
const TT=[[A.v1,'01','Um toque e pronto','#ff2d8a'],[A.v2,'02','Tudo num lugar só','#2f7bff'],[A.v3,'03','Atualize quando quiser','#ff9a1f'],[A.v4,'04','Qualquer celular','#19e3c4']];
TT.forEach(([t0,n,s,c],i)=>{$('nums').insertAdjacentHTML('beforeend',`<div class="num" id="nu${i}" style="-webkit-text-stroke-color:${c};text-shadow:0 0 30px ${c}">${n}</div>`);
  $('titles').insertAdjacentHTML('beforeend',`<div class="ttl" id="tt${i}" style="top:236px">${[...s].map(ch=>`<span class="l">${ch==' '?'&nbsp;':ch}</span>`).join('')}</div>`);});
// CTA final
$('titles').insertAdjacentHTML('beforeend',`<div class="ttl" id="ttE" style="top:250px;font-size:72px">${[...'Placa NFC personalizada'].map(ch=>`<span class="l">${ch==' '?'&nbsp;':ch}</span>`).join('')}</div>`);
$('cta').innerHTML=`<div class="pill" id="pill" style="left:50%;top:1250px"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="#0a0a0a" stroke="none"/></svg>@ngraph.pe</div>
 <div id="chev" style="position:absolute;left:0;right:0;top:1340px;text-align:center">${[0,1,2].map(i=>`<svg id="cv${i}" width="130" height="62" viewBox="0 0 120 60" style="display:block;margin:-12px auto 0"><path d="M10 10 L60 50 L110 10" fill="none" stroke="#2f7bff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 12px #2f7bff)"/></svg>`).join('')}</div>`;
// ---------- forma que se transforma (superelipse) ----------
function shape(c){const N=120,pts=[];for(let i=0;i<N;i++){const a=i/N*Math.PI*2+c.rot,ca=Math.cos(a),sa=Math.sin(a);
  const x=Math.sign(ca)*Math.pow(Math.abs(ca),2/c.n)*c.w/2,y=Math.sign(sa)*Math.pow(Math.abs(sa),2/c.n)*c.h/2;pts.push((c.x+x).toFixed(1)+','+(c.y+y).toFixed(1));}return 'M'+pts.join('L')+'Z';}
const MK=()=>[[0,{x:540,y:1180,w:0,h:0,n:2,rot:0,o:0}],[.4,{x:540,y:1180,w:90,h:90,n:2,rot:0,o:1}],[A.olha-.3,{x:540,y:1180,w:120,h:120,n:2,rot:0,o:1}],
 [A.olha+.6,{x:540,y:950,w:600,h:780,n:9,rot:0,o:1}],[A.v1+.4,{x:420,y:950,w:560,h:740,n:9,rot:0,o:.7}],[A.v2,{x:540,y:950,w:640,h:640,n:2,rot:0,o:1}],
 [A.v2+.8,{x:540,y:960,w:1000,h:330,n:2,rot:.4,o:1}],[A.v3,{x:540,y:960,w:1000,h:330,n:2,rot:1.6,o:1}],[A.v3+.8,{x:540,y:950,w:800,h:500,n:10,rot:0,o:1}],
 [A.v4,{x:540,y:950,w:800,h:500,n:10,rot:0,o:1}],[A.v4+.8,{x:540,y:950,w:900,h:780,n:8,rot:0,o:.8}],[A.end,{x:540,y:950,w:900,h:780,n:8,rot:0,o:.8}],
 [A.end+.8,{x:540,y:900,w:600,h:780,n:9,rot:0,o:.9}],[A.manda-.4,{x:540,y:900,w:600,h:780,n:9,rot:0,o:.9}],[A.manda+.4,{x:540,y:1250,w:560,h:130,n:7,rot:0,o:1}],[40,{x:540,y:1250,w:580,h:136,n:7,rot:0,o:1}]];
const MKEYS=MK();
// ---------- câmera ----------
const CK=[[0,{rx:0,ry:0,z:-260,x:0,y:0}],[A.olha,{rx:0,ry:0,z:0,x:0,y:0}],[A.olha+.9,{rx:9,ry:-14,z:90,x:0,y:0}],[A.v1+.6,{rx:5,ry:10,z:0,x:0,y:0}],
 [A.aprox+.9,{rx:0,ry:-6,z:170,x:0,y:0}],[A.whats+.6,{rx:3,ry:4,z:120,x:0,y:0}],[A.v2+.5,{rx:14,ry:0,z:-120,x:0,y:0}],[A.pix+.4,{rx:8,ry:14,z:-20,x:0,y:0}],
 [A.v3+.5,{rx:0,ry:-10,z:40,x:0,y:0}],[A.link+.5,{rx:2,ry:10,z:140,x:0,y:0}],[A.v4+.6,{rx:6,ry:12,z:20,x:230,y:0}],[A.qr-.3,{rx:4,ry:8,z:60,x:230,y:0}],
 [A.qr+.5,{rx:4,ry:-10,z:60,x:-230,y:0}],[A.end+.6,{rx:0,ry:0,z:-60,x:0,y:0}],[A.manda,{rx:-3,ry:0,z:30,x:0,y:-60}],[40,{rx:-4,ry:0,z:110,x:0,y:-60}]];
function place(el,x,y,z,rx,ry,rz,s,o,w,h){el.style.transform=`translate3d(${x-w/2}px,${y-h/2}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;el.style.opacity=o;el.style.display=o<=0.001?'none':'block';}
function scr(id,t0,t1,t){const e=$(id);e.style.opacity=ss(t0,t0+.25,t)*(1-ss(t1,t1+.25,t));}
// ---------- quadro ----------
window.renderFrame=function(f){const t=f/FPS;
 const c=keys(CK,t);const hx=Math.sin(f*.037)*5+Math.sin(f*.091)*2,hy=Math.cos(f*.029)*6;

 $('floor').style.transform=`rotateX(82deg) translateZ(-40px) translateY(${(f*1.6)%120}px)`;
 PT.forEach((q,i)=>{const e=$('pts').children[i];const y=((q[1]-f*1.2*q[3])%2600+2600)%2600-340;e.style.transform=`translate3d(${q[0]}px,${y}px,${q[2]}px)`;e.style.opacity=.25+.55*(.5+.5*Math.sin(f*.05*q[3]+i));});
 // morph
 const m=keys(MKEYS,t);$('mp').setAttribute('d',shape(m));$('mp').style.opacity=m.o*(m.w>2?1:0);
 // placa
 const pin=eb(p(t,A.olha-.2,A.olha+.5)), pout=ss(A.v2-.1,A.v2+.4,t), pret=eb(p(t,A.end+.1,A.end+.9));

 // anéis NFC: na abertura e no toque
