function bez(x1,y1,x2,y2){ return x=>{ x=cl(x); if(x<=0||x>=1)return x; let a=0,b=1,u=x; for(let i=0;i<28;i++){u=(a+b)/2; const X=3*(1-u)*(1-u)*u*x1+3*(1-u)*u*u*x2+u*u*u; if(X<x)a=u; else b=u;}

 {lines:['A placa pede','por <k>você.</k>'],y:[420,520],a:14.85,b:15.95},
 {lines:['Funciona em','<k>qualquer</k> celular.'],y:[420,520],a:16.05,b:18.8},

     html+=`<span class="w" id="${id}">${inner}${k<ws.length-1?' ':''}</span>`; WORDS.push({id,a:p.a+wi*.08,b:p.b+wi*.035}); EV.push(['tick',p.a+wi*.08]); wi++; });

order.forEach((mi,r)=>MODS[mi].ta=17.4+r/MODS.length*1.05);

function dash(el,p){ el.style.strokeDasharray='1 1'; el.style.strokeDashoffset=(1-cl(p)).toFixed(4); el.style.opacity=p>0?1:0; }

  const n=TK.filter(x=>t>=x).length-DEL.filter(x=>t>=x).length; const tx=$('typed'); tx.textContent=TYPED.slice(0,Math.max(0,n));
  const tw_=tx.offsetWidth, x0=540-(window.FULLW||400)/2; const ty=seg(t,.85,1.1)*(1-seg(t,2.65,2.95));

  const cr=$('caret'); cr.style.left=(x0+tw_+6)+'px'; cr.style.top=(970-40)+'px'; cr.style.opacity=(t>.9&&t<2.85?blink:0)*ty;
  // placa (com leve vida em 3D) e sombra de contato
  const pl=tw(t,PL0,PK); const sway=t>4.45&&t<8.2?Math.sin((t-4.45)*1.3)*3.2*seg(t,4.45,5.2):0;
  const pw=pl.h*928/1647; const P=$('plate'); Object.assign(P.style,{width:pw+'px',height:pl.h+'px',left:(pl.x-pw/2)+'px',top:(pl.y-pl.h/2)+'px',opacity:pl.o,
