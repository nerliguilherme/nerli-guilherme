<canvas id="c" width="1440" height="1152"></canvas>
<div id="ov"><div id="badge"><img src="tile.png">Ngraph</div><div class="line" id="l1"></div><div class="line" id="l2"></div></div>
<script>
// =====================================================================================
// Voo 3D sobre ngraph.com.br — cada quadro é função pura do tempo: seek(t) / renderFrame(f, N).
// Sem timers, sem transições CSS, sem aleatório (hash determinístico).
// Mundo: X = direita da página, Y = para baixo na página, Z = para cima (altura). Unidade = px CSS da página.
// =====================================================================================
const LY=window.LAYERS, PW=1440, PH=LY.H, W=1440, H=1152, FL=1880, DEG=Math.PI/180;
const LINE1='Sua marca merece ser vista.', LINE2='de dia e de noite.';
const HAZE=[0xf6/255,0xf8/255,0xf9/255];
const cl=x=>Math.max(0,Math.min(1,x)), ss=(a,b,x)=>{const k=cl((x-a)/(b-a));return k*k*(3-2*k);}, lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}, qio=x=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;};
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
// ---------------- curva de velocidade (fração da velocidade de cruzeiro) ----------------
function share(t){if(t<=0)return 0;if(t<.6)return .5*ss(0,.6,t);if(t<1.25)return .5;if(t<1.6)return .5+.5*ss(1.25,1.6,t);
  if(t<7.3)return 1+.03*Math.sin((t-1.6)/5.7*Math.PI);/* entre 1.0 e 1.03, dentro de 0.94–1.1 */ if(t<8.3)return 1-.88*ss(7.3,8.3,t);return .12;}
const DT=1/4000, TMAX=15; const INT=new Float64Array(Math.ceil(TMAX/DT)+2);
for(let i=1;i<INT.length;i++){const t=(i-.5)*DT;INT[i]=INT[i-1]+share(t)*DT;}
const I=t=>{const x=cl(t/TMAX)*(INT.length-2)/1,i=Math.floor(t/DT);const f=t/DT-i;return lerp(INT[Math.min(i,INT.length-1)],INT[Math.min(i+1,INT.length-1)],f);};
const SEC=Object.fromEntries(LY.sections.map(s=>[s.id,s]));
const Y0=300;                                   // olhando a metade de cima do hero
const YFOOT=SEC.contato.title_y;                // título do rodapé nítido em 8.0s
const V=(YFOOT-Y0)/I(8.0);                      // velocidade de cruzeiro (px da página / s)
const dFlight=t=>1360+340*eo(Math.min(t,8.2)/8.2);
// ---------------- câmera ----------------
function basis(th){return {R:[1,0,0],U:[0,-Math.cos(th),Math.sin(th)],F:[0,-Math.sin(th),-Math.cos(th)]};}
function proj(P,c){const b=basis(c.th);const C=camPos(c);const v=[P[0]-C[0],P[1]-C[1],P[2]-C[2]];const zc=v[0]*b.F[0]+v[1]*b.F[1]+v[2]*b.F[2];
  return [720+FL*(v[0]*b.R[0])/zc, 576-FL*(v[1]*b.U[1]+v[2]*b.U[2])/zc, zc];}
function camPos(c){const b=basis(c.th);return [c.lx-b.F[0]*c.d, c.ly-b.F[1]*c.d, -b.F[2]*c.d];}
function solveBottom(d,th,target){let a=-20000,bq=40000;for(let k=0;k<60;k++){const m=(a+bq)/2;const y=proj([720,PH,0],{lx:720,ly:m,d,th})[1];if(y>target)a=m;else bq=m;}return (a+bq)/2;}
// rampa trapezoidal da subida (7.75–9.25), integrada e normalizada
function trap(t){if(t<7.75)return 0;if(t<8.35)return ss(7.75,8.35,t);if(t<8.95)return 1;if(t<9.25)return 1-ss(8.95,9.25,t);return 0;}
const TRI=(()=>{const n=3000,a=new Float64Array(n+1);for(let i=1;i<=n;i++){const t=7.75+(i-.5)/n*1.5;a[i]=a[i-1]+trap(t);}for(let i=0;i<=n;i++)a[i]/=a[n];return a;})();
const U=t=>{if(t<=7.75)return 0;if(t>=9.25)return 1;const x=(t-7.75)/1.5*3000,i=Math.floor(x);return lerp(TRI[i],TRI[Math.min(i+1,3000)],x-i);};
const S_OV=(H-84)/PH, D_OV=FL/S_OV, S_CARD=1018/PW;
function cam(t){
 const glideY=Y0+V*I(t);
 if(t<7.75)return {lx:720,ly:glideY,d:dFlight(t),th:56*DEG,ph:'voo'};
 if(t<9.25){const th=56*DEG*(1-ss(8.15,8.95,t));const ld=Math.log(dFlight(t))+U(t)*(Math.log(D_OV)-Math.log(dFlight(9.25)));const d=Math.exp(ld);
   const w=ss(8.3,8.65,t);const ly=w>0?lerp(glideY,solveBottom(d,th,H-42),w):glideY;return {lx:720,ly,d,th,ph:'subida'};}
 if(t<9.47){const s=S_OV*(1+.035*eio((t-9.25)/.22));return {lx:720,ly:PH/2,d:FL/s,th:0,ph:'visao'};}
 const s1=S_OV*1.035, yTop0=576-(PH/2)*s1;
 if(t<9.97){const k=(t-9.47)/.5;const s=Math.exp(lerp(Math.log(s1),Math.log(S_CARD),qio(k)));const yTop=lerp(yTop0,283,ss(9.70,9.97,t));
   return {lx:720,ly:(576-yTop)/s,d:FL/s,th:0,ph:'mergulho'};}
 const s=S_CARD*(1+.02*eio((t-9.97)/4.53));const cy=283+776*S_CARD/2;return {lx:720,ly:776/2-(cy-576)/s,d:FL/s,th:0,ph:'cartao'};
}
// ---------------- peças: altura z, inclinação a (graus), alpha e névoa ----------------
const P=LY.layers.filter(l=>l.id!=='work12').map((l,i)=>Object.assign({},l,{i,cx:l.x+l.w/2,cy:l.y+l.h/2}));
const HERO_IDS=['hero_chip','hero_btn0','hero_btn1','hero_img'];
function lift(p,t,c){let z=0,a=0;
 const k=(a0,b0)=>eio((t-a0)/(b0-a0));
 switch(p.kind){
  case 'chip': if(p.id.startsWith('hero')){const kk=k(.1,1.35);z=(p.id=='hero_chip'?60:p.id=='hero_btn0'?80:70)*kk;a=30*kk;} else {const kk=prox(p,c);z=30*kk;a=25*kk;} break;
  case 'mock': z=24*k(0,1.0); break;
  case 'photo': {const kk=k(1.35,2.7);z=(100+30*hash(p.i))*kk;a=46*kk;} break;
  case 'fly': {const kk=k(1.35,2.5);z=200*kk;a=54*kk;} break;
  case 'testimonial': {const pre=prox(p,c);const kk=k(5.45,6.3);z=22*pre+90*kk;a=30*kk;} break;
  case 'card': case 'work': case 'info': {if(/^(serv0|work0)$/.test(p.id))break;const kk=prox(p,c);z=(20+20*hash(p.i+3))*kk;a=(p.kind=='info'?10:6+14*hash(p.i+9))*kk;} break;
 }
 if(p.id=='sobre0'){z=0;a=0;}
 // peças do hero assentam antes do mergulho (viram parte do cartão)
 if(HERO_IDS.includes(p.id)){const st=ss(8.4,9.4,t);z*=1-.92*st;a*=1-st;}
 // fora do hero: no mergulho, primeiro vai para a cor da névoa, só no fim fica transparente
 let haze=0,alpha=1;if(!HERO_IDS.includes(p.id)){haze=ss(9.47,9.78,t);alpha=1-ss(9.80,9.97,t);}
 return {z,a,haze,alpha};}
function prox(p,c){return eio((c.ly+1500-p.cy)/900);}  // sobe quando a peça se aproxima da lente (vinda de baixo)
// ---------------- ladrilhos da logo ----------------
function tiles(t,c){const out=[];const b=basis(c.th),C=camPos(c);
 const camRel=(x,y,dep)=>[C[0]+b.F[0]*dep+b.R[0]*x+b.U[0]*y, C[1]+b.F[1]*dep+b.R[1]*x+b.U[1]*y, C[2]+b.F[2]*dep+b.R[2]*x+b.U[2]*y];
 if(t<3.2){const st=[[592,636],[632,636],[672,636],[712,636]];const en=[[-110,90,240,200],[-70,330,170,140],[1550,70,250,190],[1500,320,190,160]];
  st.forEach((s,i)=>{const k=eio((t-.1-i*.05)/1.25);const tr=ss(1.2,2.4,t);const e=en[i];
   out.push({p:[lerp(s[0],e[0],k),lerp(s[1],e[1],k)+300*tr,lerp(2,e[2],k)+Math.sin(t*1.3+i)*6*k],s:lerp(32,e[3],k),a:1});});}
 if(t>4.7&&t<6.2){const k=(t-4.7)/1.5;const dep=520;out.push({p:camRel(lerp(-90,-620,k)*dep/FL*1.0*2.2,lerp(-60,120,k)*dep/FL*2.2,dep),s:170,a:1});}
 if(t>9.55){const k=ss(9.55,9.97,t);const s=FL/c.d;const toW=(sx,sy,z)=>[c.lx+(sx-720)/s,c.ly+(sy-576)/s,z];
  const hold=t-9.97,dx=i=>Math.sin(hold*.6+i)*3/s,dy=i=>Math.cos(hold*.5+i)*3/s;
  const cardL=720-509,cardR=720+509;
  [[cardL+6,290,64],[cardR-6,290,64],[1352,650,86]].forEach((q,i)=>{const w=toW(q[0],q[1],8);out.push({p:[w[0]+dx(i),w[1]+dy(i),40],s:q[2]/s,a:k,haze:1-k});});
  [[-150,980],[1590,1010]].forEach((q,i)=>{const dep=380;const kk=ss(9.75,10.6,t);const x=(q[0]-720)*dep/FL+lerp(i?140:-140,0,kk),y=(576-q[1])*dep/FL;
   out.push({p:camRel(x,y,dep),s:160,a:kk,haze:1-kk});});}
 return out;}
// =====================================================================================
// WebGL2
// =====================================================================================
const cv=document.getElementById('c');const gl=cv.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true,premultipliedAlpha:false});
gl.getExtension('EXT_color_buffer_float');gl.getExtension('EXT_float_blend');gl.getExtension('OES_texture_float_linear');
const ANI=gl.getExtension('EXT_texture_filter_anisotropic');
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);return p;}
const VS=`#version 300 es
in vec3 aP; in vec2 aT; uniform vec3 C,R,Uu,Fw; uniform float FL;
out vec2 vT; out float vD; out vec3 vW;
void main(){vec3 v=aP-C; float zc=dot(v,Fw); gl_Position=vec4(FL*dot(v,R)/720.0, FL*dot(v,Uu)/576.0, 0.0, zc); vT=aT; vD=zc; vW=aP;}`;
const FS=`#version 300 es
precision highp float; in vec2 vT; in float vD; in vec3 vW;
uniform sampler2D tex; uniform int mode; uniform float alpha,haze,lod,y0p; uniform vec3 hazeC;
uniform vec4 mrect; uniform float mrad, fadeBelow; uniform vec2 psize; uniform float prad;
layout(location=0) out vec4 oC; layout(location=1) out vec4 oD;
float rbox(vec2 p, vec2 b0, vec2 b1, float r){vec2 c=(b0+b1)*.5, h=(b1-b0)*.5-r; vec2 q=abs(p-c)-h; return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r;}
void main(){ vec4 col=vec4(0);
 if(mode==0){ // página
   col=texture(tex,vT); vec2 p=vW.xy; float sd=rbox(p,mrect.xy,mrect.zw,mrad); float m=1.0-smoothstep(-0.8,0.8,sd);
   float fb=(p.y>776.0)?fadeBelow:0.0; col.rgb=mix(col.rgb,hazeC,fb); col=vec4(col.rgb,1.0)*m;
 } else if(mode==1){ // peça (borda arredondada própria vem da captura)
   col=texture(tex,vT); col.rgb=mix(col.rgb,hazeC*col.a,haze); col*=alpha;
 } else if(mode==2){ // sombra da peça
   float a=textureLod(tex,vT,lod).a; col=vec4(vec3(0.102,0.129,0.2)*a*0.26*alpha, a*0.26*alpha);
 } else if(mode==3){ // sombra larga e macia da página
   float sd=rbox(vW.xy-vec2(0.0,22.0),mrect.xy,mrect.zw,mrad); float a=0.13*(1.0-smoothstep(-30.0,150.0,sd)); col=vec4(vec3(0.102,0.129,0.2)*a,a);
 } else if(mode==4){ // borda branca do depoimento
   vec2 p=vT*psize; float sd=rbox(p,vec2(28.0),psize-28.0,prad); float a=(1.0-smoothstep(-0.8,0.8,sd))*alpha; col=vec4(mix(vec3(1.0),hazeC,haze)*a,a);
 } else { // ladrilho
   col=texture(tex,vT); col.rgb=mix(col.rgb,hazeC*col.a,haze); col*=alpha;
 }
 oC=col; oD=vec4(vD*col.a,0.0,0.0,col.a);
}`;
const FSQ_VS=`#version 300 es
in vec2 aP; out vec2 vU; void main(){vU=aP*.5+.5; gl_Position=vec4(aP,0,1);}`;
const FLOOR_FS=`#version 300 es
precision highp float; in vec2 vU; uniform vec3 C,R,Uu,Fw; uniform float FL;
layout(location=0) out vec4 oC; layout(location=1) out vec4 oD;
void main(){ vec2 px=vec2(vU.x*1440.0,(1.0-vU.y)*1152.0); float r=length((px-vec2(720.0,576.0))/vec2(720.0,576.0))/1.4142;
 vec3 c=mix(vec3(0.976,0.984,0.984),vec3(0.949,0.953,0.965),smoothstep(0.0,1.0,r));
 vec3 dir=Fw+((px.x-720.0)/FL)*R+((576.0-px.y)/FL)*Uu; float tt=dir.z<-1e-4?-C.z/dir.z:1e5; oC=vec4(c,1.0); oD=vec4(min(tt*dot(dir,Fw),6e4),0,0,1);}`;
const ACC_FS=`#version 300 es
precision highp float; in vec2 vU; uniform sampler2D tex; uniform float w; out vec4 o; void main(){o=texture(tex,vU)*w;}`;
const DOF_FS=`#version 300 es
precision highp float; in vec2 vU; uniform sampler2D col,dep; uniform float focus; out vec4 o;
float coc(float d){ return d<focus ? min(120.0,75.0*(focus-d)/max(d,1.0)) : min(120.0,6.0*(d-focus)/max(d,1.0)); }
void main(){ vec2 res=vec2(1440.0,1152.0); float d=texture(dep,vU).r; float r=coc(d);
 if(r<0.6){ o=vec4(textureLod(col,vU,0.0).rgb,1.0); return; }
 float lod=log2(max(1.0,r/3.2)); vec3 acc=vec3(0.0);
 for(int i=0;i<40;i++){ float fi=float(i)+0.5; float rr=r*sqrt(fi/40.0); float a=fi*2.39996323; acc+=textureLod(col,vU+vec2(cos(a),sin(a))*rr/res,lod).rgb; }
 o=vec4(acc/40.0,1.0); }`;
const PG=prog(VS,FS), PF=prog(FSQ_VS,FLOOR_FS), PA=prog(FSQ_VS,ACC_FS), PD=prog(FSQ_VS,DOF_FS);
// geometria
const qbuf=gl.createBuffer(), fsbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,fsbuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const vao=gl.createVertexArray(), fvao=gl.createVertexArray();
gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,qbuf);const lP=gl.getAttribLocation(PG,'aP'),lT=gl.getAttribLocation(PG,'aT');
gl.enableVertexAttribArray(lP);gl.vertexAttribPointer(lP,3,gl.FLOAT,false,20,0);gl.enableVertexAttribArray(lT);gl.vertexAttribPointer(lT,2,gl.FLOAT,false,20,12);
gl.bindVertexArray(fvao);gl.bindBuffer(gl.ARRAY_BUFFER,fsbuf);for(const p of [PF,PA,PD]){const l=gl.getAttribLocation(p,'aP');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,8,0);}
// texturas
function texFrom(img){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.generateMipmap(gl.TEXTURE_2D);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 if(ANI)gl.texParameterf(gl.TEXTURE_2D,ANI.TEXTURE_MAX_ANISOTROPY_EXT,16);return t;}
function rt(fmt,type,mip){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texStorage2D(gl.TEXTURE_2D,mip?11:1,fmt,W,H);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,mip?gl.LINEAR_MIPMAP_LINEAR:gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,mip?gl.LINEAR:gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
const sceneC=rt(gl.RGBA16F,0,false), sceneD=rt(gl.RGBA16F,0,false), accC=rt(gl.RGBA16F,0,true);
const fbS=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbS);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,sceneC,0);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT1,gl.TEXTURE_2D,sceneD,0);
const fbA=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbA);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,accC,0);
const T={};
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(src);i.src=src;});
window.ready=(async()=>{T.page0=texFrom(await loadImg('page_0.png'));T.page1=texFrom(await loadImg('page_1.png'));T.tile=texFrom(await loadImg('tile.png'));
 for(const p of P){T[p.id]=texFrom(await loadImg('pieces/'+p.id+'.png'));} await document.fonts.ready; buildTitle(); return true;})();
// desenho
function uni(p,c){const b=basis(c.th),C=camPos(c);gl.useProgram(p);gl.uniform3fv(gl.getUniformLocation(p,'C'),C);gl.uniform3fv(gl.getUniformLocation(p,'R'),b.R);
 gl.uniform3fv(gl.getUniformLocation(p,'Uu'),b.U);gl.uniform3fv(gl.getUniformLocation(p,'Fw'),b.F);gl.uniform1f(gl.getUniformLocation(p,'FL'),FL);}
const u=(n)=>gl.getUniformLocation(PG,n);
function quad(c0,c1,c2,c3){ // cantos: sup-esq, sup-dir, inf-dir, inf-esq (x,y,z,u,v)
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([...c0,...c1,...c2,...c0,...c2,...c3]),gl.DYNAMIC_DRAW);gl.drawArrays(gl.TRIANGLES,0,6);}
function setMode(m,o){gl.uniform1i(u('mode'),m);gl.uniform1f(u('alpha'),o.alpha??1);gl.uniform1f(u('haze'),o.haze??0);gl.uniform1f(u('lod'),o.lod??0);}
function drawScene(t){
 const c=cam(t);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,null);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,T.tile);
 gl.bindFramebuffer(gl.FRAMEBUFFER,fbS);gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);gl.viewport(0,0,W,H);gl.disable(gl.BLEND);
 uni(PF,c);gl.bindVertexArray(fvao);gl.drawArrays(gl.TRIANGLES,0,3);
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
 uni(PG,c);gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,qbuf);gl.uniform1i(u('tex'),0);gl.activeTexture(gl.TEXTURE0);gl.uniform3fv(u('hazeC'),HAZE);
 // máscara: página inteira -> hero (mergulho)
 const km=ss(9.47,9.97,t);const mrect=[0,0,PW,lerp(PH,776,eio(km))];const mrad=lerp(24,38/S_CARD,km);
 gl.uniform4fv(u('mrect'),mrect);gl.uniform1f(u('mrad'),mrad);gl.uniform1f(u('fadeBelow'),ss(9.47,9.80,t));
 // sombra larga da página
 setMode(3,{});const e=200;quad([mrect[0]-e,mrect[1]-e,0,0,0],[mrect[2]+e,mrect[1]-e,0,1,0],[mrect[2]+e,mrect[3]+e,0,1,1],[mrect[0]-e,mrect[3]+e,0,0,1]);
 // página (duas faixas)
 setMode(0,{});const hh=PH/2;
 gl.bindTexture(gl.TEXTURE_2D,T.page0);quad([0,0,0,0,0],[PW,0,0,1,0],[PW,hh,0,1,1],[0,hh,0,0,1]);
 gl.bindTexture(gl.TEXTURE_2D,T.page1);quad([0,hh,0,0,0],[PW,hh,0,1,0],[PW,PH,0,1,1],[0,PH,0,0,1]);
 // peças
 const pad=LY.pad;const items=P.map(p=>({p,L:lift(p,t,c)})).filter(o=>o.L.alpha>0.002);
 const vis=o=>{const y=o.p.y,k=c.d/1500;return y<c.ly+3800*k&&y+o.p.h>c.ly-2600*k-200;};
 const list=items.filter(o=>c.th<.01||vis(o));
 for(const o of list){const p=o.p,L=o.L;if(L.z<.5)continue;const b=7+.5*L.z;const ox=.10*L.z,oy=4+.36*L.z;
  gl.bindTexture(gl.TEXTURE_2D,T[p.id]);setMode(2,{alpha:L.alpha*(1-L.haze),lod:Math.log2(Math.max(1,b*2/1.6))});
  const x0=p.x-pad+ox,y0=p.y-pad+oy,x1=p.x+p.w+pad+ox,y1=p.y+p.h+pad+oy;quad([x0,y0,.2,0,0],[x1,y0,.2,1,0],[x1,y1,.2,1,1],[x0,y1,.2,0,1]);}
 list.sort((a,b)=>a.L.z-b.L.z);
 for(const o of list){const p=o.p,L=o.L;const a=L.a*DEG,cs=Math.cos(a),sn=Math.sin(a);const hw=p.w/2+pad,hh2=p.h/2+pad;
  const V3=(uu,vv)=>[p.cx+uu,p.cy+vv*cs,L.z-vv*sn];
  if(p.kind=='testimonial'){const zz=Math.max(0,L.z-34);const W3=(uu,vv)=>[p.cx+uu,p.cy+vv*cs+3,zz-vv*sn];
    setMode(4,{alpha:L.alpha,haze:L.haze});gl.uniform2fv(u('psize'),[p.w+2*pad,p.h+2*pad]);gl.uniform1f(u('prad'),24);
    quad([...W3(-hw,-hh2),0,0],[...W3(hw,-hh2),1,0],[...W3(hw,hh2),1,1],[...W3(-hw,hh2),0,1]);}
  gl.bindTexture(gl.TEXTURE_2D,T[p.id]);setMode(1,{alpha:L.alpha,haze:L.haze});
  quad([...V3(-hw,-hh2),0,0],[...V3(hw,-hh2),1,0],[...V3(hw,hh2),1,1],[...V3(-hw,hh2),0,1]);}
 // ladrilhos (sempre de frente para a lente), do mais longe para o mais perto
 const b=basis(c.th),C=camPos(c);const tl=tiles(t,c).map(q=>{const v=[q.p[0]-C[0],q.p[1]-C[1],q.p[2]-C[2]];return Object.assign(q,{dep:v[0]*b.F[0]+v[1]*b.F[1]+v[2]*b.F[2]});}).sort((a,b)=>b.dep-a.dep);
 gl.bindTexture(gl.TEXTURE_2D,T.tile);
 for(const q of tl){if(q.a<=0.002)continue;setMode(5,{alpha:q.a,haze:q.haze||0});const s=q.s/2;
  const pt=(x,y)=>[q.p[0]+b.R[0]*x+b.U[0]*y,q.p[1]+b.R[1]*x+b.U[1]*y,q.p[2]+b.R[2]*x+b.U[2]*y];
  quad([...pt(-s,s),0,0],[...pt(s,s),1,0],[...pt(s,-s),1,1],[...pt(-s,-s),0,1]);}
 return c;}
function accumulate(w){gl.bindFramebuffer(gl.FRAMEBUFFER,fbA);gl.drawBuffers([gl.COLOR_ATTACHMENT0]);gl.viewport(0,0,W,H);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
 gl.useProgram(PA);gl.bindVertexArray(fvao);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneC);gl.uniform1i(gl.getUniformLocation(PA,'tex'),0);gl.uniform1f(gl.getUniformLocation(PA,'w'),w);gl.drawArrays(gl.TRIANGLES,0,3);}
// foco: profundidade do que cruza o meio do quadro
function focusAt(c){return c.d;}
// tipografia do cartão final (HTML, também função do tempo)
let W1=[],W2=[];
function buildTitle(){const l1=document.getElementById('l1'),l2=document.getElementById('l2');
 l1.innerHTML=LINE1.split(' ').map(w=>`<span class="wd">${w}</span>`).join(' ');l2.innerHTML=LINE2.split(' ').map(w=>`<span class="wd">${w}</span>`).join(' ');
 W1=[...l1.children];W2=[...l2.children];}
function overlay(t){const bd=document.getElementById('badge');bd.style.opacity=ss(10.02,10.32,t);
 const word=(el,t0)=>{const k=cl((t-t0)/.34);const e=1-Math.pow(1-k,3);el.style.opacity=k>0?Math.min(1,k*1.6):0;el.style.transform=`translateY(${(1-e)*16}px)`;el.style.filter=`blur(${(1-e)*12}px)`;};
 W1.forEach((w,i)=>word(w,10.12+i*.06));W2.forEach((w,i)=>word(w,10.36+i*.05));}
// ---------------- API: seek(t) e renderFrame(f, N) ----------------
window.seek=function(t,N=1,shutter=0.7/60){
 gl.bindFramebuffer(gl.FRAMEBUFFER,fbA);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
 const order=[];for(let k=0;k<N;k++)order.push(k);const mid=Math.floor((N-1)/2);order.splice(order.indexOf(mid),1);order.push(mid); // o subquadro central por último (fornece a profundidade)
 let c;for(const k of order){const tk=N>1?t+(k/(N-1)-.5)*shutter:t;c=drawScene(Math.max(0,tk));accumulate(1/N);}
 gl.bindTexture(gl.TEXTURE_2D,accC);gl.generateMipmap(gl.TEXTURE_2D);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.disable(gl.BLEND);gl.useProgram(PD);gl.bindVertexArray(fvao);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,accC);gl.uniform1i(gl.getUniformLocation(PD,'col'),0);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,sceneD);gl.uniform1i(gl.getUniformLocation(PD,'dep'),1);
 gl.uniform1f(gl.getUniformLocation(PD,'focus'),focusAt(cam(t)));gl.drawArrays(gl.TRIANGLES,0,3);gl.activeTexture(gl.TEXTURE0);
 overlay(t);gl.finish();return cam(t);};
window.renderFrame=(f,N,fps=60)=>seek(f/fps,N);
window.camInfo=t=>cam(t);
