[[M.cinco,'pop'],[M.um+.3,'toggle'],[M.dois+.6,'tick'],[M.marcou,'swoosh'],[M.manda,'swoosh'],[M.enigrafi,'chime']].forEach(([t,k])=>EV.push([k,t]));

function seek(t){
