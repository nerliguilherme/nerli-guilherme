<script>
const T=51.5;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,x)=>a+(b-a)*x;
function bez(x1,y1,x2,y2){ return x=>{ x=cl(x); if(x<=0||x>=1)return x; let a=0,b=1,u=x; for(let i=0;i<28;i++){u=(a+b)/2; const X=3*(1-u)*(1-u)*u*x1+3*(1-u)*u*u*x2+u*u*u; if(X<x)a=u; else b=u;}
  return 3*(1-u)*(1-u)*u*y1+3*(1-u)*u*u*y2+u*u*u; }; }
const EZ=bez(.65,0,.35,1), seg=(t,a,b)=>EZ((t-a)/(b-a));
const win=(t,a,b,din=.4,dout=.3)=>seg(t,a,a+din)*(1-seg(t,b,b+dout));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
let cur=0; const at=w=>{ for(let i=cur;i<WORDS.length;i++) if(norm(WORDS[i][0])===norm(w)){cur=i+1;return WORDS[i][1];} throw 'palavra: '+w; };
const EV=[]; function dash(el,p){ el.style.strokeDasharray='1 1'; el.style.strokeDashoffset=(1-cl(p)).toFixed(4); el.style.opacity=p>0?1:0; }
function fe(el,o,dy=20,pre=''){ el.style.opacity=o.toFixed(3); el.style.visibility=o>.001?'visible':'hidden'; el.style.transform=`${pre} translateY(${((1-o)*dy).toFixed(2)}px) scale(${(.96+.04*o).toFixed(4)})`; }
const hexmix=(a,b,x)=>{const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const A=p(a),B=p(b); return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],x)).toString(16).padStart(2,'0')).join('');};
// ---------- legendas: cada palavra entra quando é falada ----------
const CAPS=[
 ['Sua','fachada','<k>espanta</k>|espantando','cliente?|cliente'],['<k>5</k>|cinco','sinais'],

 ['Cor|cor','<k>desbotada</k>|desbotada'],['Parece|passa','<k>abandonada</k>|abandonada'],
 ['Não|nao','lê|ler','de','<k>longe</k>|longe'],['Letra|letra','fina?|fina','<k>Ninguém</k>|ninguem','lê|le'],
 ['Informação|informacao','<k>demais</k>|demais'],['Só|carro','o|o','<k>nome</k>|nome'],
 ['Logo|logo','≠|diferente','<k>Instagram</k>|instagram'],['Não|nao','te|reconhece','<k>reconhece</k>|@0.18'],
 ['Marcou|marcou','<k>dois</k>|dois','ou','mais?|mais'],['Manda|manda','uma','<k>foto</k>|foto'],
 ['A|a','gente','diz|diz','o','que','<k>melhorar</k>|melhorar'],['Sua|sua','marca','merece','ser','<k>vista.</k>|vista']];
const CW=[]; let h=''; let prevT=0;
CAPS.forEach((ln,li)=>{ h+=`<div class="cap" id="cap${li}">`; ln.forEach((w,wi)=>{ const [d,anc]=w.split('|'); const txt=d.replace(/<\/?k>/g,'');
  let t; if(anc&&anc[0]=='@') t=prevT+(+anc.slice(1)); else t=at(anc||txt); prevT=t;
  const id=`c${li}_${wi}`; h+=`<span class="w" id="${id}">${d.replace('<k>','<span class="k">').replace('</k>','</span>')}${wi<ln.length-1?' ':''}</span>`;
  CW.push({id,li,a:t}); if(d.includes('<k>'))EV.push(['tick',t]); }); h+='</div>'; });
$('caps').innerHTML=h;
const LS=CAPS.map((_,li)=>Math.min(...CW.filter(c=>c.li==li).map(c=>c.a)));
const LX=CAPS.map((_,li)=>Math.max(...CW.filter(c=>c.li==li).map(c=>c.a)));
const LE=LS.map((s,i)=>i<LS.length-1?Math.min(LS[i+1]-.28,LX[i]+.75):99);
// ---------- marcos ----------
cur=0; const M={}; [['cinco','cinco'],['primeiro','primeiro'],['escurece','escurece'],['some','some'],['segundo','segundo'],['desbotada','desbotada'],['soltando','soltando'],
 ['terceiro','terceiro'],['longe','longe'],['contraste','contraste'],['ninguem','ninguem'],['quarto','quarto'],['demais','demais'],['carro','carro'],['nome','nome'],
 ['quinto','quinto'],['diferente','diferente'],['reconhece','reconhece'],['marcou','marcou'],['foto','foto'],['melhorar','melhorar'],['enigrafi','enigrafi'],['vista','vista']].forEach(([k,w])=>M[k]=at(w));
cur=0; [['some','some'],['abandonada','abandonada'],['ninguem','ninguem'],['so','so'],['voce','voce']].forEach(([k,w])=>M['e_'+k]=at(w));
// ---------- fotos de solução ----------
const SOL=(k,n)=>({a:M['e_'+k]+.35,b:n-.25});
const PROB=[{img:'p1_apagada.jpg',a:M.primeiro+.2,b:M.e_some+.35},{img:'p2_desbotada.jpg',a:M.segundo+.2,b:M.e_abandonada+.35},
 {img:'p3_ilegivel.jpg',a:M.terceiro+.2,b:M.e_ninguem+.55},{img:'p4_lotada.jpg',a:M.quarto+.2,b:M.e_so+.35},{img:'p5_logo.jpg',a:M.quinto+.2,b:M.e_voce+.35,h:484,y:520}];
const CARDS=[
 {img:'s1_weyne.jpg',x:110,y:420,w:860,h:700,...SOL('some',M.segundo),tag:'Weyne Modas'},
 {img:'s2_cavalcantis.jpg',x:110,y:420,w:860,h:700,...SOL('abandonada',M.terceiro),tag:"Pizzaria Cavalcanti's"},
 {img:'s3_friopecas.jpg',x:110,y:420,w:860,h:700,a:M.e_ninguem+.55,b:M.quarto-.25,tag:'Frio Peças'},
 {img:'s4_ridente.jpg',x:110,y:420,w:860,h:700,...SOL('so',M.quinto),tag:'Ridente'},
 {img:'s5_rei_arte.jpg',x:110,y:410,w:860,h:262,a:M.e_voce+.35,b:M.marcou-.25},
 {img:'s5_rei_placa.jpg',x:110,y:712,w:860,h:440,a:M.e_voce+.6,b:M.marcou-.25,tag:'O Rei da Pizza'},
 {img:'c_dm_inst.jpg',x:100,y:430,w:420,h:560,a:M.foto-.1,b:M.melhorar-.95},{img:'c_dm_pronta.jpg',x:560,y:430,w:420,h:560,a:M.foto+.35,b:M.melhorar-.95},
 {img:'c_frio_inst.jpg',x:100,y:430,w:420,h:560,a:M.melhorar-.6,b:M.enigrafi-.35},{img:'c_frio_pronta.jpg',x:560,y:430,w:420,h:560,a:M.melhorar-.15,b:M.enigrafi-.35}];
$('cards').innerHTML=PROB.map((p,i)=>`<div class="card" id="pb${i}" style="left:110px;top:${p.y||420}px;width:860px;height:${p.h||700}px"><img id="pbi${i}" src="img/${p.img}"></div>
  <div class="tag" id="pt${i}" style="top:${(p.y||420)+(p.h||700)+34}px"><i style="background:#B91C1C"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></i>Assim não</div>`).join('')+CARDS.map((c,i)=>`<div class="card" id="cd${i}" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px"><img src="img/${c.img}"></div>`+
  (c.tag?`<div class="tag" id="tg${i}" style="top:${c.y+c.h+34}px"><i><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>${i<6?'Feito pela Ngraph · ':''}${c.tag}</div>`:'')).join('')+
  `<div class="mini" id="mi0" style="left:100px;top:1010px">Instalando</div><div class="mini" id="mi1" style="left:560px;top:1010px">Pronta ✓</div>`;
CARDS.forEach(c=>EV.push(['swoosh',c.a])); PROB.forEach(p=>EV.push(['swoosh',p.a]));
// ---------- lista do CTA ----------
const ITEMS=['Apaga à noite','Desbotada','Não lê de longe','Texto demais','Logo diferente'];
$('list').innerHTML=ITEMS.map((s,i)=>`<div class="row" id="li${i}" style="top:${520+i*118}px"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="none" stroke="#D4D4D8" stroke-width="3.5"/>
  <circle id="lcf${i}" cx="32" cy="32" r="30" fill="#1E3A8A" opacity="0"/><path id="lck${i}" d="M19 33 L28 42 L46 23" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>${s}</div>`).join('');
const CK=ITEMS.map((_,i)=>M.marcou+.25+i*.2); CK.forEach(x=>EV.push(['check',x]));
// ---------- barras da placa lotada ----------
const BARS=[[-290,-150,250],[60,-150,230],[-290,-110,180],[100,-110,190],[-290,90,220],[40,90,250],[-290,130,170],[80,130,210],[-290,-60,120],[180,-60,110]];
$('bars').innerHTML=BARS.map(([x,y,w],i)=>`<rect id="br${i}" x="${x}" y="${y}" width="${w}" height="16" rx="8"/>`).join('');
[[M.cinco,'pop'],[M.escurece,'toggle'],[M.soltando+.15,'tick'],[M.carro,'swoosh'],[M.diferente,'pop'],[M.enigrafi,'chime']].forEach(([t,k])=>EV.push([k,t]));
const CTR=[[M.primeiro,'1/5'],[M.segundo,'2/5'],[M.terceiro,'3/5'],[M.quarto,'4/5'],[M.quinto,'5/5']];
function seek(t){
  const S=$('stage');
  // noite no sinal 1
  const nt=0;
  S.style.background=hexmix('#FAFAFA','#1C2230',nt); S.style.setProperty('--ink',hexmix('#18181B','#F4F4F5',nt)); S.style.setProperty('--key',hexmix('#1E3A8A','#9DB7FF',nt)); S.style.setProperty('--mut',hexmix('#71717A','#A1A1AA',nt));
  // legendas
  for(const c of CW){ const li=c.li, i=seg(t,c.a-.04,c.a+.36), o=seg(t,LE[li],LE[li]+.24), e=$(c.id); e.style.opacity=(i*(1-o)).toFixed(3); e.style.transform=`translateY(${((1-i)*20-o*14).toFixed(2)}px)`; }
  // contador
  const ci=CTR.filter(([a])=>t>=a).length, ce=$('ctr'); ce.textContent=ci?CTR[ci-1][1]:''; ce.style.opacity=(seg(t,M.primeiro,M.primeiro+.35)*(1-seg(t,M.marcou,M.marcou+.3))).toFixed(3);
  // fachada de linha: gancho + sinais 1 e 2
  const fA=win(t,0,M.cinco-.35,.1,.3), fB=win(t,M.primeiro+.1,M.some-.2,.1,.25), fC=win(t,M.segundo+.1,M.soltando+1.0,.1,.25), fv=Math.max(fA,fB,fC);
  const drawP=t<M.cinco?seg(t,0,.7):t<M.segundo?seg(t,M.primeiro+.1,M.primeiro+.8):seg(t,M.segundo+.1,M.segundo+.8);
  ['fO','fB','fW1','fW2','fD'].forEach((id,i)=>{const e=$(id); dash(e,cl(drawP*1.3-i*.08)); e.style.opacity=fv.toFixed(3);});
  // sinal 1: a loja some no escuro
  if(t>M.primeiro&&t<M.segundo){ const fade=1-.85*seg(t,M.some-.6,M.some+.1); ['fO','fB','fW1','fW2','fD'].forEach(id=>$(id).style.opacity=(fv*fade).toFixed(3)); }
  // sinal 2: faixa colorida desbota e uma peça cai
  const bandOn=t>M.segundo?fC:(t>M.primeiro?fB*(1-.85*seg(t,M.some-.6,M.some+.1)):fA);
  const sat=1-seg(t,M.desbotada-.05,M.desbotada+.9);
  $('fBf').setAttribute('fill',t>M.segundo?hexmix('#A1A1AA','#1E3A8A',sat):'#1E3A8A'); $('fBf').setAttribute('opacity',(bandOn*(t>M.cinco-.35&&t<M.primeiro+.1?0:1)).toFixed(3));
  $('fT').setAttribute('opacity',$('fBf').getAttribute('opacity'));
  const pc=$('fPiece'), pd=seg(t,M.soltando,M.soltando+.45); pc.setAttribute('fill',hexmix('#A1A1AA','#1E3A8A',sat)); pc.setAttribute('opacity',(t>M.segundo?fC:0).toFixed(3));
  pc.setAttribute('transform',`translate(${(14*pd).toFixed(1)} ${(46*pd).toFixed(1)}) rotate(${(24*pd).toFixed(2)} 185 -117)`);

  const mx=t<1.7?lerp(130,520,seg(t,.15,1.7)):t<2.9?520:lerp(520,980,seg(t,2.9,4.4)); const mw=(t>.15&&t<1.7)||(t>2.9&&t<4.4)?Math.sin(t*11):0;

  $('mLeg').setAttribute('d',`M${(-22*mw).toFixed(1)} 20 L0 -40 L${(22*mw).toFixed(1)} 20`); $('mArm').setAttribute('d',`M${(18*mw).toFixed(1)} -40 L0 -84 L${(-18*mw).toFixed(1)} -40`);
  // "5" grande vira o contador
  const b5=$('big5'), g=seg(t,M.primeiro-.35,M.primeiro+.05); b5.style.opacity=(seg(t,M.cinco-.2,M.cinco+.25)*(1-g)).toFixed(3);
